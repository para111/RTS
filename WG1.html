<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>完整原型</title>
  <script src="phaser.min.js"></script>
  <script src="SpinePlugin.min.js"></script>
  <!-- 单位数值的唯一真源是 unit_database.sql，经 build_unit_db.py 生成 unit_db.js（需与本文件同目录） -->
  <script src="unit_db.js"></script>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<script>
  // 禁用浏览器右键菜单，保留游戏内右键操作
  document.addEventListener('contextmenu', event => event.preventDefault());

  // ----------------------------------------------------
  // 1. 全局配置与基础变量
  // ----------------------------------------------------
  const config = {
    type: Phaser.AUTO,
    width: 1920,
    height: 1080,
    backgroundColor: '#1b1b2f',
    physics: {
      default: 'arcade',
      arcade: { debug: false }
    },
    scale: {
      // FIT：视野窗口固定 1920×1080 并完整可见。ENVELOP 会把画布放大到铺满整个窗口，
      // 超出 16:9 的部分被裁掉，玩家反而看不全视野范围
      mode: Phaser.Scale.FIT,
      width: 1920,
      height: 1080,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    plugins: {
      scene: [
        {
          key: 'SpinePlugin',
          plugin: window.SpinePlugin,
          mapping: 'spine'
        }
      ]
    },
    scene: { preload, create, update }
  };

  new Phaser.Game(config);

  // ----------------------------------------------------
  // 单位数据库（7 张表）
  // 唯一真源是 unit_database.sql：正式字段沿用 RTS.xlsx 的设计——
  //   unit_id / unit_name / cost / build_time / max_hp / armor / move_speed /
  //   action_range / action_value / action_cd / target_type（0 = 敌方单位，1 = 我方单位）/
  //   armor_penetration，另补充代码内使用的静态数值（阵型、碰撞体、红区净空、回血、自爆、动画等）。
  // 我方可招募：步兵 / 重甲 / 支援，另有战场雇佣单位（临时增援）；敌方：步兵 / 重甲 / 支援。
  // 改数值的流程：编辑 unit_database.sql -> 运行 `python build_unit_db.py` 生成 unit_db.js，
  // 本文件只读取与校验，不再内置任何单位数值；下方常量一律从记录派生。
  // 之所以生成 .js 而不是 .json：WG.html 直接用 file:// 打开，fetch 本地 .json 会被 CORS 拦截，
  // 而同目录的 <script src="unit_db.js"> 在 file:// 下可正常加载，因此 unit_db.js 必须与 WG.html 同目录。
  // ----------------------------------------------------
  const UNIT_DB = window.UNIT_DB;
  if (!UNIT_DB || !UNIT_DB.database) {
    const message = '单位数据库未加载：请先在当前目录运行 `python build_unit_db.py`，'
      + '由 unit_database.sql 生成 unit_db.js（需与 WG.html 同目录）。';
    window.alert(message);
    throw new Error(message);
  }
  const UNIT_DATABASE = UNIT_DB.database;   // 表名 -> 记录数组（不适用或未填的列不出现在记录里）

  // 按 unit_id 取一条单位记录（数据库为空或查不到时返回 null）
  function getUnitRecord(table, unitId) {
    const rows = UNIT_DATABASE[table] || [];
    return rows.find(row => row.unit_id === unitId) || null;
  }

  // 取现役单位的记录：查不到就直接报错，避免后面读到 undefined 才崩
  function requireUnitRecord(table, unitId) {
    const record = getUnitRecord(table, unitId);
    if (!record) {
      const message = `单位数据库缺少记录 ${table}.${unitId}，`
        + '请检查 unit_database.sql 后重新运行 build_unit_db.py。';
      window.alert(message);
      throw new Error(message);
    }
    return record;
  }

  // 当前场上的兵种：我方步兵 JF、敌方步兵 Vespid
  const ACTIVE_PLAYER_RECORD = requireUnitRecord('player_infantry', 'JF');
  const ACTIVE_ENEMY_RECORD = requireUnitRecord('enemy_infantry', 'Vespid');

  // 读取记录里的数值列：列缺失、值为 NULL、不是数字、不满足范围约束都会立刻弹窗并抛错。
  // 宁可开局就停在明确的错误上，也不要让 undefined / NaN 混进几何与伤害计算里静默出错
  function readUnitNumber(record, label, column, options) {
    const opts = options || {};
    const value = record[column];
    const fail = reason => {
      const message = `单位数据库的 ${label}.${column} ${reason}。`
        + '请检查 unit_database.sql 后重新运行 build_unit_db.py。';
      window.alert(message);
      throw new Error(message);
    };
    if (value === undefined || value === null) fail('没有填值');
    if (typeof value !== 'number' || Number.isNaN(value)) fail(`不是数值（${String(value)}）`);
    if (opts.integer && !Number.isInteger(value)) fail('必须是整数');
    if (opts.min !== undefined && value < opts.min) fail(`小于允许的最小值 ${opts.min}`);
    if (opts.max !== undefined && value > opts.max) fail(`大于允许的最大值 ${opts.max}`);
    return value;
  }

  // 两边单位共用的取值入口：所有单位数值都在下方按列名实时从数据库记录读出来
  const playerNumber = (column, options) => readUnitNumber(ACTIVE_PLAYER_RECORD, 'player_infantry.JF', column, options);
  const enemyNumber = (column, options) => readUnitNumber(ACTIVE_ENEMY_RECORD, 'enemy_infantry.Vespid', column, options);

  // 移动 / 攻击数值一律取自出战单位的数据库记录，不再另设常量
  const UNIT_SPEED = ACTIVE_PLAYER_RECORD.move_speed;                      // 187.5（人物标定 50×50 后按同比例标定，观感速度不变）
  const PLAYER_ATTACK_RANGE = ACTIVE_PLAYER_RECORD.action_range;           // 300（射程按要求不随人物尺寸缩放）
  const PLAYER_ATTACK_INTERVAL = ACTIVE_PLAYER_RECORD.action_cd * 1000;    // 0.65s -> 650ms

  // 射程提示：沿射程圆均匀排布的短宽白线（带黑色边框），线沿切线方向铺开、彼此留有间隔。
  // 单个标记占用的弧长固定，射程越大数量越多（有上下限）；
  // 线的长宽取固定像素值，因此任何射程下大小一致、只改变数量
  const PLAYER_RANGE_MARKER_COLOR = 0xffffff;            // 白色线芯
  const PLAYER_RANGE_MARKER_OUTLINE_COLOR = 0x000000;    // 黑色边框
  const PLAYER_RANGE_MARKER_WIDTH = 10;                  // 白色线芯宽（像素，固定值）
  const PLAYER_RANGE_MARKER_LENGTH = 10;                 // 线长（像素，固定值，沿切线方向）
  // 黑色边框只占线宽的 10%：线芯 10 像素、黑边每侧 0.5 像素（总宽 11 像素，黑边占约 9%）
  const PLAYER_RANGE_MARKER_OUTLINE_EXTRA = PLAYER_RANGE_MARKER_WIDTH * 0.1 / 2;
  const PLAYER_RANGE_MARKER_SLOT = 28;                   // 单个标记占用的弧长 (px)，决定标记之间的间隔
  const PLAYER_RANGE_MARKER_MIN_COUNT = 16;              // 标记数量下限
  const PLAYER_RANGE_MARKER_MAX_COUNT = 72;              // 标记数量上限
  // 循环流动：全部标记沿射程圆按该角速度整体匀速转动 (rad/ms)
  const PLAYER_RANGE_MARKER_FLOW_SPEED = 0.0004;

  // 射程圆上的短宽白线：中点落在射程圆上、沿切线铺开，选中时逐帧重绘。
  // 分两遍画（先黑边框打底、再白色线芯覆盖），得到黑色边框的白色线；
  // 整圈标记按 time 匀速转动，形成循环流动的动画
  function drawAttackRangeMarkers(graphics, centerX, centerY, radius, time) {
    const count = Phaser.Math.Clamp(
      Math.round((Math.PI * 2 * radius) / PLAYER_RANGE_MARKER_SLOT),
      PLAYER_RANGE_MARKER_MIN_COUNT,
      PLAYER_RANGE_MARKER_MAX_COUNT
    );
    const flow = (time || 0) * PLAYER_RANGE_MARKER_FLOW_SPEED;
    for (let pass = 0; pass < 2; pass++) {
      const outline = pass === 0;
      const extra = outline ? PLAYER_RANGE_MARKER_OUTLINE_EXTRA : 0;
      const halfLength = PLAYER_RANGE_MARKER_LENGTH / 2 + extra;
      graphics.lineStyle(
        PLAYER_RANGE_MARKER_WIDTH + extra * 2,
        outline ? PLAYER_RANGE_MARKER_OUTLINE_COLOR : PLAYER_RANGE_MARKER_COLOR,
        1
      );
      graphics.beginPath();
      for (let index = 0; index < count; index += 1) {
        const angle = (Math.PI * 2 * index) / count + flow;
        const dirX = Math.cos(angle);
        const dirY = Math.sin(angle);
        // 线沿切线铺开（切线 = 半径方向转 90°），所以线始终与射程圆相切
        const lineX = centerX + dirX * radius;
        const lineY = centerY + dirY * radius;
        const offsetX = -dirY * halfLength;
        const offsetY = dirX * halfLength;
        graphics.moveTo(lineX - offsetX, lineY - offsetY);
        graphics.lineTo(lineX + offsetX, lineY + offsetY);
      }
      graphics.strokePath();
    }
  }

  // 集火标记的单个角括号：以角点 (bx, by) 为基准画一条 L 形的红色圆角边线。
  // ox/oy 是该角「向外」的对角方向（±1），两条臂都朝框内延伸 arm 像素，
  // 拐角处用半径 radius 的圆弧过渡（圆角），形成开口朝向角色中心的括号。
  // 调用方已把动画偏移代入角点坐标，因此整条括号随动画沿对角方向平移（向外/向内反复）
  function drawFocusCornerBracket(graphics, bx, by, ox, oy, arm, radius) {
    const ix = -ox;   // 朝框内的方向
    const iy = -oy;
    const cx = bx + ix * radius;   // 圆角圆心
    const cy = by + iy * radius;
    // 水平臂：从最远端到圆角起点
    graphics.moveTo(bx + ix * arm, by);
    graphics.lineTo(bx + ix * radius, by);
    // 圆角圆弧：从 (bx + ix·r, by) 转到 (bx, by + iy·r)，扫过 90°。
    // 圆心到两端的角度分别是 -iy·90° 与 ix>0 ? 180° : 0°；
    // ix 与 iy 同号时角度递减、异号时递增（两种情况都正好扫过 90°）
    const startAngle = -iy * Math.PI / 2;
    const sweep = ix === iy ? -Math.PI / 2 : Math.PI / 2;
    const segments = 4;
    for (let step = 1; step <= segments; step++) {
      const angle = startAngle + sweep * (step / segments);
      graphics.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
    }
    // 垂直臂：从圆角终点到最远端
    graphics.lineTo(bx, by + iy * arm);
  }

  // 世界尺寸 = 地图贴图 Stage4-hd.png 的原始像素：世界坐标就是贴图像素，
  // 地图 1:1 铺开、不再被拉伸变形（旧版把 3795×3026 的贴图压进 1920×1080，圆被压成椭圆）
  const WORLD_WIDTH = 3795;
  const WORLD_HEIGHT = 3026;
  // 游戏视野（相机窗口）固定为 1920×1080：世界大于视野，其余部分靠中键拖动 / 滚轮缩放查看
  const VIEW_WIDTH = config.width;
  // 最小缩放 = 地图宽度正好铺满视野宽度（1920 / 3795 ≈ 0.5061）：
  // 此时可视范围 1920×2134 完全落在地图 3795×3026 内，任何缩放级别都不会露出地图以外的空白背景
  // （若取高度方向铺满的 1080/3026 ≈ 0.3569 可整图总览，但可视宽度 5380 > 地图宽，两侧会露出空白）
  const CAMERA_ZOOM_MIN = config.width / WORLD_WIDTH;
  const CAMERA_ZOOM_DEFAULT = 1.2;              // 开局缩放：视野是地图上 1600×900 的一块区域（1 倍时恰为 1920×1080）
  const CAMERA_ZOOM_MAX = 3;                    // 最大缩放：镜头贴近屏幕
  // 敌军三波路线：出生点都在地图外，生成后从地图右侧走进地图，再向左侧推进
  const ENEMY_HOLD_DURATION = enemyNumber('hold_duration', { integer: true, min: 0 });
  // 待机巡逻范围：以「当前行动点」（每次进入待机时的位置）为圆心，
  // 巡逻目标与巡逻过程中的位移都不会超出这个半径，敌军不会四处乱跑
  const ENEMY_PATROL_RADIUS = enemyNumber('patrol_radius', { min: 0 });
  const ENEMY_PATROL_MIN_RADIUS = enemyNumber('patrol_min_radius', { min: 0 });
  // 巡逻硬约束的容差：碰撞隔离会把挤在同一个行动点上的单位推开，
  // 留出这点余量，折返判定才不会和隔离推挤互相拉扯
  const ENEMY_PATROL_SLACK = enemyNumber('patrol_slack', { min: 0 });
  // 敌军出生点在地图右边界之外：生成后先沿入场线走进地图，进入地图才切回常规路线逻辑
  const ENEMY_SPAWN_OFFMAP_PADDING = enemyNumber('spawn_offmap_padding', { min: 0 });
  const ENEMY_ROUTE_ENTRY_COUNT = 1;           // 每条路线在地图外新增的入场节点数量
  // 抵达路线终点之后的自由待机：不再把「路径终点」当成唯一落点，
  // 而是把终点当作一个待机区域，单位在区域里随机挑落点散步、走到就随机静止一段时间。
  // 大批单位因此不会全部挤在同一个终点上互相推挤、反复起停，终点区域的移动与几何计算量随之下降
  const ENEMY_ENDPOINT_ROAM_RADIUS = enemyNumber('endpoint_roam_radius', { min: 0 });      // 终点待机区域的半径 (px)
  const ENEMY_ENDPOINT_IDLE_MIN = enemyNumber('endpoint_idle_min', { integer: true, min: 0 });        // 到位后随机静止时长下限 (ms)
  const ENEMY_ENDPOINT_IDLE_MAX = enemyNumber('endpoint_idle_max', { integer: true, min: 0 });        // 到位后随机静止时长上限 (ms)
  // 终点单位被隔离推挤或追踪带到这个距离之外时，不再靠「朝终点直线插过去」回位：
  // 那条直线可能横穿红区，而从地图边缘死角出发时转向判定会一直返回空，单位就永远回不到终点。
  // 超过这个距离直接交回常规路线推进逻辑走回终点（留 4 倍隔离余量，避免边缘单位来回抖动）
  const ENEMY_ENDPOINT_RETURN_DISTANCE = ENEMY_ENDPOINT_ROAM_RADIUS
    + ENEMY_PATROL_SLACK * enemyNumber('endpoint_return_slack_factor', { min: 0 });
  // 移动路线走廊：每条主路线在 ±ENEMY_ROUTE_CORRIDOR 的走廊内生成 5 条随机变体，
  // 单位每次从行动点出发时重新随机挑一条，多支敌军因此不会挤在同一条线上。
  // 走廊收窄到 38 像素（< 40）：右侧出生点附近的可行走带本来就窄，
  // 走廊过宽会把变体节点推出可行走区或推进红区，生成时还会再逐点校验一次。
  // 走廊半宽按需求保持在 40 像素以内，因此不随人物尺寸（50×50）放大：
  // 敌方碰撞半径 20.5 像素时车道比单位还窄，变体节点校验失败会回退到主路线，
  // 只是随机分流的效果变弱，不会把单位推出可行走区
  const ENEMY_ROUTE_CORRIDOR = enemyNumber('route_corridor', { min: 0 });             // 走廊半宽 (px)，变体节点最大偏移 0.98 × 该值
  const ENEMY_ROUTE_VARIANT_COUNT = enemyNumber('route_variant_count', { integer: true, min: 1 });         // 每条主路线的随机变体数量
  // 敌方单位碰撞体半径：隔离距离是「两个半径之和」，单个半径取其一半。
  // 数值取自 unit_database.sql 的 collision_radius 列
  const ENEMY_COLLISION_RADIUS = ACTIVE_ENEMY_RECORD.collision_radius;   // 20.5（11 × 1.875）
  // 单位间碰撞隔离：两个敌方单位贴近到隔离半径以内就互相推开，避免叠成一坨
  const ENEMY_SEPARATION_DISTANCE = ENEMY_COLLISION_RADIUS * 2;  // 单位间的隔离半径 (px)，= 41
  const ENEMY_SEPARATION_STRENGTH = enemyNumber('separation_strength', { min: 0, max: 1 });         // 每帧推开重叠量的比例（各承担一半）
  const ENEMY_SEPARATION_MAX_PUSH = enemyNumber('separation_max_push', { min: 0 });         // 每帧每个单位的最大推挤位移 (px)，避免瞬时弹开
  // 隔离用的空间哈希格子边长：取隔离距离本身，任意一对重叠单位必然落在 3×3 邻域内
  const ENEMY_SEPARATION_CELL = ENEMY_SEPARATION_DISTANCE;
  // 地图内敌方单位数量上限：低于上限按各波次节奏自动补充，达到上限后停止生成
  const ENEMY_MAX_COUNT = 100;
  const ENEMY_RED_ZONE_CLEARANCE = ACTIVE_ENEMY_RECORD.red_zone_clearance;   // 19
  // 我方每名队员与红色屏蔽区边缘都必须保持 19 像素净空（对应需求里「3 个像素点」的间距要求）：
  // 该值同时决定绕行曲线（沿红区外沿的等距轮廓）与逐帧推离的安全带宽度，
  // 队员各自再按阵型单独校验一次，因此贴近红区行走时也不会有人物挤进屏蔽区
  const PLAYER_RED_ZONE_CLEARANCE = ACTIVE_PLAYER_RECORD.red_zone_clearance;   // 19
  // 敌军智能追踪参数：我方单位一进入追踪范围（160 像素）就激活追踪，
  // 追踪期间以 150 像素/秒恒定逼近，追到默认攻击范围边缘（停火距离，同一 100 像素）即停住交火；
  // 姿态随距离即时切换：我方人形在攻击范围内时姿态恒为攻击动作（循环保持），
  // 首次进入与重新进入都不经过等待动作，移出攻击范围立刻打断攻击动画转入移动动画；
  // 只有拉开到追踪范围之外才放弃追踪，随即从当前位置走向下一个行动点
  const ENEMY_TRACK_SPEED = ACTIVE_ENEMY_RECORD.move_speed;   // 追踪状态下的移动速度（像素/秒），150
  const ENEMY_TRACK_STOP_DISTANCE = ACTIVE_ENEMY_RECORD.action_range;   // 停火距离：必须与下方的 ENEMY_ATTACK_RANGE 保持同一数值（同取 action_range），追到攻击范围边缘就站定交火
  const ENEMY_REPLAN_COOLDOWN = enemyNumber('replan_cooldown', { integer: true, min: 0 });           // 绕行重规划失败后的重试冷却 (ms)
  const ENEMY_STUCK_TIME = enemyNumber('stuck_time', { integer: true, min: 0 });               // 想走却几乎没动多久判定为被卡住 (ms)
  const ENEMY_STUCK_DISTANCE = enemyNumber('stuck_distance', { min: 0 });              // 被卡住判定所需的位移阈值 (px)
  // 红区绕行参数：直线被红区阻断时，一律改用沿红区外沿 19 像素的等距轮廓曲线抵达终点
  const RED_CLEARANCE_TOLERANCE = 0.001;       // 位置推离/阵型贴边的亚像素容差（保持足额净空）
  // 红区几何查询的帧内记忆化（单表 + 整数键）：isWalkable / isRedClearanceSafePoint 的结果
  // 只取决于坐标与碰撞配置，而 collisionRegions 全程只读，所以同一帧内按坐标缓存不会脏读。
  // 实测 100 单位满编时 isWalkable 每帧被调用 2465 次但只有 720 个唯一坐标、
  // isRedClearanceSafePoint 976 次/594 个唯一坐标——缓存能省掉大部分多边形与线段距离计算。
  // 缓存每帧开头清空一次：既保证不跨帧脏读，也把容量限制在单帧查询量的量级。
  // 两种查询合并进同一张表：低 16 位记「哪些查询已算过」，高 16 位记对应结论，
  // 于是可行走与净空判定共用同一条记录、同一个键（原先各拼一次字符串键、各查一次表）。
  // 坐标按 1/8 像素量化：量化误差 0.125px 远小于 38 像素安全带与路径容差，
  // 而键因此恒为 32 位小整数（SMI），Map 查找不再为字符串做哈希与临时分配。
  // 倍率取 8 而不是 16：单轴索引只有 16 位（±32767），1/16 像素下只能覆盖 ±2048px，
  // 而世界已按地图原始像素铺开到 3795×3026（地图外入场点约 4013），1/8 像素下覆盖 ±4096px 才够用
  const POINT_QUERY_SCALE = 8;
  const POINT_QUERY_AXIS_MIN = -32768;
  const POINT_QUERY_AXIS_MAX = 32767;
  const POINT_QUERY_WALKABLE = 1;               // 低位区：可行走结论已计算
  const POINT_QUERY_WALKABLE_RESULT = 1 << 16;  // 高位区：可行走结论为真
  const POINT_QUERY_RESULT_SHIFT = 16;
  const pointQueryCache = new Map();
  const clearanceQueryBits = new Map();         // 净空宽度 → 该净空在低位区占用的位
  let nextClearanceQueryBit = 2;

  // 坐标 → 整数键：x 放高位、y 放低 16 位，两个轴都夹取到 16 位有符号范围。
  // 夹取只会把 ±4096 像素以外的点并到同一个键上，而那些点必然在地图外（不可行走、不净空），
  // 共用一条记录不会改变结论，键却能始终压在 SMI 范围内
  function getPointQueryKey(x, y) {
    const qx = Math.min(POINT_QUERY_AXIS_MAX, Math.max(POINT_QUERY_AXIS_MIN, Math.round(x * POINT_QUERY_SCALE)));
    const qy = Math.min(POINT_QUERY_AXIS_MAX, Math.max(POINT_QUERY_AXIS_MIN, Math.round(y * POINT_QUERY_SCALE)));
    return qx * 65536 + qy;
  }

  // 位用尽时返回 0，调用方据此跳过缓存（直接计算），结论不受影响
  function getClearanceQueryBit(clearance) {
    let bit = clearanceQueryBits.get(clearance);
    if (bit === undefined) {
      if (nextClearanceQueryBit > 1 << 14) return 0;
      bit = nextClearanceQueryBit;
      nextClearanceQueryBit <<= 1;
      clearanceQueryBits.set(clearance, bit);

    return bit;
  }

  let detourCandidatesCache = [];

  function getCollisionSegmentBounds() {
    if (collisionSegmentBoundsCache && collisionSegmentBoundsVersion === collisionRegionVersion) {

    }
    collisionSegmentBoundsCache = collisionRegions.lineSegments.map(segment => ({
      minX: Math.min(segment.start.x, segment.end.x),
      maxX: Math.max(segment.start.x, segment.end.x),
      minY: Math.min(segment.start.y, segment.end.y),
      maxY: Math.max(segment.start.y, segment.end.y)
    }));

  let redQueryFrame = 0;

    pointQueryCache.clear();
    redQueryFrame += 1;
  }

  // 与帧号、与是谁在走都无关，所以可以跨帧复用，只在碰撞配置被改写时清空。
  // 键用对象同一性而不是拼字符串：两级 WeakMap 免去哈希与临时键分配，
  // 键对象（临时转向点、路径点）随自身被回收，表不会长期膨胀。

  // 缓存后单次规划的红区距离计算量被压到一遍；这是贴边绕行时最大的一处开销

    if (!memo) {

      bySlack.set(slack, memo);

    } else {

      memo.set(from, byTo);

  // 走廊变体的安全校验：车道偏移有可能把节点推出可行走区，或者推进红区的安全带之内
  // （右侧出生点附近的可行走带本来就窄，地图外的入场节点也容易斜插到屏蔽区上），
  // 所以这里再逐点校验一遍：不安全的节点一律退回同序号的主路线节点；
  // 入场节点整体位于地图之外，其 Y 跟随第一个地图内节点，保证入场线不会斜插进屏蔽区。
  // 校验依赖碰撞区域与红区判定，因此放在 collisionRegions 定义之后执行。
  enemyRoutes.forEach(route => {
    route.variants = route.variants.map(points => {
      const safePoints = points.map((point, index) => {
        if (index === 0) return { x: point.x, y: point.y };
        const base = route.points[index - 1];
        const safe = isWalkable(point.x, point.y) &&
          isRedClearanceSafePoint(point.x, point.y, ENEMY_RED_ZONE_CLEARANCE);
        return safe ? point : { x: base.x, y: base.y };
      });
      safePoints[0].y = safePoints[1].y;
      return safePoints;
    });
  });


  // RTS 玩家单位状态：我方小队可以同时存在多支（GRF1 每次生成一支），
  // 因此所有小队级状态都收进 squad 对象，逻辑函数统一以 squad 作为第一个参数。
  // 小队字段与原先的整套全局变量一一对应：
  //   unit       隐藏的物理锚点（整队移动与索敌用），isSpawned / isSelected / isMoving 等标记挂在它身上
  //   character  队长 Daiyan 的 Spine 对象，沿用原有动画流程
  //   members    三名队员：{ key, uid, squad, slot, isLeader, character, body, renderX, renderY }
  //   forward    行进方向：三角阵型的站位固定在屏幕上，不受它影响
  //   freeBlend / morphProgress    三角阵型 <-> 自由散开之间的过渡（缓动值与线性进度）
  //   squeezed / freeActive / regrouping   贴红区自由移动与脱区归位的状态机
  //   slotAssignment / slotSwapped 队员 -> 三角站位：只固定「队形形状」，不固定谁站哪个位置
  //   moveTarget / detourPath / replanKey / moveProgress  移动指令与进度看门狗
  //   animName / animLockName / animLockUntil             动画流程状态（重复下发同名动画会重置到第一帧）
  let playerSquads = [];
  let squadSerial = 0;

  function createSquadState(x, y) {
    return {
      id: ++squadSerial,
      unit: null,
      character: null,
      members: [],
      forward: { x: 0, y: -1 },
      freeBlend: 0,
      morphProgress: 0,
      squeezed: false,
      freeActive: false,
      regroup: false,
      slotAssignment: {},
      slotSwapped: true,
      moveTarget: null,
      detourPath: [],
      replanKey: null,
      replanAt: 0,
      // 出售面板（黄色圆环 + 六边形「$」按钮）是否展开：双击单位才呼出
      sellPanelOpen: false,
      // 跨小队挤压的持久阵型偏移：多支小队汇聚/擦肩时整队平移避让，向 0 平滑收敛，
      // 避免不同小队的队员互相压进（与队内隔离 separatePlayerSquadPairs 互补）
      crowdX: 0,
      crowdY: 0,
      // 进度看门狗：途经点进度（nodes / distance）与「到终点的最近距离记录」两个通道，
      // 贴边绕行时途经点可能长时间不推进，靠 closestDistance 区分「真的卡住」与「绕远路中」
      moveProgress: {
        nodes: Infinity,
        distance: Infinity,
        closestDistance: Infinity,
        stalledSince: 0,
        retries: 0
      },
      animName: null,
      animLockName: null,
      animLockUntil: 0,
      spawnAnimation: null,
      spawnX: x,
      spawnY: y
    };
  }

  function hasSpawnedPlayerSquad() {
    return playerSquads.some(squad => squad.unit && squad.unit.isSpawned);
  }

  function getSpawnedPlayerSquads() {
    return playerSquads.filter(squad => squad.unit && squad.unit.isSpawned);
  }

  // 世界坐标上的一次单击：先判敌方（集火），再判我方（单选），都没命中就不改变选择。
  // 敌方是 Spine 对象、setInteractive 的 hit area 依赖骨架包围盒并不可靠，
  // 因此这里统一按「点击点到单位锚点的距离」做命中判定（半径见 ENEMY_CLICK_RADIUS）。
  // 返回命中结果，便于浏览器测试直接调用同一套判定
  function handleWorldClick(clickX, clickY) {
    let hitEnemy = null;
    let hitEnemyDistance = Infinity;
    if (enemiesGroup) {
      enemiesGroup.getChildren().forEach(enemy => {
        if (!enemy.active || enemy.charging) return;
        const distance = Phaser.Math.Distance.Between(clickX, clickY, enemy.x, enemy.y);
        if (distance <= ENEMY_CLICK_RADIUS && distance < hitEnemyDistance) {
          hitEnemyDistance = distance;
          hitEnemy = enemy;
        }
      });
    }
    if (hitEnemy) {
      // 点击敌方单位设为集火目标（不要求它已在我方射程内）：
      // 射程覆盖它的我方单位会立刻优先攻击它，其余单位在进入射程后也会优先打它。
      // 再次点击同一个目标则取消集火
      const cancel = focusTarget === hitEnemy;
      focusTarget = cancel ? null : hitEnemy;
      return { enemy: hitEnemy, focused: !cancel };
    }
    // 未命中敌人：命中某支我方小队则单独选中该队（其余取消选中）。
    // 命中半径取略大于阵型外接半径，点击任意队员都能选中整支小队
    let hitSquad = null;
    getSpawnedPlayerSquads().forEach(squad => {
      if (hitSquad) return;
      if (Phaser.Math.Distance.Between(clickX, clickY, squad.unit.x, squad.unit.y) <= PLAYER_SINGLE_CLICK_RADIUS) {
        hitSquad = squad;
      }
    });
    if (hitSquad) {
      const now = gameScene ? gameScene.time.now : 0;
      // 双击同一支小队即呼出 / 收起出售圆环；单击只选中，不显示出售面板
      const isDouble = hitSquad === lastClickSquad && now - lastClickAt <= DOUBLE_CLICK_MS;
      lastClickSquad = hitSquad;
      lastClickAt = now;
      const sellOpen = isDouble ? !hitSquad.sellPanelOpen : false;
      getSpawnedPlayerSquads().forEach(squad => {
        squad.unit.isSelected = squad === hitSquad;
        squad.sellPanelOpen = squad === hitSquad ? sellOpen : false;
      });
      return { squad: hitSquad, sell: sellOpen };
    }
    // 既没点到我方单位、也没点到敌方单位（点在空地上）：取消全部选中并收起出售圆环
    lastClickSquad = null;
    getSpawnedPlayerSquads().forEach(squad => {
      squad.unit.isSelected = false;
      squad.sellPanelOpen = false;
    });
    return { cleared: true };
  }

  // 多小队同点移动时的落点散布半径：随小队数量自适应增大。落点按正 N 边形分布时，
  // 相邻两支小队的锚点间距 = 2·r·sin(π/N)。要保证两支小队的三角阵型（单边
  // formation_side 像素）在落点上不互相压进、不同小队的队员间距不低于跨队最小间距，
  // 相邻锚点间距至少要有 formation_side + PLAYER_CROSS_SQUAD_SEPARATION：
  //   r = (formation_side + cross) / (2·sin(π/N))
  // 小队越多 N 越大 r 越大（N=2 时两队分居圆环两端，r 取所需间距的一半）。
  // 下限保留 PLAYER_SQUAD_ORDER_SPREAD，避免两三支小队也把落点铺得过大。
  // 少了这一步，多队点到同一处时各队阵型会互相压进、队员叠在一起
  function getPlayerSquadOrderSpread(total) {
    if (total <= 1) return 0;
    const minAnchorGap = PLAYER_SQUAD_FORMATION_SIDE + PLAYER_CROSS_SQUAD_SEPARATION;
    const needed = minAnchorGap / (2 * Math.sin(Math.PI / total));
    return Math.max(PLAYER_SQUAD_ORDER_SPREAD, needed);
  }

  // 多小队同点移动时的落点散布：n 支小队在终点周围的正 n 边形顶点上各占一个落点，
  // 第一支从正上方开始排，顺序稳定（不会因为选中顺序抖动而互相换位）。
  // 圆环半径取 getPlayerSquadOrderSpread：随小队数放大到阵型互不压入，
  // 全部小队因此都落在点击点周围的一小圈内，而不是散在点外
  function getPlayerSquadOrderOffset(index, total) {
    if (total <= 1) return { x: 0, y: 0 };
    const spread = getPlayerSquadOrderSpread(total);
    const angle = -Math.PI / 2 + (Math.PI * 2 * index) / total;
    return { x: Math.cos(angle) * spread, y: Math.sin(angle) * spread };
  }

  // 多小队同点移动的最终落点分配：先按圆环给每支小队分一个落点，
  // 落点若压在红色屏蔽区、屏蔽区安全带或可行动区之外，就从理想落点向外做「最小挪动」搜索：
  // 一圈一圈加大挪动距离，每圈按 PLAYER_SQUAD_ORDER_SEARCH_DIRECTIONS 的顺序换方向；
  // 每个候选还要与已定落点保持 squad_order_spread 的间距，站不下就继续换。
  // 少了这一步，各队终点的红区吸附会独立生效，把相邻两个落点挤到同一块地面上，
  // 多支小队叠在一起（队员互相压住），而被挤进不可行动区的落点根本走不到，
  // 看起来像只有一支队伍抵达
  function resolvePlayerSquadOrderGoals(centerX, centerY, total) {
    if (total <= 1) return [{ x: centerX, y: centerY }];
    const spread = getPlayerSquadOrderSpread(total);
    const safe = (x, y) => isWalkable(x, y) && isRedClearanceSafePoint(x, y, PLAYER_RED_ZONE_CLEARANCE);
    // 正 N 边形理想落点的相邻间距恰好等于 spread，浮点误差会让它差出亚像素而误判为「过近」，
    // 把本来站得下的理想落点整批挪走、落点间距被压小。这里留 1 像素容差：间距低于
    // spread - 1 才算真正过近，理想落点只有在真实被挡时才进入挪动搜索
    const spaced = (x, y, placed) => placed.every(goal => Math.hypot(goal.x - x, goal.y - y) >= spread - 1);
    const goals = [];
    for (let index = 0; index < total; index++) {
      const offset = getPlayerSquadOrderOffset(index, total);
      const idealX = centerX + offset.x;
      const idealY = centerY + offset.y;
      let chosen = null;
      let fallback = null;
      if (safe(idealX, idealY) && spaced(idealX, idealY, goals)) {
        chosen = { x: idealX, y: idealY };
      } else {
        const heading = Math.atan2(offset.y, offset.x);
        for (let ring = 1; ring <= PLAYER_SQUAD_ORDER_SEARCH_RINGS && !chosen; ring++) {
          const distance = ring * spread * 0.5;
          for (let i = 0; i < PLAYER_SQUAD_ORDER_SEARCH_DIRECTIONS.length && !chosen; i++) {
            const angle = heading + (PLAYER_SQUAD_ORDER_SEARCH_DIRECTIONS[i] * Math.PI) / 180;
            const x = idealX + Math.cos(angle) * distance;
            const y = idealY + Math.sin(angle) * distance;
            if (!safe(x, y)) continue;
            // 先记住「第一个站得住脚」的位置：整圈都排不下时至少不会退回不可行动区
            if (!fallback) fallback = { x, y };
            if (spaced(x, y, goals)) chosen = { x, y };
          }
        }
      }
      goals.push(chosen || fallback || { x: idealX, y: idealY });
    }
    return goals;
  }

  // 全部小队的存活队员：敌方索敌、自爆结算、隔离判定都以它为准
  function getAllLivingPlayerMembers() {
    const living = [];
    playerSquads.forEach(squad => {
      squad.members.forEach(member => {
        if (member.alive && member.character) living.push(member);
      });
    });
    return living;
  }
  // 人物显示尺寸统一标定为 50×50 像素（旧版是 100×100），
  // 因此渲染缩放 = 0.30 × 1.875 = 0.5625、敌方 = 0.145 × 1.875 = 0.272，
  // 两边都在同一比例下缩小，屏幕上的相对大小与原来一致

  // ----------------------------------------------------
  // 3. 场景构建阶段
  // ----------------------------------------------------
  function create() {
    this.physics.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
    // 相机不使用 Phaser 自带边界，改为逐帧 clampCameraToWorld()：
    // 自带边界在可视范围超出地图时会把地图顶到左上角，自己夹取可以居中，行为更可控
    this.add.image(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, 'battleMap')

      .setDepth(-10);

    // 在地图上显示碰撞/禁入区域以及敌军移动路线
    // 这些内容全程静态，但点是矢量图形时 Phaser 每帧都要重新批处理全部顶点：
    // 屏蔽区按手绘轮廓曲线重绘后，轮廓点从 72 个涨到约 4150 个，逐帧批处理会白吃约 5 毫秒
    // 并带来大量临时分配，因此先把图形画进离屏 Graphics，再烘焙成一张静态贴图。
    collisionGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    routeGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    // 两份静态图形烘焙进同一张贴图：地图换成原始像素后整幅贴图约 46MB，
    // 分成两张会白占一倍显存（原深度 -4 / -3 之间没有任何对象，合成顺序不变）
    mapOverlayLayer = this.add.renderTexture(0, 0, WORLD_WIDTH, WORLD_HEIGHT).setOrigin(0, 0).setDepth(-4);
    drawMapGuides();

    // A. 物理组与容器初始化
    enemiesGroup = this.physics.add.group();

    // B. 创建移动目标指示器：每支被选中并下达移动的小队一个「上倒三角 + 下脚底圆环」组合标记。
    // 池的容量对齐小队上限，实际显示数量由每帧按「正在移动的小队数」同步，避免与框选数量不一致
    targetMarkers = [];
    for (let index = 0; index < PLAYER_SQUAD_LIMIT; index++) {
      const container = this.add.container(0, 0).setDepth(6);
      const ring = this.add.image(0, TARGET_MARKER_RING_OFFSET_Y, 'targetRingTexture');
      const triangle = this.add.image(0, TARGET_MARKER_TRIANGLE_Y, 'targetTriangleTexture');
      container.add([ring, triangle]);
      container.setVisible(false);
      targetMarkers.push({ container, ring, triangle });
    }
    // 集火标记：被集火敌方角色四角的红色直角边线，逐帧重绘
    focusMarkGraphics = this.add.graphics().setDepth(3);

    // B2. 出售表现：黄线圆环 + 淡黄色渲染带逐帧重绘（层级放在我方角色之下，不会遮住单位显示）；
    // 每支展开出售面板的小队各有一个六边形「$」按钮，池容量对齐小队上限
    sellRingGraphics = this.add.graphics().setDepth(1);
    sellButtons = [];
    for (let index = 0; index < PLAYER_SQUAD_LIMIT; index++) {
      const container = this.add.container(0, 0).setDepth(7);
      const icon = this.add.image(0, 0, 'sellButtonTexture');
      const label = this.add.text(0, 0, '$', {
        fontFamily: '"Segoe UI", "Microsoft YaHei", sans-serif',

        resolution: 2
      }).setOrigin(0.5);
      container.add([icon, label]);
      container.setVisible(false);
      const zone = this.add.zone(0, 0, SELL_BUTTON_RADIUS * 2, SELL_BUTTON_RADIUS * 2).setOrigin(0.5);

      container.add(zone);       // 让点击区域跟随按钮容器一起移动
      const entry = { container, zone, squad: null };
      zone.on('pointerdown', pointer => {

    }

    // C. 初始化 RTS 玩家操控小队
    // 每支小队各有自己的隐藏 Arcade 碰撞体（负责整队移动与索敌），画面由 Spine 角色负责渲染。
    // 队伍按需组建：点击 GRF1 出兵时才会新建一支（场上最多同时 6 支），
    // 因此这里只做全局初始化，不再预制小队。
    gameScene = this;
    normalizeSpineVersionTags(this);
    // 程序化生成脚下阴影与自爆特效纹理（与出生点光晕一样走 Memory Canvas）
    createUnitShadowTexture(this, SHADOW_TEXTURE_KEY, 128);
    createExplosionTexture(this, EXPLOSION_TEXTURE_KEY, 128);
    this.input.mouse.disableContextMenu();
    // 选中环与攻击范围圈：每帧清空后为所有被选中的小队重绘，永远可见
    selectionCircle = this.add.graphics().setDepth(1);
    attackRangeGraphics = this.add.graphics().setDepth(1);
    // 小队血条：每帧根据存活队员的头顶高度重绘，未出兵时隐藏
    playerSquadBars = this.add.graphics().setDepth(4).setVisible(false);
    // C2. 出生点信标 + 左上角出生界面（GRF 按钮组）
    createSpawnPoint(this);
    createSpawnHud(this);
    playerPoints = PLAYER_START_POINTS;
    const camera = this.cameras.main;
    // 开局用 CAMERA_ZOOM_DEFAULT 缩放（视野是地图上约 1600×900 的一块区域），
    // 世界大于视野，开局先把视角对准我方出生点（不能再默认停在 (0,0) 左上角）；
    // 滚轮可在 CAMERA_ZOOM_MIN~CAMERA_ZOOM_MAX 之间缩放，最小缩放到地图宽度正好铺满视野宽度
    camera.setZoom(CAMERA_ZOOM_DEFAULT);
    camera.centerOn(SPAWN_POINT_X, SPAWN_POINT_Y);
    clampCameraToWorld();
    let isPanning = false;
    let panLast = null;
    this.input.on('wheel', (pointer, over, deltaX, deltaY) => {
      camera.setZoom(Phaser.Math.Clamp(camera.zoom - deltaY * 0.001, CAMERA_ZOOM_MIN, CAMERA_ZOOM_MAX));
      clampCameraToWorld();
    });

    const selectionGraphics = this.add.graphics().setDepth(10);
    let selectionStart = null;
    let isSelecting = false;

    // E. 全局点击处理：左键框选，右键移动，中键拖动视角
    this.input.on('pointerdown', (pointer, currentlyOver) => {
      if (pointer.button === 1) {
        isPanning = true;
        panLast = new Phaser.Math.Vector2(pointer.x, pointer.y);
        return;
      }
      if (pointer.button === 0) {
        selectionStart = new Phaser.Math.Vector2(pointer.worldX, pointer.worldY);
        isSelecting = true;
        selectionGraphics.clear();
        return;
      }
      if (pointer.button === 2) {
        const selected = getSpawnedPlayerSquads().filter(squad => squad.unit.isSelected);
        // 落点整批先算好再下发：红区吸附与落点间距校正需要看到其他小队的落点，
        // 逐支小队各自吸附会把相邻两支挤到同一处
        const goals = resolvePlayerSquadOrderGoals(pointer.worldX, pointer.worldY, selected.length);
        selected.forEach((squad, index) => {
          issuePlayerMoveOrder(squad, this, goals[index].x, goals[index].y);
        });
      }
    });
    this.input.on('pointermove', pointer => {
      if (isPanning && panLast) {
        camera.scrollX -= (pointer.x - panLast.x) / camera.zoom;
        camera.scrollY -= (pointer.y - panLast.y) / camera.zoom;
        clampCameraToWorld();
        panLast.set(pointer.x, pointer.y);
        return;
      }
      if (!isSelecting || !selectionStart) return;
      const x = Math.min(selectionStart.x, pointer.worldX);
      const y = Math.min(selectionStart.y, pointer.worldY);
      const width = Math.abs(pointer.worldX - selectionStart.x);
      const height = Math.abs(pointer.worldY - selectionStart.y);
      selectionGraphics.clear();
      selectionGraphics.lineStyle(2, 0x4ecca3, 1);
      selectionGraphics.fillStyle(0x4ecca3, 0.15);
      selectionGraphics.fillRect(x, y, width, height);
      selectionGraphics.strokeRect(x, y, width, height);
    });
    this.input.on('pointerup', pointer => {
      if (pointer.button === 1) {
        isPanning = false;
        panLast = null;
        return;
      }
      if (!isSelecting || !selectionStart) return;
      const selection = new Phaser.Geom.Rectangle(
        Math.min(selectionStart.x, pointer.worldX),
        Math.min(selectionStart.y, pointer.worldY),
        Math.abs(pointer.worldX - selectionStart.x),
        Math.abs(pointer.worldY - selectionStart.y)
      );
      const isClick = selection.width < 8 && selection.height < 8;
      if (isClick) {
        handleWorldClick(selectionStart.x, selectionStart.y);
      } else {
        // 框选：框到哪几支小队就选中哪几支（按整队锚点判定）
        getSpawnedPlayerSquads().forEach(squad => {
          squad.unit.isSelected = Phaser.Geom.Rectangle.Contains(selection, squad.unit.x, squad.unit.y);
        });
      }
      // 未出兵时小队不显示；出生动画播放期间保持显示，避免中途点击把出生动画藏起来
      playerSquads.forEach(squad => {
        setPlayerSquadVisible(squad, squad.unit.isSpawned || squad.spawnAnimation !== null);
      });
      selectionGraphics.clear();
      selectionStart = null;
      isSelecting = false;
    });

    // E. 开局预热红区等距轮廓缓存：把首次规划才要算的上百毫秒几何计算提前到开局，
    // 第一条跨红区移动指令不再因冷缓存卡顿（必须在敌军出兵之前完成）
    prewarmRedContourCache();

    // F. 三波敌军：紫色立即出兵，白色延迟 1 分钟，红色延迟 3 分钟
    enemyRoutes.forEach(route => {
      this.time.delayedCall(route.spawnDelay, () => {
        spawnEnemyRouteUnit(this, route);
        this.time.addEvent({
          delay: route.spawnInterval,
          callback: () => spawnEnemyRouteUnit(this, route),
          loop: true
        });
      });
    });


    // 屏幕上不再显示任何常驻说明文本（伤害飘字等临时提示保持不变）
  }

  // 手绘轮廓的采样间距很不均匀（最短 3 像素、最长 497 像素），直接做样条会在长短边
  // 交界处向外鼓出 30 像素以上。这里先把长边等距细分（原始控制点全部保留），
  // 再做闭曲线插值，外凸量就压到 1 像素级，绘制结果与判定用的控制点折线基本重合。
  function resampleClosedPath(points, spacing) {
    const result = [];
    for (let i = 0; i < points.length; i++) {
      const a = points[i];
      const b = points[(i + 1) % points.length];
      result.push({ x: a.x, y: a.y });
      const length = Math.hypot(b.x - a.x, b.y - a.y);
      if (length <= spacing) continue;
      for (let s = 1; s * spacing < length - 1e-6; s++) {
        const t = s * spacing / length;
        result.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
      }
    }
    return result;
  }

  // 闭合 Catmull-Rom 采样：把控制点折线转成逐点顺滑的曲线。仅用于绘制，
  // 碰撞判定一律使用原始控制点折线，保证视觉与判定不产生偏差。
  function getSmoothClosedPath(points, samplesPerEdge = 4) {
    const resampled = points.length < 4 ? points.slice() : resampleClosedPath(points, 12);
    const count = resampled.length;
    if (count < 4) return resampled;
    const result = [];
    for (let i = 0; i < count; i++) {
      const p0 = resampled[(i - 1 + count) % count];
      const p1 = resampled[i];
      const p2 = resampled[(i + 1) % count];
      const p3 = resampled[(i + 2) % count];
      for (let s = 0; s < samplesPerEdge; s++) {
        const t = s / samplesPerEdge;
        const t2 = t * t;
        const t3 = t2 * t;
        result.push({
          x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
        });
      }
    }
    return result;
  }

  function drawMapGuides() {
    collisionGraphics.clear();

    // 蓝线外框到绿线外部为屏蔽区，绿线内部为可行动区
    collisionGraphics.lineStyle(4, 0x36b8ff, 0.95);
    collisionGraphics.strokePoints(collisionRegions.mapBoundary, true);
    drawPolygon(collisionGraphics, getSmoothClosedPath(collisionRegions.walkableBoundary), 0x4ecca3, 0x4ecca3, 0.06, 3);
    // 红色区域是禁入区
    collisionRegions.redForbiddenZones.forEach(zone => {
      drawPolygon(collisionGraphics, getSmoothClosedPath(zone), 0xff2e63, 0xff2e63, 0.2, 3);
    });
    collisionRegions.lineSegments.forEach(segment => {
      const thickness = segment.thickness || 10;
      collisionGraphics.lineStyle(thickness, 0xffa62b, 0.8);
      collisionGraphics.beginPath();
      collisionGraphics.moveTo(segment.start.x, segment.start.y);
      collisionGraphics.lineTo(segment.end.x, segment.end.y);
      collisionGraphics.strokePath();
      collisionGraphics.lineStyle(2, 0xffd166, 1);
      collisionGraphics.beginPath();
      collisionGraphics.moveTo(segment.start.x, segment.start.y);
      collisionGraphics.lineTo(segment.end.x, segment.end.y);
      collisionGraphics.strokePath();
    });

    routeGraphics.clear();
    const routeStyles = {
      white: { color: 0xffffff, alpha: 0.95 },
      purple: { color: 0x8e44ad, alpha: 0.95 },
      red: { color: 0xff2e63, alpha: 0.95 }
    };
    enemyRoutes.forEach(route => {
      const style = routeStyles[route.name];
      (route.variants || [route.points]).forEach((variant, variantIndex) => {
        routeGraphics.lineStyle(variantIndex === 0 ? 4 : 2, style.color, variantIndex === 0 ? style.alpha : 0.35);
        routeGraphics.beginPath();
        variant.forEach((point, index) => {
          if (index === 0) routeGraphics.moveTo(point.x, point.y);
          else routeGraphics.lineTo(point.x, point.y);
        });
        routeGraphics.strokePath();
      });

      route.points.forEach((point, index) => {
        routeGraphics.fillStyle(style.color, 1);
        routeGraphics.fillCircle(point.x, point.y, index === 0 ? 7 : 5);
        routeGraphics.lineStyle(1, 0x111111, 0.9);
        routeGraphics.strokeCircle(point.x, point.y, index === 0 ? 7 : 5);
      });
    });

    // 把两份静态图形按原顺序烘焙进同一张贴图（红色屏蔽区叠在绿色可行动区之上，进军路线再叠在最上层）
    if (mapOverlayLayer) {
      mapOverlayLayer.clear();
      mapOverlayLayer.draw(collisionGraphics);
      mapOverlayLayer.draw(routeGraphics);
    }
  }

  function drawPolygon(graphics, points, fillColor, lineColor, fillAlpha, lineWidth) {
    graphics.fillStyle(fillColor, fillAlpha);
    graphics.fillPoints(points, true);
    graphics.lineStyle(lineWidth, lineColor, 0.95);
    graphics.strokePoints(points, true);
  }

  function editCollisionRegion(regionName, points) {
    const region = collisionRegions[regionName];
    if (!region || !Array.isArray(points)) {
      throw new Error('碰撞区域必须使用已知名称，并提供数组数据');
    }
    if (regionName === 'lineSegments') {
      if (points.some(segment =>
        !segment ||
        !segment.start ||
        !segment.end ||
        !Number.isFinite(segment.start.x) ||
        !Number.isFinite(segment.start.y) ||
        !Number.isFinite(segment.end.x) ||
        !Number.isFinite(segment.end.y)
      )) {
        throw new Error('线段碰撞区必须包含 start、end 坐标');
      }
    } else if (points.length < 3) {
      throw new Error('多边形碰撞区域至少需要 3 个坐标点');
    }
    if (regionName !== 'lineSegments' && Array.isArray(points[0]) && points.some(polygon => !Array.isArray(polygon) || polygon.length < 3)) {
      throw new Error('多个碰撞区域必须是由多边形坐标数组组成');
    }
    region.splice(0, region.length, ...points);
    invalidateRedZoneCaches();
    playerSquads.forEach(squad => {
      squad.replanKey = null;
    });
    if (mapOverlayLayer && collisionGraphics && routeGraphics) drawMapGuides();
  }

  function pointInPolygon(x, y, polygonPoints) {
    let inside = false;
    for (let i = 0, j = polygonPoints.length - 1; i < polygonPoints.length; j = i++) {
      const xi = polygonPoints[i].x;
      const yi = polygonPoints[i].y;
      const xj = polygonPoints[j].x;
      const yj = polygonPoints[j].y;
      const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi + 0.000001) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function isZoneBlocked(x, y) {
    // 红色屏蔽区：先按包围盒 O(1) 排除（点不可能落在包围盒之外的多边形里），再做射线法
    const zones = collisionRegions.redForbiddenZones;
    for (let i = 0; i < zones.length; i++) {
      const zone = zones[i];
      const bounds = getZoneBounds(zone);
      if (x < bounds.minX || x > bounds.maxX || y < bounds.minY || y > bounds.maxY) continue;
      if (pointInPolygon(x, y, zone)) return true;
    }
    // 橙色隔离线：点到线段的距离不小于点到「线段包围盒外扩半厚」的距离，因此可以同样快速排除
    const segments = collisionRegions.lineSegments;
    const segmentBounds = getCollisionSegmentBounds();
    for (let i = 0; i < segments.length; i++) {
      const segment = segments[i];
      const thickness = segment.thickness || 10;
      const radius = thickness / 2;
      const box = segmentBounds[i];
      if (x < box.minX - radius || x > box.maxX + radius ||
          y < box.minY - radius || y > box.maxY + radius) continue;
      if (distanceToSegment(x, y, segment.start, segment.end) <= radius) return true;
    }
    return false;
  }

  function distanceToSegment(x, y, start, end) {
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const lengthSquared = dx * dx + dy * dy;
    if (lengthSquared === 0) {
      return Phaser.Math.Distance.Between(x, y, start.x, start.y);
    }
    const projection = Phaser.Math.Clamp(
      ((x - start.x) * dx + (y - start.y) * dy) / lengthSquared,
      0,
      1
    );
    const closestX = start.x + projection * dx;
    const closestY = start.y + projection * dy;
    return Phaser.Math.Distance.Between(x, y, closestX, closestY);
  }

  // 复用的端点对象：原先每次调用都为每条隔离线新建两个点对象并走一次 Array.some 闭包，
  // 满编时这里是每帧数百次的临时分配（GC 压力的一处来源），改成复用探针 + 普通循环
  const collisionCrossProbeStart = { x: 0, y: 0 };
  const collisionCrossProbeEnd = { x: 0, y: 0 };

  // 橙色隔离线的穿越判定：与红区无关，红区净空判定也要单独用到它
  function isCollisionLineSegmentCrossed(startX, startY, endX, endY) {
    const segments = collisionRegions.lineSegments;
    if (!segments.length) return false;
    collisionCrossProbeStart.x = startX;
    collisionCrossProbeStart.y = startY;
    collisionCrossProbeEnd.x = endX;
    collisionCrossProbeEnd.y = endY;
    for (let i = 0; i < segments.length; i++) {
      const segment = segments[i];
      if (segmentsIntersect(collisionCrossProbeStart, collisionCrossProbeEnd, segment.start, segment.end)) {
        return true;
      }
    }
    return false;
  }

  function isCollisionLineCrossed(startX, startY, endX, endY) {
    if (isCollisionLineSegmentCrossed(startX, startY, endX, endY)) return true;
    return isRedZonePathCrossed(startX, startY, endX, endY);
  }

  function isRedZonePathCrossed(startX, startY, endX, endY) {
    const zones = collisionRegions.redForbiddenZones;
    for (let i = 0; i < zones.length; i++) {
      if (isRedZoneCrossedByPath(startX, startY, endX, endY, zones[i])) return true;
    }
    return false;
  }

  // 复用的端点对象，避免每次穿越判定都为全部红区边新建临时点
  const redCrossProbeStart = { x: 0, y: 0 };
  const redCrossProbeEnd = { x: 0, y: 0 };

  // 路径是否穿入红区：先用边的包围盒筛掉不可能相交的边，再做精确相交测试；
  // 最后用线段中点补一次内部判定，覆盖「整段都落在红区内部、不与任何边相交」的情形。
  // 与旧的「逐边相交 + 24 像素抽样 pointInPolygon」判定等价（内→外、外→内、内→外→内
  // 都必须穿越边界，必然被相交测试命中），但不再有抽样点量级的内存分配。
  function isRedZoneCrossedByPath(startX, startY, endX, endY, zone) {
      const edges = getZoneEdgeGrid(zone).edges;
      const minX = Math.min(startX, endX);
      const maxX = Math.max(startX, endX);
      const minY = Math.min(startY, endY);
      const maxY = Math.max(startY, endY);
      // 连线的包围盒与红区包围盒完全分离时既不可能相交，中点也必然在区外，直接判定未穿越
      const bounds = getZoneBounds(zone);
      if (maxX < bounds.minX || minX > bounds.maxX || maxY < bounds.minY || minY > bounds.maxY) return false;
      redCrossProbeStart.x = startX;
      redCrossProbeStart.y = startY;
      redCrossProbeEnd.x = endX;
      redCrossProbeEnd.y = endY;
      for (let i = 0; i < zone.length; i++) {
        if (edges[i * 4] > maxX || edges[i * 4 + 2] < minX || edges[i * 4 + 1] > maxY || edges[i * 4 + 3] < minY) continue;
        if (segmentsIntersect(redCrossProbeStart, redCrossProbeEnd, zone[i], zone[(i + 1) % zone.length])) return true;
      }
      return pointInPolygon((startX + endX) / 2, (startY + endY) / 2, zone);
  }

  function isSafePath(start, end) {
    return isWalkable(start.x, start.y) &&
      isWalkable(end.x, end.y) &&
      !isCollisionLineCrossed(start.x, start.y, end.x, end.y);
  }

  // --------------------------------------------------
  // 红区绕行几何：38 像素等距轮廓、净空判定、推离与沿红区滑动
  // --------------------------------------------------
  // 包围盒 / 轮廓缓存与版本号已在文件前部的碰撞查询缓存区声明

  // 碰撞区域被改写后失效，保证轮廓、包围盒与边格子桶不会残留旧数据
  function invalidateRedZoneCaches() {
    collisionRegionVersion += 1;
    redContourCache.clear();
    redContourNodeCache.clear();
    segmentZoneMemos.clear();
    redZoneEdgeGridCache = new WeakMap();
    collisionSegmentBoundsCache = null;
  }

  function getZoneBounds(zone) {
    const cached = redZoneBoundsCache.get(zone);
    if (cached && cached.version === collisionRegionVersion) return cached.bounds;
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    zone.forEach(point => {
      if (point.x < minX) minX = point.x;
      if (point.y < minY) minY = point.y;
      if (point.x > maxX) maxX = point.x;
      if (point.y > maxY) maxY = point.y;
    });
    const bounds = { minX, minY, maxX, maxY };
    redZoneBoundsCache.set(zone, { version: collisionRegionVersion, bounds });
    return bounds;
  }

  // 包围盒间距是真实间距的下界，可安全地用于快速排除不相干的红区
  function getSegmentDistanceLowerBound(from, to, bounds) {
    const minX = Math.min(from.x, to.x);
    const maxX = Math.max(from.x, to.x);
    const minY = Math.min(from.y, to.y);
    const maxY = Math.max(from.y, to.y);
    const dx = Math.max(0, Math.max(bounds.minX - maxX, minX - bounds.maxX));
    const dy = Math.max(0, Math.max(bounds.minY - maxY, minY - bounds.maxY));
    return Math.hypot(dx, dy);
  }

  // 点到包围盒的间距同样是点到该区域真实间距的下界，用于跳过不可能更近的区域
  function getPointBoundsLowerBound(x, y, bounds) {
    const dx = Math.max(0, Math.max(bounds.minX - x, x - bounds.maxX));
    const dy = Math.max(0, Math.max(bounds.minY - y, y - bounds.maxY));
    return Math.hypot(dx, dy);
  }

  // 红区边的格子桶：每条边登记到其包围盒覆盖的格子里，点查询先扫自身格子拿到一个很小的
  // 上界，再按格方框逐圈外扩，用「点到格方框之外」的距离作下界收尾。剪枝只跳过距离必然
  // 更大的边，因此最近距离、最近边号与逐边暴力逐位一致（并列最小值的取舍用边号兜底，
  // 与暴力的「先到先得」结果相同），只是把参与计算的边从全量降到个位数。
  // 同时缓存每条边的包围盒，供线段查询/穿越判定做 O(1) 的快速排除。
  function getZoneEdgeGrid(zone) {
    const cached = redZoneEdgeGridCache.get(zone);
    if (cached) return cached;

    const count = zone.length;
    const edges = new Float64Array(count * 4);
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    for (let i = 0; i < count; i++) {
      const start = zone[i];
      const end = zone[(i + 1) % count];
      const edgeMinX = Math.min(start.x, end.x);
      const edgeMaxX = Math.max(start.x, end.x);
      const edgeMinY = Math.min(start.y, end.y);
      const edgeMaxY = Math.max(start.y, end.y);
      edges[i * 4] = edgeMinX;
      edges[i * 4 + 1] = edgeMinY;
      edges[i * 4 + 2] = edgeMaxX;
      edges[i * 4 + 3] = edgeMaxY;
      if (edgeMinX < minX) minX = edgeMinX;
      if (edgeMinY < minY) minY = edgeMinY;
      if (edgeMaxX > maxX) maxX = edgeMaxX;
      if (edgeMaxY > maxY) maxY = edgeMaxY;
    }

    const baseCx = Math.floor(minX / RED_ZONE_GRID_CELL);
    const baseCy = Math.floor(minY / RED_ZONE_GRID_CELL);
    const columns = Math.floor(maxX / RED_ZONE_GRID_CELL) - baseCx + 1;
    const rows = Math.floor(maxY / RED_ZONE_GRID_CELL) - baseCy + 1;
    const cells = new Array(columns * rows);
    for (let i = 0; i < count; i++) {
      const cellMinX = Math.floor(edges[i * 4] / RED_ZONE_GRID_CELL) - baseCx;
      const cellMaxX = Math.floor(edges[i * 4 + 2] / RED_ZONE_GRID_CELL) - baseCx;
      const cellMinY = Math.floor(edges[i * 4 + 1] / RED_ZONE_GRID_CELL) - baseCy;
      const cellMaxY = Math.floor(edges[i * 4 + 3] / RED_ZONE_GRID_CELL) - baseCy;
      for (let cy = cellMinY; cy <= cellMaxY; cy++) {
        for (let cx = cellMinX; cx <= cellMaxX; cx++) {
          const bucket = cells[cy * columns + cx];
          if (bucket) bucket.push(i);
          else cells[cy * columns + cx] = [i];
        }
      }
    }

    const grid = {
      edges, baseCx, baseCy, columns, rows, cells,
      stamps: new Int32Array(columns * rows),
      stamp: 0
    };
    redZoneEdgeGridCache.set(zone, grid);
    return grid;
  }

  function beginZoneGridQuery(grid) {
    grid.stamp += 1;
    if (grid.stamp >= 2000000000) {
      grid.stamps.fill(0);
      grid.stamp = 1;
    }
    return grid.stamp;
  }

  // 只有真正更近的边才会写入坐标对象，避免每次查询都为全部条目分配内存
  function scanZoneGridCellForPoint(grid, zone, x, y, cx, cy, best) {
    if (cx < 0 || cx >= grid.columns || cy < 0 || cy >= grid.rows) return;
    const index = cy * grid.columns + cx;
    if (grid.stamps[index] === grid.stamp) return;
    grid.stamps[index] = grid.stamp;
    const bucket = grid.cells[index];
    if (!bucket) return;
    for (let n = 0; n < bucket.length; n++) {
      const i = bucket[n];
      const start = zone[i];
      const end = zone[(i + 1) % zone.length];
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const lengthSquared = dx * dx + dy * dy;
      let closestX = start.x;
      let closestY = start.y;
      if (lengthSquared !== 0) {
        const ratio = Phaser.Math.Clamp(
          ((x - start.x) * dx + (y - start.y) * dy) / lengthSquared,
          0,
          1
        );
        closestX = start.x + dx * ratio;
        closestY = start.y + dy * ratio;
      }
      const offsetX = x - closestX;
      const offsetY = y - closestY;
      const distance = Math.sqrt(offsetX * offsetX + offsetY * offsetY);
      if (distance < best.distance || (distance === best.distance && i < best.edgeIndex)) {
        best.distance = distance;
        best.edgeIndex = i;
        if (best.point) {
          best.point.x = closestX;
          best.point.y = closestY;
        } else {
          best.point = { x: closestX, y: closestY };
        }
      }
    }
  }

  // 线段到红区的最短距离。两条线段的最短距离必定出现在「某一条的端点到另一条线段」上，
  // 于是只需取「线段两端点到红区各边」与「红区各顶点到线段」的最小值：取值集合与「线段
  // 对线段的暴力最短距离」完全相同（相交仍然单独判 0），因此结果与暴力实现逐位一致，
  // 但没有随线段变长而膨胀的格子扫描开销（长对角线弦是 A* 里的常态）。
  function getZoneSegmentDistance(zone, from, to) {
    const edges = getZoneEdgeGrid(zone).edges;
    const minX = Math.min(from.x, to.x);
    const maxX = Math.max(from.x, to.x);
    const minY = Math.min(from.y, to.y);
    const maxY = Math.max(from.y, to.y);
    for (let i = 0; i < zone.length; i++) {
      if (edges[i * 4] > maxX || edges[i * 4 + 2] < minX || edges[i * 4 + 1] > maxY || edges[i * 4 + 3] < minY) continue;
      if (segmentsIntersect(from, to, zone[i], zone[(i + 1) % zone.length])) return 0;
    }
    // 先算「红区顶点 -> 线段」：顶点本身就在红区边界上，所以这一步的结果已是真实间距的上界，
    // 有了上界，下面两次昂贵的「端点点查询」只在确实可能更近时才需要做
    let nearest = Infinity;
    for (let i = 0; i < zone.length; i++) {
      const px = zone[i].x;
      const py = zone[i].y;
      // 顶点到线段的距离不小于顶点到线段包围盒的距离，先用它把不可能更近的顶点排除掉
      const offsetX = px < minX ? minX - px : px > maxX ? px - maxX : 0;
      const offsetY = py < minY ? minY - py : py > maxY ? py - maxY : 0;
      if (offsetX * offsetX + offsetY * offsetY >= nearest * nearest) continue;
      const distance = distanceToSegment(px, py, from, to);
      if (distance < nearest) nearest = distance;
    }
    // 两条线段的最短距离还可能出现在「线段端点到红区各边」上：先用端点到红区包围盒的
    // 间距（真实间距的下界）筛一遍，下界已不小于当前最优的端点直接跳过
    const bounds = getZoneBounds(zone);
    if (getPointBoundsLowerBound(from.x, from.y, bounds) < nearest) {
      const fromDistance = getZonePointDistance(zone, from.x, from.y);
      if (fromDistance < nearest) nearest = fromDistance;
    }
    if (getPointBoundsLowerBound(to.x, to.y, bounds) < nearest) {
      const toDistance = getZonePointDistance(zone, to.x, to.y);
      if (toDistance < nearest) nearest = toDistance;
    }
    return nearest;
  }

  // 红区内离给定点最近的一条边（含最近点坐标），用于推离与逐帧净空判定
  function getZoneNearestEdge(zone, x, y) {
    const grid = getZoneEdgeGrid(zone);
    beginZoneGridQuery(grid);
    const cell = RED_ZONE_GRID_CELL;
    const cx = Math.floor(x / cell) - grid.baseCx;
    const cy = Math.floor(y / cell) - grid.baseCy;
    const best = { distance: Infinity, point: null, edgeIndex: -1 };
    scanZoneGridCellForPoint(grid, zone, x, y, cx, cy, best);

    const lastRing = Math.max(cx, grid.columns - 1 - cx, cy, grid.rows - 1 - cy, 0);
    // 圈从「第一个真正碰到格子表」的那一圈开始：查询点落在格子表之外时，前面的圈里
    // 一个格子都没有，扫也是空转（否则远处查询会退化成 O(圈数²) 的空调用）
    const startRing = Math.max(-cx, cx - (grid.columns - 1), -cy, cy - (grid.rows - 1), 0);
    const lastColumn = grid.columns - 1;
    const lastRow = grid.rows - 1;
    let lowerBound = 0;
    for (let ring = startRing; ring <= lastRing; ring++) {
      if (lowerBound > best.distance) break;
      const ringMinX = cx - ring;
      const ringMaxX = cx + ring;
      const ringMinY = cy - ring;
      const ringMaxY = cy + ring;
      // 只扫圈方框与格子表的交集，同样是为了让不相交的部分不产生调用开销
      const columnStart = Math.max(0, ringMinX);
      const columnEnd = Math.min(lastColumn, ringMaxX);
      const rowStart = Math.max(0, ringMinY + 1);
      const rowEnd = Math.min(lastRow, ringMaxY - 1);
      for (let column = columnStart; column <= columnEnd; column++) {
        scanZoneGridCellForPoint(grid, zone, x, y, column, ringMinY, best);
        scanZoneGridCellForPoint(grid, zone, x, y, column, ringMaxY, best);
      }
      for (let row = rowStart; row <= rowEnd; row++) {
        scanZoneGridCellForPoint(grid, zone, x, y, ringMinX, row, best);
        scanZoneGridCellForPoint(grid, zone, x, y, ringMaxX, row, best);
      }
      // 已扫过的格子是以查询点格为中心的方形圈（切比雪夫格距 ≤ ring），圈外任何格子到
      // 查询点至少还有 ring 格的间距，于是 ring * 格宽就是剩余部分的距离下界。查询点
      // 必然落在自己格的内部，所以「点到圈方框」的距离恒为 0，用它当界永远剪不掉东西，
      // 远处点查询会退化成整张格子表的完全扫描（贴边绕行时最贵的一处）
      lowerBound = ring * cell;
    }
    return best;
  }

  function getZonePointDistance(zone, x, y) {
    return getZoneNearestEdge(zone, x, y).distance;
  }

  function getClosestPointOnSegment(x, y, start, end) {
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const lengthSquared = dx * dx + dy * dy;
    if (lengthSquared === 0) return { x: start.x, y: start.y };
    const ratio = Phaser.Math.Clamp(
      ((x - start.x) * dx + (y - start.y) * dy) / lengthSquared,
      0,
      1
    );
    return { x: start.x + dx * ratio, y: start.y + dy * ratio };
  }

  // 闭合多边形上离给定点最近的边缘落点：逐条边求最近点后取最近的一条。
  // 只在点击这类低频操作里用（两三个红区 + 一条可行动区轮廓，共两百条边左右），
  // 没必要像逐帧判定那样给它建空间索引
  function getPolygonNearestEdgePoint(polygon, x, y) {
    if (!polygon || polygon.length < 2) return null;
    let best = null;
    for (let index = 0; index < polygon.length; index++) {
      const point = getClosestPointOnSegment(
        x,
        y,
        polygon[index],
        polygon[(index + 1) % polygon.length]
      );
      const distance = Math.hypot(point.x - x, point.y - y);
      if (!best || distance < best.distance) best = { distance, point, edgeIndex: index };
    }
    return best;
  }

  // 红区外法线：候选法线外推 1.5 像素后仍落在多边形内部时取反向
  function getOutwardNormal(zone, edgeIndex) {
    const start = zone[edgeIndex];
    const end = zone[(edgeIndex + 1) % zone.length];
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const length = Math.max(0.0001, Math.hypot(dx, dy));
    const normal = { x: dy / length, y: -dx / length };
    const midpointX = (start.x + end.x) / 2;
    const midpointY = (start.y + end.y) / 2;
    if (pointInPolygon(midpointX + normal.x * 1.5, midpointY + normal.y * 1.5, zone)) {
      return { x: -normal.x, y: -normal.y };
    }
    return normal;
  }

  function getZoneOrientation(zone) {
    let area = 0;
    for (let i = 0; i < zone.length; i++) {
      const current = zone[i];
      const next = zone[(i + 1) % zone.length];
      area += current.x * next.y - next.x * current.y;
    }
    return area >= 0 ? 1 : -1;
  }

  // 红区外沿的等距轮廓（多边形外扩）：凸角用等距圆弧、凹角用两条偏移线的交点
  function getRedZoneContour(zone, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    let zoneCache = redContourCache.get(zone);
    if (!zoneCache) {
      zoneCache = new Map();
      redContourCache.set(zone, zoneCache);
    }
    const cacheKey = `${collisionRegionVersion}:${clearance}`;
    const cached = zoneCache.get(cacheKey);
    if (cached) return cached;

    const orientation = getZoneOrientation(zone);
    const count = zone.length;
    const normals = [];
    for (let i = 0; i < count; i++) normals.push(getOutwardNormal(zone, i));

    // 轮廓按 安全带宽度 + 亚像素余量 外扩生成：圆角连接的弦长会略微内凹，
    // 留出余量可避免相邻采样点连线的实际净空跌破 38 像素。
    const buildClearance = clearance + RED_CONTOUR_MARGIN;
    const contour = [];
    const pushPoint = point => {
      const last = contour[contour.length - 1];
      if (last && Phaser.Math.Distance.Between(last.x, last.y, point.x, point.y) < 0.0001) return;
      contour.push(point);
    };

    for (let i = 0; i < count; i++) {
      const vertex = zone[i];
      const nextVertex = zone[(i + 1) % count];
      const normal = normals[i];
      const nextNormal = normals[(i + 1) % count];
      const offsetStart = { x: vertex.x + normal.x * buildClearance, y: vertex.y + normal.y * buildClearance };
      const offsetEnd = { x: nextVertex.x + normal.x * buildClearance, y: nextVertex.y + normal.y * buildClearance };
      const edgeLength = Phaser.Math.Distance.Between(offsetStart.x, offsetStart.y, offsetEnd.x, offsetEnd.y);
      const samples = Math.max(1, Math.ceil(edgeLength / PLAYER_RED_CONTOUR_STEP));
      for (let step = 0; step < samples; step++) {
        const ratio = step / samples;
        pushPoint({
          x: offsetStart.x + (offsetEnd.x - offsetStart.x) * ratio,
          y: offsetStart.y + (offsetEnd.y - offsetStart.y) * ratio
        });
      }

      const cross = normal.x * nextNormal.y - normal.y * nextNormal.x;
      if (Math.abs(cross) <= 0.000001) continue;
      if (cross * orientation > 0) {
        const startAngle = Math.atan2(normal.y, normal.x);
        const endAngle = Math.atan2(nextNormal.y, nextNormal.x);
        let sweep = (endAngle - startAngle) * orientation;
        sweep = ((sweep % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const arcSteps = Math.max(1, Math.ceil(sweep / PLAYER_RED_ARC_STEP));
        for (let step = 1; step <= arcSteps; step++) {
          const angle = startAngle + orientation * sweep * (step / arcSteps);
          pushPoint({
            x: nextVertex.x + Math.cos(angle) * buildClearance,
            y: nextVertex.y + Math.sin(angle) * buildClearance
          });
        }
        continue;
      }
      const denominator = 1 + (normal.x * nextNormal.x + normal.y * nextNormal.y);
      if (denominator < 0.05) continue;
      pushPoint({
        x: nextVertex.x + (normal.x + nextNormal.x) / denominator * buildClearance,
        y: nextVertex.y + (normal.y + nextNormal.y) / denominator * buildClearance
      });
    }

    // 二次修正：任何仍落在安全带（含余量）内的采样点都推回到安全距离之外，
    // 保证轮廓点本身自带 38 像素净空，环上相邻点连线才不会割进安全带。
    // 等距外扩本身已经保证轮廓点在安全带之外，这里先用带缓存的点判定筛一遍，
    // 只有数值退化导致点真的落进安全带以内时才走昂贵的推离流程
    const corrected = contour.map(point => (
      isRedClearanceSafePoint(point.x, point.y, buildClearance)
        ? point
        : correctPointOutOfRedClearance(point, buildClearance)
    ));

    zoneCache.set(cacheKey, corrected);
    return corrected;
  }

  // 轮廓采样点中自身仍带足额净空的那一批（A* 的候选节点）：
  // 结论只由静态几何决定，因此与轮廓同样按「版本号 + 净空宽度」缓存，
  // 不必每次规划都重新对数百个采样点跑一遍点到红区的距离查询
  function getRedZoneContourNodes(zone, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    let zoneCache = redContourNodeCache.get(zone);
    if (!zoneCache) {
      zoneCache = new Map();
      redContourNodeCache.set(zone, zoneCache);
    }
    const cacheKey = `${collisionRegionVersion}:${clearance}`;
    const cached = zoneCache.get(cacheKey);
    if (cached) return cached;
    const raw = getRedZoneContour(zone, clearance)
      .filter(point => isRedClearanceSafePoint(point.x, point.y, clearance));
    // 采样点之间的弦会切掉弧线（实测最深内凹约 0.5 像素，超过 RED_CONTOUR_MARGIN），
    // 这些弦交给净空判定会失败，轮廓环随之断裂成几段，A* 图失去连通性，
    // 长距离绕行只能判「无法绕行」。这里对过近的弦递归补插中点并外推到安全距离，
    // 保证环上任意相邻两点都是可判为安全的连线。
    const nodes = [];
    const append = (from, to, depth) => {
      if (isRedClearanceSafeSegment(from, to, clearance) || depth >= PLAYER_RED_CONTOUR_REPAIR_DEPTH) {
        nodes.push(to);
        return;
      }
      const middle = correctPointOutOfRedClearance(
        { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 },
        clearance + RED_CONTOUR_MARGIN
      );
      const usable = Phaser.Math.Distance.Between(from.x, from.y, middle.x, middle.y) > 0.5
        && Phaser.Math.Distance.Between(middle.x, middle.y, to.x, to.y) > 0.5
        && isRedClearanceSafePoint(middle.x, middle.y, clearance);
      if (!usable) {
        nodes.push(to);
        return;
      }
      append(from, middle, depth + 1);
      append(middle, to, depth + 1);
    };
    if (raw.length) {
      nodes.push(raw[0]);
      for (let index = 1; index < raw.length; index++) append(raw[index - 1], raw[index], 0);
    }
    // 采样点密度只决定「贴边时拐点有多细」，对绕行结果没有贡献，却是 A* 松弛次数的主因：
    // 相邻两点连线本身就安全时，中间那个采样点对任何可行解都是多余的（直连更短），
    // 直接丢掉。实测红区环从 466 点压到 74 点，单次远距离规划的松弛次数下降一个数量级，
    // 而最短路长度完全不变（保留下来的都是绕行必须的拐点）。
    const kept = [];
    for (let index = 0; index < nodes.length; index++) {
      const previous = kept[kept.length - 1];
      const next = nodes[index + 1];
      if (previous && next && isRedClearanceSafeSegment(previous, next, clearance)) continue;
      kept.push(nodes[index]);
    }
    zoneCache.set(cacheKey, kept);
    return kept;
  }

  // 开局预热红区几何缓存：等距轮廓与轮廓节点环都是纯静态几何（只由地图屏蔽区决定），
  // 若等到第一次跨红区移动指令才构建，会把上百毫秒的计算压在那一帧上，表现为明显卡顿。
  // 开局一次性算完，交互时刻只读缓存；碰撞区域被编辑时 invalidateRedZoneCaches 会整体重建
  function prewarmRedContourCache() {
    collisionRegions.redForbiddenZones.forEach(zone => {
      getRedZoneContour(zone, PLAYER_RED_ZONE_CLEARANCE);
      getRedZoneContourNodes(zone, PLAYER_RED_ZONE_CLEARANCE);
      // 沿红区滑动用的转向轮廓（安全带 + 亚像素偏置）也在开局算好，
      // 否则第一次贴边转向会临时多付一次轮廓构建
      getRedZoneContour(zone, PLAYER_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS);
    });
  }

  function getNearestRedFeature(x, y) {
    let nearest = null;
    collisionRegions.redForbiddenZones.forEach(zone => {
      // 点到红区包围盒的间距是真实间距的下界：不可能更近的红区整块跳过，不做逐边查询
      if (nearest && getPointBoundsLowerBound(x, y, getZoneBounds(zone)) >= nearest.distance) return;
      const feature = getZoneNearestEdge(zone, x, y);
      if (feature.edgeIndex < 0 || !Number.isFinite(feature.distance)) return;
      if (!nearest || feature.distance < nearest.distance) {
        nearest = { zone, point: feature.point, distance: feature.distance, edgeIndex: feature.edgeIndex };
      }
    });
    return nearest;
  }

  // 把落在红区内部或 38 像素安全带内的点推回到刚好 38 像素之外
  function correctPointOutOfRedClearance(point, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    let current = { x: point.x, y: point.y };
    for (let iteration = 0; iteration < PLAYER_RED_CORRECTION_ITERATIONS; iteration++) {
      const feature = getNearestRedFeature(current.x, current.y);
      if (!feature || feature.distance >= clearance - RED_CLEARANCE_TOLERANCE) break;
      const zone = feature.zone;
      let directionX;
      let directionY;
      let push;
      if (feature.distance < 0.0001) {
        const normal = getOutwardNormal(zone, feature.edgeIndex);
        directionX = normal.x;
        directionY = normal.y;
        push = clearance;
      } else if (pointInPolygon(current.x, current.y, zone)) {
        // 已经进入红区：先沿最近边穿出，再补足安全带宽度
        directionX = (feature.point.x - current.x) / feature.distance;
        directionY = (feature.point.y - current.y) / feature.distance;
        push = feature.distance + clearance;
      } else {
        directionX = (current.x - feature.point.x) / feature.distance;
        directionY = (current.y - feature.point.y) / feature.distance;
        push = clearance - feature.distance;
      }
      current = {
        x: current.x + directionX * push,
        y: current.y + directionY * push
      };
    }
    return current;
  }

  // 沿线抽样检查可行动性，避免长连线切出绿色边界
  function isSegmentWalkable(from, to) {
    const length = Phaser.Math.Distance.Between(from.x, from.y, to.x, to.y);
    const steps = Math.max(1, Math.min(8, Math.ceil(length / PLAYER_RED_WALKABLE_SAMPLE_STEP)));
    for (let index = 1; index < steps; index++) {
      const ratio = index / steps;
      if (!isWalkable(from.x + (to.x - from.x) * ratio, from.y + (to.y - from.y) * ratio)) return false;
    }
    return true;
  }

  // 红区净空判定：线段到每个红区的最短距离都必须不小于安全带宽度
  // slack 是路径搜索的浮点松弛量；敌方落点判定传 0，保证单位不会真的贴进安全带以内。
  // 橙线穿越必须单独判：橙线只是不可跨越的隔断、并不属于红区，
  // 与红区边的最短距离远大于安全带，只靠净空判定挡不住穿线。
  // 昂贵的「到各红区的最短距离」这一段交给带缓存的 isRedClearanceZonesSatisfied，
  // 它也是整段规划里调用量最大的一处
  function isRedClearanceSafeSegment(
    from,
    to,
    clearance = PLAYER_RED_ZONE_CLEARANCE,
    strict = false,
    slack = RED_CLEARANCE_PATH_SLACK
  ) {
    if (!isWalkable(from.x, from.y) || !isWalkable(to.x, to.y)) return false;
    if (isCollisionLineSegmentCrossed(from.x, from.y, to.x, to.y)) return false;
    if (strict && !isSegmentWalkable(from, to)) return false;
    return isRedClearanceZonesSatisfied(from, to, clearance, slack);
  }

  function isRedClearanceSafePoint(x, y, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    const bit = getClearanceQueryBit(clearance);
    const key = bit === 0 ? 0 : getPointQueryKey(x, y);
    if (bit !== 0) {
      const entry = pointQueryCache.get(key);
      if (entry !== undefined && (entry & bit) !== 0) {
        return (entry & bit << POINT_QUERY_RESULT_SHIFT) !== 0;
      }
    }
    let safe = isWalkable(x, y);
    if (safe) {
      safe = collisionRegions.redForbiddenZones.every(zone => {
        // 点到包围盒的距离是点到红区距离的下界：下界已经安全就不必再算精确最近边
        const bounds = getZoneBounds(zone);
        const needed = clearance - RED_CLEARANCE_TOLERANCE;
        if (getPointBoundsLowerBound(x, y, bounds) > needed) return true;
        return getZonePointDistance(zone, x, y) >= needed;
      });
    }
    if (bit !== 0) {
      // isWalkable 可能刚往同一个键写入可行走位，重新取一次再合并净空结论
      const entry = pointQueryCache.get(key);
      pointQueryCache.set(key, (entry || 0) | bit | (safe ? bit << POINT_QUERY_RESULT_SHIFT : 0));
    }
    return safe;
  }

  function isRedZoneClearanceSafePath(start, end, clearance = ENEMY_RED_ZONE_CLEARANCE) {
    return isRedClearanceSafeSegment(start, end, clearance);
  }

  function isClearancePathSafe(start, path, clearance = PLAYER_RED_ZONE_CLEARANCE, strict = false) {
    if (!path || !path.length) return false;
    let previous = start;
    return path.every(point => {
      const safe = isRedClearanceSafeSegment(previous, point, clearance, strict);
      previous = point;
      return safe;
    });
  }

  function getDetourCandidates() {
    if (detourCandidatesVersion === collisionRegionVersion) return detourCandidatesCache;
    const candidates = [];
    const addCandidate = (point, center, direction = 1) => {
      const dx = (point.x - center.x) * direction;
      const dy = (point.y - center.y) * direction;
      const length = Math.max(1, Math.hypot(dx, dy));
      const candidate = {
        x: Phaser.Math.Clamp(point.x + (dx / length) * 22, 0, WORLD_WIDTH),
        y: Phaser.Math.Clamp(point.y + (dy / length) * 22, 0, WORLD_HEIGHT)
      };
      if (isWalkable(candidate.x, candidate.y)) candidates.push(candidate);
    };
    collisionRegions.redForbiddenZones.forEach(zone => {
      const center = zone.reduce((sum, point) => ({
        x: sum.x + point.x / zone.length,
        y: sum.y + point.y / zone.length
      }), { x: 0, y: 0 });
      zone.forEach(point => addCandidate(point, center));
    });
    const boundaryCenter = collisionRegions.walkableBoundary.reduce((sum, point) => ({
      x: sum.x + point.x / collisionRegions.walkableBoundary.length,
      y: sum.y + point.y / collisionRegions.walkableBoundary.length
    }), { x: 0, y: 0 });
    collisionRegions.walkableBoundary.forEach(point => addCandidate(point, boundaryCenter, -1));
    detourCandidatesCache = candidates;
    detourCandidatesVersion = collisionRegionVersion;
    return candidates;
  }

  // 候选点配对（O(n²)）是满编时最大的性能热点：新地图 12px 重采样后约有 280 个候选点，
  // 原先每个候选点都要重复判定「起点能否直达」，每一对候选点还要做两次 isSafePath
  // （内部是逐红区线段相交 + 多边形判定），单次调用最多产生数万次几何判定，每帧数十毫秒。
  // 现在改成「先算便宜的长度，再做昂贵的安全判定」，并让每个候选点的判定结果全程复用：
  //   1. 两个候选点方向的判定都惰性、按需记忆化，每个候选点最多判定一次（原来要重复 2~3 次）；
  //   2. 两跳路径长度 ≥ (起点→第一跳) + (第二跳→终点)，用这个下界剪掉不可能更优的组合；
  //   3. 剪枝只丢弃「确定无法严格优于当前最优」的路径，而长度比较与求和顺序都和原实现一致，
  //      因此返回的路径（含同长度时保留先出现者）与原实现完全等价。
  function getReplannedPath(start, end, preferLongest, additionalCandidates = [], edgeOnly = false) {
    const startWalkable = isWalkable(start.x, start.y);
    const rawCandidates = edgeOnly ? additionalCandidates : getDetourCandidates().concat(additionalCandidates);
    const preferGreater = preferLongest === true;
    const count = rawCandidates.length;
    const fromStart = new Float64Array(count);
    const toEnd = new Float64Array(count);
    // 最短语义下需要「除自身外最近的终点距离」作为第二跳的下界，故记录最小与次小值
    let minEnd = Infinity;
    let secondMinEnd = Infinity;
    let minEndIndex = -1;
    for (let i = 0; i < count; i++) {
      const candidate = rawCandidates[i];
      fromStart[i] = Phaser.Math.Distance.Between(start.x, start.y, candidate.x, candidate.y);
      toEnd[i] = Phaser.Math.Distance.Between(candidate.x, candidate.y, end.x, end.y);
      if (toEnd[i] < minEnd) {
        secondMinEnd = minEnd;
        minEnd = toEnd[i];
        minEndIndex = i;
      } else if (toEnd[i] < secondMinEnd) {
        secondMinEnd = toEnd[i];
      }
    }
    const minEndExcept = index => (index === minEndIndex ? secondMinEnd : minEnd);
    const reachFlag = new Int8Array(count).fill(-1);
    const endFlag = new Int8Array(count).fill(-1);
    const canReach = index => {
      if (reachFlag[index] < 0) {
        reachFlag[index] = (
          startWalkable ? isSafePath(start, rawCandidates[index]) : canReachDetourPoint(start, rawCandidates[index])
        ) ? 1 : 0;
      }
      return reachFlag[index] === 1;
    };
    const isEndSafe = index => {
      if (endFlag[index] < 0) endFlag[index] = isSafePath(rawCandidates[index], end) ? 1 : 0;
      return endFlag[index] === 1;
    };
    let bestPath = null;
    let bestLength = 0;
    if (startWalkable && isSafePath(start, end)) {
      bestPath = [end];
      bestLength = Phaser.Math.Distance.Between(start.x, start.y, end.x, end.y);
    }
    for (let i = 0; i < count; i++) {
      const oneHopLength = fromStart[i] + toEnd[i];
      const canImproveOneHop = bestPath === null || (preferGreater ? oneHopLength > bestLength : oneHopLength < bestLength);
      if (canImproveOneHop && canReach(i) && isEndSafe(i)) {
        bestPath = [rawCandidates[i], end];
        bestLength = oneHopLength;
      }
      if (bestPath && !preferGreater && fromStart[i] + minEndExcept(i) >= bestLength) continue;
      if (!canReach(i)) continue;
      for (let j = 0; j < count; j++) {
        if (j === i) continue;
        if (bestPath && !preferGreater && fromStart[i] + toEnd[j] >= bestLength) continue;
        const legLength = Phaser.Math.Distance.Between(
          rawCandidates[i].x, rawCandidates[i].y, rawCandidates[j].x, rawCandidates[j].y
        );
        const pathLength = fromStart[i] + legLength + toEnd[j];
        if (bestPath && (preferGreater ? pathLength <= bestLength : pathLength >= bestLength)) continue;
        if (!isEndSafe(j) || !isSafePath(rawCandidates[i], rawCandidates[j])) continue;
        bestPath = [rawCandidates[i], rawCandidates[j], end];
        bestLength = pathLength;
      }
    }
    return bestPath;
  }

  function canReachDetourPoint(start, end) {
    return isWalkable(end.x, end.y) &&
      !isCollisionLineCrossed(start.x, start.y, end.x, end.y);
  }

  function getNearestEdgeCandidates(start, end) {
    const candidates = [];
    const polygons = collisionRegions.redForbiddenZones.concat([collisionRegions.walkableBoundary]);
    polygons.forEach(polygon => {
      const center = polygon.reduce((sum, point) => ({
        x: sum.x + point.x / polygon.length,
        y: sum.y + point.y / polygon.length
      }), { x: 0, y: 0 });
      for (let i = 0; i < polygon.length; i++) {
        const edgeStart = polygon[i];
        const edgeEnd = polygon[(i + 1) % polygon.length];
        const edgeX = edgeEnd.x - edgeStart.x;
        const edgeY = edgeEnd.y - edgeStart.y;
        const edgeLengthSquared = edgeX * edgeX + edgeY * edgeY;
        const projection = Phaser.Math.Clamp(
          ((start.x - edgeStart.x) * edgeX + (start.y - edgeStart.y) * edgeY) /
            Math.max(1, edgeLengthSquared),
          0,
          1
        );
        const nearest = {
          x: edgeStart.x + edgeX * projection,
          y: edgeStart.y + edgeY * projection
        };
        const isWalkableEdge = polygon === collisionRegions.walkableBoundary;
        const offsetX = (nearest.x - center.x) * (isWalkableEdge ? -1 : 1);
        const offsetY = (nearest.y - center.y) * (isWalkableEdge ? -1 : 1);
        const offsetLength = Math.max(1, Math.hypot(offsetX, offsetY));
        const candidate = {
          x: Phaser.Math.Clamp(nearest.x + offsetX / offsetLength * 28, 0, WORLD_WIDTH),
          y: Phaser.Math.Clamp(nearest.y + offsetY / offsetLength * 28, 0, WORLD_HEIGHT)
        };
        if (isWalkable(candidate.x, candidate.y)) candidates.push(candidate);
      }
    });
    return candidates;
  }

  // 移动路线范围内的红区：直线穿越的红区，或与直线距离不超过 PLAYER_RED_ROUTE_RANGE 的红区
  function getRedRouteZones(start, end) {
    return collisionRegions.redForbiddenZones.filter(zone => {
      if (isRedZoneCrossedByPath(start.x, start.y, end.x, end.y, zone)) return true;
      if (getSegmentDistanceLowerBound(start, end, getZoneBounds(zone)) > PLAYER_RED_ROUTE_RANGE) return false;
      return getZoneSegmentDistance(zone, start, end) <= PLAYER_RED_ROUTE_RANGE;
    });
  }

  // A* 最短路：启发式取「到终点的直线距离」，可采纳且一致，因此结果与朴素 Dijkstra 完全一致
  // （同长度最优解之间的并列取舍可能不同）。节点数增长到 300+ 后，朴素 O(n²) 全图松弛会成为
  // 单次移动指令的主要卡顿来源，A* 只展开真正落在贴边绕行走廊内的节点，并利用已找到的完整路径
  // 长度作为上界剪掉不可能更优的分支，开销随之下降一个量级。
  function findShortestClearancePath(nodes, clearance = PLAYER_RED_ZONE_CLEARANCE, strict = false, upperBound = Infinity) {
    const count = nodes.length;
    const endIndex = count - 1;
    const end = nodes[endIndex];
    const heuristic = new Float64Array(count);
    for (let i = 0; i < count; i++) {
      const dx = nodes[i].x - end.x;
      const dy = nodes[i].y - end.y;
      heuristic[i] = Math.sqrt(dx * dx + dy * dy);
    }
    const distances = new Array(count).fill(Infinity);
    const previous = new Array(count).fill(-1);
    const visited = new Array(count).fill(false);
    distances[0] = 0;
    // 已找到的完整路径长度上界：任何 f = g + h 超过它的节点都不可能出现在最优解里。
    // 调用方若能先给出一条可行路线（沿红区轮廓行走的那条），就用它作为初始上界；否则这个上界
    // 在终点被松弛之前一直是无穷，剪枝完全失效，几乎每对节点都要跑一次线段净空判定。
    let best = upperBound;

    for (let step = 0; step < count; step++) {
      let current = -1;
      let currentScore = Infinity;
      for (let i = 0; i < count; i++) {
        if (visited[i]) continue;
        const score = distances[i] + heuristic[i];
        if (score < currentScore) {
          currentScore = score;
          current = i;
        }
      }
      if (current < 0 || currentScore > best || !Number.isFinite(distances[current])) break;
      visited[current] = true;
      if (current === endIndex) break;

      const currentDistance = distances[current];
      const currentX = nodes[current].x;
      const currentY = nodes[current].y;
      for (let next = 0; next < count; next++) {
        if (visited[next] || next === current) continue;
        // 先用平方距离做无开方的前置排除，绝大多数节点对在这里就被挡掉
        const limit = distances[next] - currentDistance;
        if (limit <= 0) continue;
        const dx = nodes[next].x - currentX;
        const dy = nodes[next].y - currentY;
        const squared = dx * dx + dy * dy;
        if (squared >= limit * limit) continue;
        const distance = currentDistance + Math.sqrt(squared);
        if (distance + heuristic[next] > best) continue;
        if (!isRedClearanceSafeSegment(nodes[current], nodes[next], clearance, strict)) continue;
        distances[next] = distance;
        previous[next] = current;
        if (next === endIndex && distance < best) best = distance;
      }
    }

    if (!Number.isFinite(distances[endIndex])) return null;
    const path = [];
    for (let index = endIndex; index > 0; index = previous[index]) {
      if (index < 0) return null;
      path.unshift(nodes[index]);
    }
    return path.length ? path : null;
  }

  function getRingNearestDistance(ring, point) {
    let best = Infinity;
    for (let i = 0; i < ring.length; i++) {
      const distance = Phaser.Math.Distance.Between(point.x, point.y, ring[i].x, ring[i].y);
      if (distance < best) best = distance;
    }
    return best;
  }

  // 单个红区环上的一段贴边行走：在环上挑一对「起点可安全直达」「终点可安全直达」的采样点，
  // 取 起点连线 + 沿环弧长 + 终点连线 最小的一对，返回途中经过的环上节点。
  // 环上相邻采样点之间的弦基本已由轮廓节点生成过程修复为安全，行走段只对实际走过的那几段
  // 复用（带记忆化的）净空判定兜底，遇到断口直接放弃这个环。
  // 候选点按「起点到该点 + 该点到终点」的直线距离升序评估：任意含该点的方案得分都不小于这个
  // 下界（弧长不短于弦长），一旦下界追平当前最优就无需再看后面的候选点——实测把每环上千次
  // 线段净空查询压到几十次。
  function getRingWalkLeg(start, end, clearance, ring) {
    const count = ring.length;
    if (count < 2) return null;
    const order = new Array(count);
    for (let i = 0; i < count; i++) {
      const point = ring[i];
      order[i] = {
        index: i,
        lowerBound: Phaser.Math.Distance.Between(start.x, start.y, point.x, point.y) +
          Phaser.Math.Distance.Between(point.x, point.y, end.x, end.y)
      };
    }
    order.sort((a, b) => a.lowerBound - b.lowerBound);
    const enter = [];
    const exit = [];
    let bestScore = Infinity;
    const candidateLimit = Math.min(count, PLAYER_RED_WALK_LEG_CANDIDATE_LIMIT);
    for (let n = 0; n < candidateLimit; n++) {
      const candidate = order[n];
      // 弧长不短于弦长：任何用到这个候选点的方案得分都不小于它的直线下界，
      // 一旦下界追平当前最优，后面的候选点都不可能更优
      if (candidate.lowerBound >= bestScore) break;
      const point = ring[candidate.index];
      const enterCost = isRedClearanceSafeSegment(start, point, clearance)
        ? Phaser.Math.Distance.Between(start.x, start.y, point.x, point.y)
        : Infinity;
      const exitCost = isRedClearanceSafeSegment(point, end, clearance)
        ? Phaser.Math.Distance.Between(end.x, end.y, point.x, point.y)
        : Infinity;
      if (Number.isFinite(enterCost)) enter.push({ index: candidate.index, cost: enterCost });
      if (Number.isFinite(exitCost)) exit.push({ index: candidate.index, cost: exitCost });
      if (enterCost + exitCost < bestScore) bestScore = enterCost + exitCost;
    }
    if (!enter.length || !exit.length) return null;
    const prefix = new Float64Array(count + 1);
    for (let i = 0; i < count; i++) {
      const next = ring[(i + 1) % count];
      prefix[i + 1] = prefix[i] + Phaser.Math.Distance.Between(ring[i].x, ring[i].y, next.x, next.y);
    }
    const total = prefix[count];
    let best = null;
    for (let a = 0; a < enter.length; a++) {
      for (let b = 0; b < exit.length; b++) {
        let forward = prefix[exit[b].index] - prefix[enter[a].index];
        if (forward < 0) forward += total;
        const score = enter[a].cost + Math.min(forward, total - forward) + exit[b].cost;
        if (!best || score < best.score) best = { score, a, b, forward };
      }
    }
    const from = enter[best.a].index;
    const to = exit[best.b].index;
    const direction = best.forward <= total - best.forward ? 1 : -1;
    // 环上相邻点之间的弦绝大多数已由轮廓生成过程修复为安全，但地图边界会把轮廓切成断口：
    // 红区贴到可行走区域外沿时，那一段轮廓整个落在可行走区域之外，会被滤掉并留下一条
    // 横穿红区的长弦。断口必须当成绕行的墙——走不过去的环不能拿来贴边，否则这条「贴边路线」
    // 会被当成可行路线直接返回，或当成上界误剪掉真正的最优解。
    const nodes = [];
    for (let index = from; ; index = (index + direction + count) % count) {
      const previous = nodes[nodes.length - 1];
      if (previous && !isRedClearanceSafeSegment(previous, ring[index], clearance)) return null;
      nodes.push(ring[index]);
      if (index === to || nodes.length >= count) break;
    }
    return { nodes };
  }

  // 沿所有路线范围内红区轮廓行走的曲线路线：多个红区按离起点的远近依次贴边，
  // 每段都以最终终点为目标挑选入/出环点（所以每条使用的弦都经过安全校验，路径必然可行），
  // 行走段只走环上相邻采样点之间的安全弦。
  function getRedContourWalkPath(start, end, clearance, rings) {
    if (!rings.length) return null;
    const ordered = rings.slice().sort((a, b) => getRingNearestDistance(a, start) - getRingNearestDistance(b, start));
    const path = [];
    let cursor = start;
    for (let n = 0; n < ordered.length; n++) {
      const leg = getRingWalkLeg(cursor, end, clearance, ordered[n]);
      if (!leg) continue;
      for (let i = 0; i < leg.nodes.length; i++) path.push(leg.nodes[i]);
