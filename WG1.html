      cursor = leg.nodes[leg.nodes.length - 1];
    }
    if (!path.length) return null;
    path.push(end);
    return path;
  }

  function getClearancePathCost(start, path) {
    let cost = 0;
    let previous = start;
    for (let i = 0; i < path.length; i++) {
      cost += Phaser.Math.Distance.Between(previous.x, previous.y, path[i].x, path[i].y);
      previous = path[i];
    }
    return cost;
  }

  // 曲线绕行路径：节点取所有路线范围内红区的 38 像素等距轮廓采样点，
  // 任意两节点之间必须保持安全净空，用最短路保证沿红区外沿抵达终点。
  function getRedContourRoutePath(start, end, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    if (!isWalkable(start.x, start.y) || !isWalkable(end.x, end.y)) return null;
    const routeZones = getRedRouteZones(start, end);
    if (!routeZones.length) return null;
    // 不按直线走廊裁剪节点：绕行所需的关键节点往往落在直线走廊之外
    // （例如贴着红区下沿绕过时，节点会超出直线 563 像素），裁剪会导致图断裂。
    const rings = [];
    const nodes = [];
    const seen = new Set();
    routeZones.forEach(zone => {
      const ring = getRedZoneContourNodes(zone, clearance);
      if (!ring.length) return;
      rings.push(ring);
      ring.forEach(point => {
        const key = `${Math.round(point.x * 4)}:${Math.round(point.y * 4)}`;
        if (seen.has(key)) return;
        seen.add(key);
        nodes.push(point);
      });
    });
    if (!nodes.length) return null;
    // 先按「沿所有绕行范围内红区的轮廓贴边行走」给出一条可行路线：
    // 它是曲线绕行的直接答案，同时给出最优路径长度的上界，交给下面的搜索剪枝。
    const walkPath = getRedContourWalkPath(start, end, clearance, rings);
    let upperBound = Infinity;
    if (walkPath && walkPath.length) {
      if (isClearancePathSafe(start, walkPath, clearance, true)) return walkPath;
      // 严格校验没过时，只要松弛口径下成立就仍可作为搜索上界（上界必须来自真实可行路径）
      if (isClearancePathSafe(start, walkPath, clearance, false)) upperBound = getClearancePathCost(start, walkPath);
    }
    const graph = [start, ...nodes, end];
    const relaxedPath = findShortestClearancePath(graph, clearance, false, upperBound);
    if (relaxedPath && relaxedPath.length) {
      if (isClearancePathSafe(start, relaxedPath, clearance, true)) return relaxedPath;
      const strictPath = findShortestClearancePath(graph, clearance, true);
      if (strictPath && strictPath.length) return strictPath;
      return relaxedPath;
    }
    return null;
  }

  function getShortestPlayerPath(start, end, allowEscape = true) {
    if (!isWalkable(start.x, start.y) || !isWalkable(end.x, end.y)) return null;
    // 起点已被安全带包住（例如屏蔽区被改到脚下）：先脱离安全带，再从脱离点重新规划
    if (allowEscape && !isRedClearanceSafePoint(start.x, start.y, PLAYER_RED_ZONE_CLEARANCE)) {
      const escape = correctPointOutOfRedClearance(start, PLAYER_RED_ZONE_CLEARANCE);
      if (Phaser.Math.Distance.Between(start.x, start.y, escape.x, escape.y) <= 0.05) return null;
      const remaining = getShortestPlayerPath(escape, end, false);
      return remaining && remaining.length ? [escape, ...remaining] : [escape];
    }
    // 直线既不穿越红区、也不侵入 38 像素安全带时，直线本身就是最短路径
    if (isRedClearanceSafeSegment(start, end, PLAYER_RED_ZONE_CLEARANCE, true)) return [end];
    // 否则不取直线距离，改为沿路线范围内所有红区的等距轮廓曲线抵达终点
    const contourPath = getRedContourRoutePath(start, end, PLAYER_RED_ZONE_CLEARANCE);
    if (contourPath && contourPath.length) return contourPath;
    // 同一组参数刚刚已经跑过轮廓规划，这里让兜底方案跳过重复的那一遍
    const fallbackPath = getShortestShieldedPath(start, end, false, PLAYER_RED_ZONE_CLEARANCE, true);
    if (fallbackPath && fallbackPath.length &&
      isClearancePathSafe(start, fallbackPath, PLAYER_RED_ZONE_CLEARANCE, true)) {
      return fallbackPath;
    }
    return null;
  }

  // 把点投影到闭合轮廓折线上，返回投影坐标与所在弦的起始索引。
  // 逐段只用标量运算、不新建临时对象：轮廓折线动辄数百条弦，逐帧调用时这里是 GC 的一处来源
  function projectPointOnContour(point, contour) {
    const count = contour.length;
    const pointX = point.x;
    const pointY = point.y;
    let bestIndex = -1;
    let bestRatio = 0;
    let bestDistanceSquared = Infinity;
    for (let index = 0; index < count; index++) {
      const start = contour[index];
      const end = contour[(index + 1) % count];
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const lengthSquared = dx * dx + dy * dy;
      let ratio = 0;
      if (lengthSquared !== 0) {
        ratio = Phaser.Math.Clamp(
          ((pointX - start.x) * dx + (pointY - start.y) * dy) / lengthSquared,
          0,
          1
        );
      }
      const offsetX = pointX - (start.x + dx * ratio);
      const offsetY = pointY - (start.y + dy * ratio);
      const distanceSquared = offsetX * offsetX + offsetY * offsetY;
      if (distanceSquared < bestDistanceSquared) {
        bestDistanceSquared = distanceSquared;
        bestIndex = index;
        bestRatio = ratio;
      }
    }
    if (bestIndex < 0) return { x: pointX, y: pointY, index: 0 };
    const bestStart = contour[bestIndex];
    const bestEnd = contour[(bestIndex + 1) % count];
    return {
      x: bestStart.x + (bestEnd.x - bestStart.x) * bestRatio,
      y: bestStart.y + (bestEnd.y - bestStart.y) * bestRatio,
      index: bestIndex,
      distance: Math.sqrt(bestDistanceSquared)
    };
  }

  // 轮廓上离某点最近的采样索引
  function getNearestContourIndex(contour, point) {
    let bestIndex = 0;
    let bestDistance = Infinity;
    contour.forEach((vertex, index) => {
      const distance = Phaser.Math.Distance.Between(point.x, point.y, vertex.x, vertex.y);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestIndex = index;
      }
    });
    return bestIndex;
  }

  // 沿轮廓按给定方向从一个索引绕到另一个索引的折线长度
  function getContourArcLength(contour, fromIndex, toIndex, direction) {
    const count = contour.length;
    let length = 0;
    let index = fromIndex;
    for (let step = 0; step < count; step++) {
      const next = (index + direction + count) % count;
      length += Phaser.Math.Distance.Between(
        contour[index].x, contour[index].y, contour[next].x, contour[next].y
      );
      index = next;
      if (index === toIndex) break;
    }
    return length;
  }

  // 沿红区等距轮廓滑动：以红区外沿作为最终判断依据，只朝更靠近目标的一侧前进。
  // 转向点比安全带再外扩 PLAYER_RED_STEER_BIAS，抵消轮廓折线弦长带来的亚像素内切，
  // 保证贴边行走时的实际净空不会跌破安全带宽度
  function slideAlongRedContour(origin, waypoint, budget, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    const walkClearance = clearance + PLAYER_RED_STEER_BIAS;
    let best = null;
    collisionRegions.redForbiddenZones.forEach(zone => {
      const contour = getRedZoneContour(zone, walkClearance);
      if (contour.length < 2) return;
      let nearestIndex = -1;
      let nearestDistance = Infinity;
      contour.forEach((point, index) => {
        const distance = Phaser.Math.Distance.Between(origin.x, origin.y, point.x, point.y);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = index;
        }
      });
      if (nearestIndex < 0 || nearestDistance > clearance + PLAYER_RED_SLIDE_RANGE) return;
      // 起点只要求满足真实安全带宽度：轮廓点本身按 walkClearance（再外扩一个偏置）生成，
      // 弦长误差由该偏置抵消。若这里也用 walkClearance 判定，站位刚好落在安全带边界上时
      // 会被误判为不安全，单位只能逐帧空转、蹭着红区慢慢挪动
      if (!isRedClearanceSafeSegment(
        origin, contour[nearestIndex], walkClearance, false, PLAYER_RED_STEER_BIAS + RED_CLEARANCE_TOLERANCE
      )) return;
      if (!best || nearestDistance < best.distance) {
        best = { contour, nearestIndex, distance: nearestDistance };
      }
    });
    if (!best) return null;

    const contour = best.contour;
    const count = contour.length;
    // 起点投影到轮廓折线上（而不是吸附到最近的采样点）：采样间距 24 像素，
    // 若每帧都吸附回采样点，本帧的沿边推进量会被吸附位移抵消，单位只会在采样点附近来回抖动
    const projection = projectPointOnContour(origin, contour);
    // 绕行方向按「沿轮廓走到离终点最近的那一点，哪边弧长更短」判定：
    // 只看相邻采样点会随单位越过目标垂足来回翻转，同样会让单位贴边原地踏步
    const targetIndex = getNearestContourIndex(contour, waypoint);
    const forwardLength = getContourArcLength(contour, projection.index, targetIndex, 1);
    const backwardLength = getContourArcLength(contour, projection.index, targetIndex, -1);
    const direction = backwardLength < forwardLength ? -1 : 1;

    let index = direction > 0 ? (projection.index + 1) % count : projection.index;
    let current = { x: projection.x, y: projection.y };
    let remaining = budget;
    for (let step = 0; step <= count && remaining > 0.0001; step++) {
      const target = contour[index];
      const distance = Phaser.Math.Distance.Between(current.x, current.y, target.x, target.y);
      if (distance > remaining) {
        const ratio = remaining / distance;
        current = {
          x: current.x + (target.x - current.x) * ratio,
          y: current.y + (target.y - current.y) * ratio
        };
        break;
      }
      if (!isRedClearanceSafeSegment(current, target, walkClearance)) break;
      current = target;
      remaining -= distance;
      index = (index + direction + count) % count;
    }
    if (Phaser.Math.Distance.Between(origin.x, origin.y, current.x, current.y) < 0.2) return null;
    return isRedClearanceSafeSegment(
      origin, current, walkClearance, false, PLAYER_RED_STEER_BIAS + RED_CLEARANCE_TOLERANCE
    ) ? current : null;
  }

  // 逐帧转向：先直行，其次推离到安全带之外，最后沿红区外沿滑动；都不行则交给上层重新规划
  function getPlayerSteeringTarget(origin, waypoint, budget, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    if (!isRedClearanceSafePoint(origin.x, origin.y, clearance)) {
      // 自身已在安全带内：优先朝安全带外脱离，避免任意朝向都被判定为不安全而永久卡住
      const escape = correctPointOutOfRedClearance(origin, clearance + PLAYER_RED_STEER_BIAS);
      const distance = Phaser.Math.Distance.Between(origin.x, origin.y, escape.x, escape.y);
      if (distance > 0.05) {
        const ratio = Math.min(1, budget / distance);
        return {
          x: origin.x + (escape.x - origin.x) * ratio,
          y: origin.y + (escape.y - origin.y) * ratio
        };
      }
    }
    const totalDistance = Phaser.Math.Distance.Between(origin.x, origin.y, waypoint.x, waypoint.y);
    if (totalDistance <= budget) {
      const arrival = { x: waypoint.x, y: waypoint.y };
      if (isRedClearanceSafeSegment(origin, arrival, clearance)) return arrival;
    }
    const ratio = totalDistance > 0 ? Math.min(1, budget / totalDistance) : 0;
    const desired = {
      x: origin.x + (waypoint.x - origin.x) * ratio,
      y: origin.y + (waypoint.y - origin.y) * ratio
    };
    if (isRedClearanceSafeSegment(origin, desired, clearance)) return desired;
    const corrected = correctPointOutOfRedClearance(desired, clearance);
    if (Phaser.Math.Distance.Between(desired.x, desired.y, corrected.x, corrected.y) > 0.05 &&
      isRedClearanceSafeSegment(origin, corrected, clearance)) {
      return corrected;
    }
    return slideAlongRedContour(origin, waypoint, budget, clearance);
  }

  function getShortestShieldedPath(
    start,
    end,
    redZoneRequired = false,
    clearance = ENEMY_RED_ZONE_CLEARANCE,
    skipContourRoute = false
  ) {
    // 红区等距轮廓是首选绕行曲线；沿红区无法通行时才退回绿色边界方案。
    // skipContourRoute 供已经用同样参数跑过一遍轮廓规划的调用方使用：
    // 该函数是纯函数，同参数必然得到同一个结论，重跑一次（两轮 A* + 整路径复核）没有意义
    if (!skipContourRoute) {
      const contourPath = getRedContourRoutePath(start, end, clearance);
      if (contourPath && contourPath.length && isClearancePathSafe(start, contourPath, clearance)) {
        return contourPath;
      }
    }
    if (redZoneRequired) {
      // 命中任意红色区域时，禁止退回直线路径或绿色边界路径。
      return null;
    }
    const fallbackPaths = [
      getReplannedPath(start, end, false, getNearestEdgeCandidates(start, end)),
      ...getCurvedEdgePaths(start, end, [collisionRegions.walkableBoundary], 30, clearance)
    ].filter(Boolean);
    if (!fallbackPaths.length) return null;
    return getShortestPathByLength(fallbackPaths, start);
  }

  function getShortestPathByLength(paths, start) {
    const lengthOf = path => path.reduce((sum, point, index) => {
      const previous = index === 0 ? start : path[index - 1];
      return sum + Phaser.Math.Distance.Between(previous.x, previous.y, point.x, point.y);
    }, 0);
    return paths.reduce((shortest, path) =>
      !shortest || lengthOf(path) < lengthOf(shortest) ? path : shortest, null);
  }

  function getCurvedEdgePaths(start, end, polygons, edgeClearance = 30, redClearance = ENEMY_RED_ZONE_CLEARANCE) {
    const paths = [];
    const requiresRedClearance = polygons === collisionRegions.redForbiddenZones;
    polygons.forEach(polygon => {
      const center = polygon.reduce((sum, point) => ({
        x: sum.x + point.x / polygon.length,
        y: sum.y + point.y / polygon.length
      }), { x: 0, y: 0 });
      const edgePoints = [];
      for (let i = 0; i < polygon.length; i++) {
        const a = polygon[i];
        const b = polygon[(i + 1) % polygon.length];
        [0, 0.25, 0.5, 0.75].forEach(ratio => {
          const point = { x: a.x + (b.x - a.x) * ratio, y: a.y + (b.y - a.y) * ratio };
          const isWalkableEdge = polygon === collisionRegions.walkableBoundary;
          const offsetX = (point.x - center.x) * (isWalkableEdge ? -1 : 1);
          const offsetY = (point.y - center.y) * (isWalkableEdge ? -1 : 1);
          const length = Math.max(1, Math.hypot(offsetX, offsetY));
          const safePoint = {
            x: Phaser.Math.Clamp(point.x + offsetX / length * edgeClearance, 0, WORLD_WIDTH),
            y: Phaser.Math.Clamp(point.y + offsetY / length * edgeClearance, 0, WORLD_HEIGHT)
          };
          if (isWalkable(safePoint.x, safePoint.y)) edgePoints.push(safePoint);
        });
      }
      if (edgePoints.length < 2) return;
      const nearestStart = edgePoints.reduce((index, point, i) =>
        Phaser.Math.Distance.Between(start.x, start.y, point.x, point.y) <
        Phaser.Math.Distance.Between(start.x, start.y, edgePoints[index].x, edgePoints[index].y) ? i : index, 0);
      const nearestEnd = edgePoints.reduce((index, point, i) =>
        Phaser.Math.Distance.Between(end.x, end.y, point.x, point.y) <
        Phaser.Math.Distance.Between(end.x, end.y, edgePoints[index].x, edgePoints[index].y) ? i : index, 0);
      [1, -1].forEach(direction => {
        const edgePath = [];
        let index = nearestStart;
        for (let count = 0; count <= edgePoints.length; count++) {
          edgePath.push(edgePoints[index]);
          if (index === nearestEnd) break;
          index = (index + direction + edgePoints.length) % edgePoints.length;
        }
        const path = [edgePath, [end]].flat();
        let previous = start;
        if (path.every(point => {
          const safe = requiresRedClearance
            ? isRedClearanceSafeSegment(previous, point, redClearance)
            : isSafePath(previous, point);
          previous = point;
          return safe;
        }) && isWalkable(end.x, end.y)) {
          paths.push(path);
        }
      });
    });
    return paths;
  }

  function getEnemyNextRoutePoint(enemy) {
    for (let i = enemy.waypointIndex; i < enemy.route.length; i++) {
      if (isRouteNodeWalkable(enemy.route[i])) return enemy.route[i];
    }
    return null;
  }

  function replanEnemyToNextPoint(enemy, target, time, priority = false) {
    if (!target) return false;
    const targetKey = `${Math.round(target.x)}:${Math.round(target.y)}`;
    if (enemy.replanAttemptedKey === targetKey && time < enemy.replanRetryAt) {
      return enemy.detourPath.length > 0;
    }
    // 本帧的整段绕行名额已用完：不写重试键、不记冷却，下一帧再排队，
    // 本帧继续沿既有绕行路径前进（没有路径时由逐帧安全转向兜底）。
    // 卡死兜底必须传 priority：那条路径会按返回值为假跳过当前路线点，
    // 若把「排队中」也当成失败，被卡住的单位会在几帧内连跳多个点位
    if (!priority && !takeEnemyReplanSlot()) return enemy.detourPath.length > 0;
    enemy.replanAttemptedKey = targetKey;
    enemy.replanRetryAt = time + ENEMY_REPLAN_COOLDOWN;
    const start = { x: enemy.x, y: enemy.y };
    const path = getShortestShieldedPath(
      start,
      target,
      isRedZonePathCrossed(start.x, start.y, target.x, target.y),
      ENEMY_RED_ZONE_CLEARANCE
    );
    enemy.replanTargetKey = targetKey;
    enemy.detourPath = path && path.every((point, index) => {
      const previous = index === 0 ? start : path[index - 1];
      return isRedClearanceSafeSegment(previous, point, ENEMY_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_TOLERANCE);
    }) ? path : [];
    return enemy.detourPath.length > 0;
  }

  // 敌军共用的安全转向：直线净空就直接走该点，接近屏蔽区时改走沿红区外沿的滑动点。
  // 这样每帧只做净空与滑动判定，不会为绕行反复整段重规划，也不会撞上红区急停
  // speed 缺省取行军速度，智能追踪时传入 300 像素/秒的追踪速度：
  // 转向与推进共用同一份「每帧预算」，任何帧率下速度都严格等于传入值
  function steerEnemyTowards(enemy, target, delta, maxStep, speed = enemy.speed) {
    if (!target) return null;
    const origin = { x: enemy.x, y: enemy.y };
    const stepBudget = Math.max(0.6, speed * delta / 1000);
    const budget = maxStep === undefined ? stepBudget : Math.min(stepBudget, maxStep);
    // 转向与净空判定都用「安全带 + 转向偏置」作为目标净空：直接按 38 像素做推离修正时，
    // 落点会正好停在 9.999，下一帧任何步进都会被判为不净空而丢弃，单位就再也走不动了
    const safeClearance = ENEMY_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS;
    let point = null;
    if (isRedClearanceSafeSegment(origin, target, safeClearance, false, RED_CLEARANCE_TOLERANCE)) {
      point = limitPointTowards(origin, target, budget);
    } else {
      const steered = getPlayerSteeringTarget(origin, target, budget, safeClearance);
      // 单帧步长同样受预算限制：追击时用它把位移严格卡在行动点牵引半径以内
      point = steered ? limitPointTowards(origin, steered, budget) : null;
      // 贴边兜底：转向点位移不足整帧预算时（贴边脱离与推离修正互相抵消，几乎原地不动），
      // 再算一次「沿红区外沿滑动」的推进点；贴边时只要不比你差就用它，
      // 保证沿屏蔽区行走时始终以红区轮廓为最终判断依据、按设定速度前进而不抖动
      const advanced = point ? Phaser.Math.Distance.Between(origin.x, origin.y, point.x, point.y) : 0;
      if (advanced < budget - RED_CLEARANCE_TOLERANCE) {
        const contourStep = getEnemyContourStep(origin, target, budget, safeClearance);
        if (contourStep) {
          const contourAdvance = Phaser.Math.Distance.Between(origin.x, origin.y, contourStep.x, contourStep.y);
          const hugging = !isRedClearanceSafePoint(origin.x, origin.y, safeClearance);
          if (contourAdvance > advanced || (hugging && contourAdvance > advanced - RED_CLEARANCE_TOLERANCE)) {
            point = contourStep;
          }
        }
      }
    }
    // 转向点可能落在路径松弛量之内，这里再收紧一次，避免单位实际贴进安全带
    return point ? enforceEnemyRedClearanceStep(origin, point) : null;
  }

  // 敌军沿红区外沿的组合步：站位已在安全带以内时，先把这一步用于脱离，
  // 余量再沿红区外沿滑动，两段合成为一个本帧可直连的落点（贴边时不再逐帧空转）。
  // 返回 null 表示当前没有任何可用的沿边推进点
  function getEnemyContourStep(origin, target, budget, clearance = ENEMY_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS) {
    const walkClearance = clearance + PLAYER_RED_STEER_BIAS;
    let base = origin;
    let remaining = budget;
    if (!isRedClearanceSafePoint(origin.x, origin.y, walkClearance)) {
      const escape = correctPointOutOfRedClearance(origin, walkClearance);
      const escapeDistance = Phaser.Math.Distance.Between(origin.x, origin.y, escape.x, escape.y);
      if (!(escapeDistance > 0.0001)) return null;
      if (escapeDistance >= remaining) {
        const ratio = remaining / escapeDistance;
        return { x: origin.x + (escape.x - origin.x) * ratio, y: origin.y + (escape.y - origin.y) * ratio };
      }
      base = escape;
      remaining -= escapeDistance;
    }
    const slide = remaining > 0.0001
      ? slideAlongRedContour(base, target, remaining, clearance)
      : null;
    return slide || (base === origin ? null : base);
  }

  // 把点限制在以 origin 为圆心、maxDistance 为半径的范围内，保证单帧位移不超过预算
  function limitPointTowards(origin, point, maxDistance) {
    const dx = point.x - origin.x;
    const dy = point.y - origin.y;
    const distance = Math.hypot(dx, dy);
    if (!(distance > maxDistance) || distance <= 0) return point;
    const ratio = maxDistance / distance;
    return { x: origin.x + dx * ratio, y: origin.y + dy * ratio };
  }

  // 敌方落点净空（只留亚像素容差）：起点在安全带内时放行，交给上层走脱离逻辑，避免被判死卡住。
  // 容差必不可少——单位站位可能正好压净空边界上，严格比较会否掉整段沿边推进步
  function enforceEnemyRedClearanceStep(origin, point) {
    if (!point) return null;
    if (isRedClearanceSafeSegment(origin, point, ENEMY_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_TOLERANCE)) {
      return point;
    }
    const corrected = correctPointOutOfRedClearance(point, ENEMY_RED_ZONE_CLEARANCE + RED_CLEARANCE_TOLERANCE);
    if (isRedClearanceSafeSegment(origin, corrected, ENEMY_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_TOLERANCE)) {
      return corrected;
    }
    // 起点或落点已经压进安全带（含亚像素）时，先把两者一起外推到安全带 + 转向偏置再按原方向推进：
    // 实测单位正好停在净空 9.999 的站位上，从那里出发的任何一步都会被判为不净空，
    // 若不先脱离，这一帧就会被整段丢弃，单位就会永远原地不动
    const standoff = ENEMY_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS;
    const paddedOrigin = correctPointOutOfRedClearance(origin, standoff);
    const paddedPoint = correctPointOutOfRedClearance(point, standoff);
    if (!isRedClearanceSafeSegment(paddedOrigin, paddedPoint, ENEMY_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_TOLERANCE)) {
      return null;
    }
    let safeRatio = 0;
    let unsafeRatio = 1;
    let best = paddedOrigin;
    for (let index = 0; index < 8; index += 1) {
      const ratio = (safeRatio + unsafeRatio) / 2;
      const probe = {
        x: paddedOrigin.x + (paddedPoint.x - paddedOrigin.x) * ratio,
        y: paddedOrigin.y + (paddedPoint.y - paddedOrigin.y) * ratio
      };
      if (isRedClearanceSafeSegment(paddedOrigin, probe, ENEMY_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_TOLERANCE)) {
        best = probe;
        safeRatio = ratio;
      } else {
        unsafeRatio = ratio;
      }
    }
    return best;
  }

  // 本帧位移直接积分：把单位沿目标方向推进「速度 × 帧长」（不越过目标点），
  // 再用 body.reset 落地。Arcade 物理是按 60Hz 固定步长推进的，而本作渲染帧率远高于 60fps，
  // 交给 moveToObject 换算速度时会出现「好几帧完全不动、动一下跳一小步」的迟滞感，
  // 实测速度也只有 300 像素/秒的一半左右；改成按渲染帧长积分后，任何帧率下速度都严格等于设定值
  function advanceEnemyTowards(enemy, point, delta, speed) {
    if (!point || !enemy.body) return false;
    const dx = point.x - enemy.x;
    const dy = point.y - enemy.y;
    const distance = Math.hypot(dx, dy);
    const travel = Math.min(
      distance,
      Math.max(0, (speed === undefined ? enemy.speed : speed) * delta / 1000)
    );
    if (!(travel > 0.0001)) {
      enemy.body.stop();
      return false;
    }
    const ratio = travel / distance;
    enemy.body.reset(enemy.x + dx * ratio, enemy.y + dy * ratio);
    return true;
  }

  // 起点落在不可行走区域（被隔离推挤顶到世界边界、地形缺口）时的兜底：
  // 所有以非法起点开头的线段都会被 isSafePath 否掉，转向 / 绕行 / 沿边滑动会全部返回空，
  // 单位就会永久空转。这里退化成入场行军那套纯积分推进——朝路线上最近的可行走节点
  // 直线走一步（同样受速度限制，不会瞬移），走出非法区域后常规判定自动接管
  function stepEnemyOutOfUnwalkable(enemy, delta) {
    if (!delta || isEnemyPoseWalkable(enemy)) return false;
    const route = enemy.route || [];
    let target = null;
    let bestDistance = Infinity;
    for (let i = 0; i < route.length; i++) {
      const node = route[i];
      if (!isRouteNodeWalkable(node)) continue;
      const distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, node.x, node.y);
      if (distance < bestDistance) {
        bestDistance = distance;
        target = node;
      }
    }
    if (!target || !advanceEnemyTowards(enemy, target, delta)) return false;
    syncEnemyFacing(enemy, target);
    setEnemyAnimation(enemy, 'move', true);
    return true;
  }

  // 红色屏蔽区视线判定：敌方与我方单位之间的直线只要穿过红色屏蔽区，
  // 敌方就既看不到、也打不到该单位。与我方攻击用的是同一套判定（isRedZonePathCrossed），
  // 攻守双方规则一致
  function isEnemySightClear(enemy, point) {
    if (!point) return false;
    return !isRedZonePathCrossed(enemy.x, enemy.y, point.x, point.y);
  }

  // 单名队员是否可被该敌人看到：存活、有角色对象、且直线未被红色屏蔽区遮挡
  function isPlayerMemberVisibleTo(enemy, member) {
    if (!member || !member.alive || !member.character) return false;
    return isEnemySightClear(enemy, member.character);
  }

  // 进入追踪时锁定的队员：只在 beginEnemyTrack / endEnemyTrack 改写，
  // 追踪期间一直沿用，不再每帧重新比较三名队员的距离
  function getLockedPlayerMember(enemy) {
    if (!enemy.lockedTargetKey) return null;
    for (let s = 0; s < playerSquads.length; s++) {
      const members = playerSquads[s].members;
      for (let i = 0; i < members.length; i++) {
        const member = members[i];
        if (member.uid !== enemy.lockedTargetKey) continue;
        return member.alive && member.character ? member : null;
      }
    }
    return null;
  }

  // 可交战目标：优先沿用已锁定的队员（只要仍存活且直线畅通），
  // 只有在锁定对象阵亡、被红色屏蔽区挡住、或尚未锁定时才重新挑选最近的可见队员。
  // 目标锁定是抖动的第二道防线：三名队员只相隔十几像素，若每帧都重新挑「最近」，
  // 目标点会在队员之间来回跳变十几像素，姿态也跟着在攻击与移动之间闪
  function findNearestVisiblePlayerMember(enemy) {
    const locked = getLockedPlayerMember(enemy);
    if (isPlayerMemberVisibleTo(enemy, locked)) return locked;
    // 视线判定要跑一次红区相交测试，比距离计算贵得多（每帧每名敌人要检查全部存活队员）。
    // 于是改成「由近到远」逐个检查：先用纯算术挑出当前最近的一名，视线畅通就直接返回，
    // 被挡住才把这一名标记为已查、继续找下一名。排序键为（距离, 出现顺序），
    // 与「按小队/队员数组顺序整体扫一遍、取最近的可见者」的结果严格一致
    let testedDistance = -Infinity;
    let testedOrdinal = -1;
    while (true) {
      let candidate = null;
      let candidateDistance = Infinity;
      let candidateOrdinal = -1;
      let ordinal = 0;
      for (let s = 0; s < playerSquads.length; s++) {
        const members = playerSquads[s].members;
        for (let i = 0; i < members.length; i++) {
          const member = members[i];
          const currentOrdinal = ordinal++;
          if (!member.alive || !member.character) continue;
          const distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, member.character.x, member.character.y);
          if (distance < testedDistance) continue;
          if (distance === testedDistance && currentOrdinal <= testedOrdinal) continue;
          if (distance >= candidateDistance) continue;
          candidateDistance = distance;
          candidateOrdinal = currentOrdinal;
          candidate = member;
        }
      }
      if (!candidate) return null;
      if (isPlayerMemberVisibleTo(enemy, candidate)) return candidate;
      testedDistance = candidateDistance;
      testedOrdinal = candidateOrdinal;
    }
  }

  // 追踪目标点：锁定「直线畅通且距离最近的一名存活队员」，追击与开火命中同一个人，
  // 不会出现「追着 A 却把子弹打向 B」的错位；
  // 全部队员都被红色屏蔽区挡住时返回 null，表示敌方已失去可交战目标
  function getEnemyTrackTargetPoint(enemy) {
    // 同一帧内敌我位置都不会再变，而本函数在敌方主循环与追踪逻辑里各调用一次；
    // 按「敌人 + 帧号」复用一次选人结论，视线判定（含红区相交测试）每帧每人只做一次
    if (enemy.aimFrame !== redQueryFrame) {
      const member = findNearestVisiblePlayerMember(enemy);
      const visible = member && member.character ? member.character : null;
      enemy.aimX = visible ? visible.x : null;
      enemy.aimY = visible ? visible.y : null;
      enemy.aimFrame = redQueryFrame;
    }
    if (enemy.aimX === null) return null;
    return { x: enemy.aimX, y: enemy.aimY };
  }

  // 追踪与交火的距离参照：同样取「直线畅通的最近存活队员」，与追踪目标点是同一个点。
  // 激活追踪、退出追踪、判断是否进入攻击范围都用它，不会出现
  // 「按小队中心判定射程、却朝着另一名队员开枪」的错位；
  // 目标不可见（直线被红色屏蔽区遮挡）时返回 Infinity，等价于「已超出追踪范围」，
  // 追踪与开火都会立刻停止，直到视线重新畅通
  function getEnemyTrackGap(enemy) {
    const aimPoint = getEnemyTrackTargetPoint(enemy);
    if (!aimPoint) return Infinity;
    return Phaser.Math.Distance.Between(enemy.x, enemy.y, aimPoint.x, aimPoint.y);
  }

  // 进入追踪：我方单位进入追踪范围（160 像素）即激活，随即由 updateEnemyTracking 立即开火。
  // 追踪位移不再受「行动点牵引半径」限制，而是由追踪范围约束：追击期间不会突然折返，
  // 也不会出现「明明在射程内却站着不动」的迟滞
  function beginEnemyTrack(enemy, time) {
    if (!hasSpawnedPlayerSquad()) return false;
    if (enemy.routeState === 'tracking') return true;
    enemy.routeState = 'tracking';
    enemy.engaging = false;
    // 锁定目标：原锁定对象仍存活且直线畅通就继续用，否则重选最近的可见队员。
    // 追踪期间目标固定，不会被队友挤位抢走焦点
    if (!isPlayerMemberVisibleTo(enemy, getLockedPlayerMember(enemy))) {
      const locked = findNearestVisiblePlayerMember(enemy);
      enemy.lockedTargetKey = locked ? locked.uid : null;
    }
    enemy.holdUntil = 0;
    enemy.detourPath = [];
    enemy.replanAttemptedKey = null;
    enemy.stuckAt = 0;
    // 进入追踪时重排开火节奏：很早就冷却完毕的计时不会让敌军一进入射程就连开数枪
    if (!(enemy.nextAttackAt > time)) enemy.nextAttackAt = time;
    return true;
  }

  // 放弃追踪：立刻折返原路线继续推进。是否重新追踪完全由「进入攻击范围」决定，
  // 不设任何时间冷却，不会出现「冷却期内站在射程内却不追」的迟滞
  function endEnemyTrack(enemy) {
    enemy.routeState = 'following';
    // 放弃追踪即解除目标锁定与交火姿态：下次进入追踪重新选人、重新从移动姿态起步
    enemy.lockedTargetKey = null;
    enemy.engaging = false;
    enemy.detourPath = [];
    enemy.replanAttemptedKey = null;
    enemy.stuckAt = 0;
  }

  // 追踪中的每帧行为：速度恒定为 ENEMY_TRACK_SPEED（300 像素/秒），按帧长积分，
  // 任何帧率下每帧位移都严格等于 80 × 帧长，不会出现移动迟滞；
  // 逼近到停火距离（= 默认攻击范围，100 像素）就停下交火，
  // 只有拉开到追踪范围之外才放弃追踪，随即从当前位置走向下一个行动点。
  // 攻击与追踪都要过红色屏蔽区判定：目标取「直线畅通的锁定队员」，
  // 视线被屏蔽区挡住时目标为空（等价于超出追踪范围），追踪与开火立刻停止。
  // 姿态与距离状态同步：我方人形在交火带内姿态恒为攻击动作（包含重新进入），
  // 拉出交火带立刻打断攻击动画转入移动动画，不做任何排队等待，也不经过等待动作。
  // 两条阈值都带迟滞，防止边界抖动：
  //   1. 进入交火 = 攻击范围 + 4 像素容差（ENEMY_ATTACK_CONTACT_TOLERANCE，见下），
  //      维持交火 = 进入交火 + ENEMY_ATTACK_RELEASE_MARGIN（12 像素）；
  //   2. 退出追踪 = 追踪范围 + ENEMY_TRACK_RELEASE_MARGIN（16 像素）。
  // 判断是否「已在攻击距离上」带 4 像素容差：敌军站定后可能正好停在停火距离外
  // 零点几个像素处，严格比较会把它挡在攻击逻辑之外，
  // 出现「我方单位明明已经贴到攻击距离、敌军却一直待机不开火」的错误
  function updateEnemyTracking(enemy, time, trackGap, delta) {
    // 退出追踪的门限是追踪范围 + 迟滞带（160 + 16 = 176 像素）：拉开到这么远才放弃追踪，
    // 这一帧不再改姿态，下一帧由常规路线逻辑接着从当前位置走向下一个行动点
    if (!hasSpawnedPlayerSquad() || trackGap > ENEMY_TRACK_RANGE + ENEMY_TRACK_RELEASE_MARGIN) {
      enemy.body.stop();
      endEnemyTrack(enemy);
      return;
    }
    // 本帧位移上限同时受「帧长」与「停在交火距离」两个条件约束，
    // 因此逼近速度恒定 300 像素/秒，也不会冲进交火距离之内把我方单位挤开
    const aimPoint = getEnemyTrackTargetPoint(enemy);
    // 目标直线被红色屏蔽区挡住（或我方已无存活队员）：立刻放弃追踪，避免越区开火
    if (!aimPoint) {
      enemy.body.stop();
      endEnemyTrack(enemy);
      return;
    }
    const gap = Phaser.Math.Distance.Between(enemy.x, enemy.y, aimPoint.x, aimPoint.y);
    // 锁定对象阵亡或直线被红色屏蔽区挡住时，上面的取点已自动改选最近的可见队员，
    // 这里同步把锁定刷新到同一人，保证后续帧的目标点不再漂移
    if (!isPlayerMemberVisibleTo(enemy, getLockedPlayerMember(enemy))) {
      const relocked = findNearestVisiblePlayerMember(enemy);
      enemy.lockedTargetKey = relocked ? relocked.uid : null;
    }
    const frameStep = ENEMY_TRACK_SPEED * Math.max(0, delta) / 1000;
    // 「已在交火带内」用带容差 + 迟滞的判定：交火姿态一旦建立，容许多出 12 像素的
    // 迟滞带才退出，这样我方单位在停火距离附近上下微动时姿态不会每帧翻来覆去；
    // 同时站位停在停火距离外零点几个像素时位移预算会小到迈不动一步，
    // 必须按「已到位」站定开火，不能继续等位移
    const contactRange = ENEMY_ATTACK_RANGE + ENEMY_ATTACK_CONTACT_TOLERANCE +
      (enemy.engaging ? ENEMY_ATTACK_RELEASE_MARGIN : 0);
    const inAttackRange = gap <= contactRange;
    const stepBudget = inAttackRange ? 0 : Math.min(frameStep, gap - ENEMY_TRACK_STOP_DISTANCE);
    const steered = stepBudget > 0
      ? steerEnemyTowards(enemy, aimPoint, delta, stepBudget, ENEMY_TRACK_SPEED)
      : null;
    if (steered && advanceEnemyTowards(enemy, steered, delta, ENEMY_TRACK_SPEED)) {
      syncEnemyFacing(enemy, aimPoint);
      // 拉出交火带：立即打断正在播放的攻击动画，换成移动动画，并解除交火姿态
      enemy.engaging = false;
      setEnemyAnimation(enemy, 'move', true);
      return;
    }
    // 站定后的交火阶段
    enemy.body.stop();
    setEnemyFacing(enemy, aimPoint.x < enemy.x);
    if (!inAttackRange) {
      // 还没进交火带却无法位移（被红区挡住走不动）：先待机等路径打开。
      // 这里不强制重播：每帧重播会把等待动作一直按回第一帧，看上去像卡住不动
      enemy.engaging = false;
      setEnemyAnimation(enemy, 'wait');
      return;
    }
    // 我方人形在交火带内：姿态恒为攻击动作（循环播放，一直打到我方单位拉出交火带为止）。
    // 首次进入与重新进入都直接进攻击动作，中途不会退回等待动作，因此不会出现
    // 「人在射程内、敌方却在待机」或「重新进入时先播一次等待动作」的错觉
    enemy.engaging = true;
    setEnemyAnimation(enemy, 'attack', ENEMY_ATTACK_LOOP);
    // 伤害结算仍然按固定间隔节流：姿态一直在攻击，命中不会变成每帧一次
    if (time < enemy.nextAttackAt) return;
    enemy.nextAttackAt = time + ENEMY_ATTACK_INTERVAL;
    // 命中锁定的队员：敌方实伤 = 攻击力 1 - 我方防御（敌方攻击力的 20%）= 0.8
    const victim = findNearestVisiblePlayerMember(enemy);
    if (victim) damagePlayerMember(enemy.scene, victim, ENEMY_DAMAGE_PER_HIT);
  }

  // 行动点待机判定：每次待机只判定一次——
  // 玩家已进入追踪范围就转入追踪；下一路线节点被红区挡住就提前改走沿红区外沿的绕行曲线
  function decideEnemyActionPoint(enemy, time, trackGap) {
    if (enemy.decisionDone) return;
    enemy.decisionDone = true;
    if (hasSpawnedPlayerSquad() && trackGap <= ENEMY_TRACK_RANGE) {
      beginEnemyTrack(enemy, time);
      return;
    }
    const nextRoutePoint = getEnemyNextRoutePoint(enemy);
    if (!nextRoutePoint) return;
    if (isRedClearanceSafeSegment({ x: enemy.x, y: enemy.y }, nextRoutePoint, ENEMY_RED_ZONE_CLEARANCE)) {
      return;
    }
    if (replanEnemyToNextPoint(enemy, nextRoutePoint, time)) enemy.routeState = 'detouring';
  }

  // 卡顿兜底：想走却长时间几乎没有位移，说明被屏蔽区或边界卡住，
  // 清除绕行缓存强制重规划一次；仍然无解就跳过当前路线点，保证敌军不会永久停在原地
  function isEnemyStuck(enemy, time, wantsMove) {
    if (!wantsMove) {
      enemy.stuckAt = 0;
      return false;
    }
    if (!enemy.stuckAt) {
      enemy.stuckAt = time;
      enemy.stuckX = enemy.x;
      enemy.stuckY = enemy.y;
      return false;
    }
    if (time - enemy.stuckAt < ENEMY_STUCK_TIME) return false;
    const moved = Phaser.Math.Distance.Between(enemy.stuckX, enemy.stuckY, enemy.x, enemy.y);
    enemy.stuckAt = time;
    enemy.stuckX = enemy.x;
    enemy.stuckY = enemy.y;
    return moved < ENEMY_STUCK_DISTANCE;
  }

  function segmentOrientation(p, q, r) {
    const value = (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y);
    if (Math.abs(value) < 0.000001) return 0;
    return value > 0 ? 1 : 2;
  }

  function pointOnSegment(p, q, r) {
    return q.x >= Math.min(p.x, r.x) &&
      q.x <= Math.max(p.x, r.x) &&
      q.y >= Math.min(p.y, r.y) &&
      q.y <= Math.max(p.y, r.y);
  }

  // 相交判定：原先把 orientation / onSegment 写在函数体内，每次调用都要新建闭包，
  // 而红区穿越判定单次查询就要调用上百次，因此提到外层复用
  function segmentsIntersect(a, b, c, d) {
    const first = segmentOrientation(a, b, c);
    const second = segmentOrientation(a, b, d);
    const third = segmentOrientation(c, d, a);
    const fourth = segmentOrientation(c, d, b);
    if (first !== second && third !== fourth) return true;
    if (first === 0 && pointOnSegment(a, c, b)) return true;
    if (second === 0 && pointOnSegment(a, d, b)) return true;
    if (third === 0 && pointOnSegment(c, a, d)) return true;
    return fourth === 0 && pointOnSegment(c, b, d);
  }

  // 敌方单位血条：红底细长条形，锚点取其当前姿态的头顶上方 8 像素（不遮挡人物）
  function updateEnemyHealthBar(enemy) {
    if (!enemy.active || !enemy.hpBar) return;
    // 已经进入阵亡引爆流程的敌人不再展示血条，避免和泛红染色叠在一起显得嘈杂；
    // 未被攻击过（满血）的敌方单位也不显示血条（敌方没有回血机制，被打过就一直显示）。
    // 这两种情况下血条本来就在隐藏状态，重复 clear() 只是白花一次显示列表刷新
    if (enemy.charging || enemy.hp >= enemy.maxHp) {
      if (enemy.hpBarShown) {
        enemy.hpBarShown = false;
        enemy.hpBar.clear().setVisible(false);
      }
      return;
    }
    const bottomY = getUnitHealthBarBottom(enemy.character);
    if (bottomY === null) return;
    const ratio = Phaser.Math.Clamp(enemy.hp / enemy.maxHp, 0, 1);
    // 位置与比例都没变就不必重画：终点待机的人堆、被隔离推挤相互抵消位移的单位整帧不动
    if (enemy.hpBarShown
      && enemy.hpBarX === enemy.x && enemy.hpBarBottom === bottomY && enemy.hpBarRatio === ratio) {
      return;
    }
    enemy.hpBarShown = true;
    enemy.hpBarX = enemy.x;
    enemy.hpBarBottom = bottomY;
    enemy.hpBarRatio = ratio;
    enemy.hpBar.clear().setVisible(true);
    drawHealthBar(enemy.hpBar, enemy.x, bottomY, ENEMY_BAR_WIDTH, HEALTH_BAR_HEIGHT, ratio, ENEMY_BAR_COLOR);
  }

  // 敌方姿态切换：姿态完全跟随距离状态即时切换——我方单位一移出攻击范围，
  // 正在播放的攻击动画立刻被打断、换成追踪的移动动画；重新进入攻击范围又立刻
  // 打断移动动画换回来，中途不排队、不等动作播完。
  // 这里只负责把动作下发到骨骼，currentAnimation 由调用方维护；
  // 唯一保留的约束是「同名姿态不重复下发」，避免每帧重新 setAnimation
  // 让动作从第一帧重播而卡在起始帧
  function setEnemyAnimation(enemy, animationName, loop, force = false) {
    if (!enemy.character || enemy.character.active === false) return;
    // 同一次攻击不重复下发：重复 setAnimation 会让动作从第一帧重播，看起来像被打断
    if (animationName === 'attack' && enemy.currentAnimation === 'attack') return;
    if (!force && enemy.currentAnimation === animationName) return;
    enemy.currentAnimation = animationName;
    enemy.character.setAnimation(0, animationName, loop);
  }

  function setEnemyFacing(enemy, isLeft) {
    if (!enemy.character) return;
    enemy.facingLeft = isLeft;
    // 敌方单位默认朝左；向左使用负 X 缩放，向右恢复正 X。
    const scaleX = isLeft ? Math.abs(ENEMY_CHARACTER_SCALE) : -Math.abs(ENEMY_CHARACTER_SCALE);
    enemy.character.setScale(scaleX, ENEMY_CHARACTER_SCALE);
    enemy.character.scaleX = scaleX;
    enemy.character.scaleY = ENEMY_CHARACTER_SCALE;
  }

  function syncEnemyFacing(enemy, fallbackTarget) {
    // Waypoint 方向优先于上一帧速度，避免 moveToObject 更新前出现一帧反向。
    if (fallbackTarget && Math.abs(fallbackTarget.x - enemy.x) > 0.01) {
      setEnemyFacing(enemy, fallbackTarget.x < enemy.x);
      return;
    }
    const horizontalVelocity = enemy.body && enemy.body.velocity.x;
    if (Math.abs(horizontalVelocity) > 0.01) {
      setEnemyFacing(enemy, horizontalVelocity < 0);
    }
  }

  function destroyEnemy(enemy, playDeathAnimation = false) {
    if (!enemy || !enemy.active || enemy.deathStarted) return;
    const scene = enemy.scene;
    enemy.deathStarted = true;
    enemy.body.stop();
    enemy.body.enable = false;
    enemy.setActive(false);
    enemy.setVisible(false);
    if (focusTarget === enemy) focusTarget = null;
    if (enemy.hpBar) {
      enemy.hpBar.destroy();
      enemy.hpBar = null;
    }
    if (playDeathAnimation && enemy.character) {
      const deathX = enemy.x;
      const deathY = enemy.y;
      const deathWidth = enemy.character.displayWidth || ENEMY_CHARACTER_SCALE * 130;
      const deathHeight = enemy.character.displayHeight || ENEMY_CHARACTER_SCALE * 187;
      const sinkDistance = Math.max(deathWidth, deathHeight) / 4;
      enemy.character.setPosition(deathX, deathY);
      enemy.character.setVisible(true);
      enemy.character.setAnimation(0, 'die', false);
      enemy.character.removeInteractive();
      enemy.character.setDepth(2);
      // 单位已从物理组移除，死亡动画单独播放，避免死亡单位继续参与逐帧逻辑。
      scene.time.delayedCall(3000, () => {
        if (!enemy.character || !scene.sys.isActive()) return;
        scene.tweens.add({
          targets: enemy.character,
          y: deathY + sinkDistance,
          alpha: 0,
          duration: 500,
          ease: 'Quad.easeIn',
          onComplete: () => {
            if (enemy.character) {
              enemy.character.destroy();
              enemy.character = null;
            }
          }
        });
      });
    } else if (enemy.character) {
      enemy.character.destroy();
      enemy.character = null;
    }
    enemy.destroy();
  }

  // ----------------------------------------------------
  // 战斗数值 / 血条 / 阵亡自爆
  // 双方通用：血条耗尽 -> 以柔和的速度逐渐泛红 25% ->
  //   我方：脱离队伍冲向最近的敌人（冲锋全程保留移动动画）-> 满 5 秒自爆 / 贴上目标即刻自爆，
  //         40 像素圆范围伤害（爆心 20 点，每向外扩 10 像素递减 20%），命中者被击退
  //   敌方：原地不动 -> 满 3 秒原地自爆，5 点范围伤害
  // ----------------------------------------------------

  // 我方自爆的伤害递减：爆心 10 像素内 20 点，之后每向外扩 10 像素伤害降低 20%，
  // 逐档为 20 / 16 / 12.8 / 10.24 ...（距离一律取爆心到目标的直线距离）
  function getPlayerExplosionDamage(distance) {
    const bands = Math.floor(Math.max(0, distance) / PLAYER_EXPLOSION_FALLOFF_STEP);
    return PLAYER_EXPLOSION_CENTER_DAMAGE *
      Math.pow(1 - PLAYER_EXPLOSION_DAMAGE_FALLOFF, bands);
  }

  // 相机可视范围夹取：可视范围在地图内时按地图边界限制（与原来的相机边界等效）；
  // 可视范围一旦大于地图（正常不会发生，最小缩放已保证地图宽度铺满视野宽度），
  // 就把地图居中摆好，而不是像 Phaser 自带边界那样把地图顶到左上角
  function clampCameraToWorld() {
    const cam = gameScene.cameras.main;
    const viewWidth = cam.width / cam.zoom;
    const viewHeight = cam.height / cam.zoom;
    // 相机 scrollX/Y 与「可视区域左上角世界坐标」之间的偏移（缩放不为 1 时存在，来自 Phaser 的原点补偿）
    const offsetX = (viewWidth - cam.width) / 2;
    const offsetY = (viewHeight - cam.height) / 2;
    const minLeft = Math.min(0, (WORLD_WIDTH - viewWidth) / 2);
    const maxLeft = Math.max(0, WORLD_WIDTH - viewWidth);
    const minTop = Math.min(0, (WORLD_HEIGHT - viewHeight) / 2);
    const maxTop = Math.max(0, WORLD_HEIGHT - viewHeight);
    cam.scrollX = Phaser.Math.Clamp(cam.scrollX - offsetX, minLeft, maxLeft) + offsetX;
    cam.scrollY = Phaser.Math.Clamp(cam.scrollY - offsetY, minTop, maxTop) + offsetY;
  }

  // 自爆屏幕震动：相机沿视线方向推拉（缩放往复），爆心越大抖得越明显。
  // 镜头没贴近屏幕（缩放低于阈值）时直接不抖，只记录本次震动的参数，逐帧推进交给 updateExplosionShake
  let explosionShake = null;   // { camera, baseZoom, appliedZoom, elapsed, duration, amplitude }
  function shakeCameraForExplosion(scene, radius) {
    const camera = scene && scene.cameras ? scene.cameras.main : null;
    if (!camera) return;
    if (camera.zoom < EXPLOSION_SHAKE_MIN_ZOOM) return;
    // 上一段抖动还没结束时：若相机缩放仍是它写入的推拉值（玩家没动过滚轮），
    // 就沿用它的基准缩放，避免把抖动中的临时缩放当成新基准而累积偏移；
    // 玩家在抖动期间改过缩放时则以当前缩放为准
    const prev = explosionShake && explosionShake.camera === camera ? explosionShake : null;
    const reuse = prev && Math.abs(camera.zoom - prev.appliedZoom) <= 0.0005 ? prev.baseZoom : camera.zoom;
    const scale = Phaser.Math.Clamp(radius / PLAYER_EXPLOSION_RADIUS, 0.5, 1.25);
    explosionShake = {
      camera: camera,
      baseZoom: reuse,
      appliedZoom: camera.zoom,
      elapsed: 0,
      duration: EXPLOSION_SHAKE_DURATION * scale,
      amplitude: EXPLOSION_SHAKE_AMPLITUDE * scale
    };
  }

  // 震动逐帧推进：按「基准缩放 × (1 ± 幅度)」推拉相机，幅度随时间衰减，结束时精确还原基准缩放。
  // 抖动期间玩家用滚轮改了缩放，则以新缩放为基准继续抖，避免结束时把镜头强行拉回旧值
  function updateExplosionShake(delta) {
    const shake = explosionShake;
    if (!shake) return;
    const camera = shake.camera;
    if (!camera || !camera.scene) {
      explosionShake = null;
      return;
    }
    if (Math.abs(camera.zoom - shake.appliedZoom) > 0.0005) {
      shake.baseZoom = camera.zoom;
    }
    shake.elapsed += Math.max(0, delta);
    const progress = shake.duration > 0 ? shake.elapsed / shake.duration : 1;
    if (progress >= 1) {
      camera.setZoom(shake.baseZoom);
      explosionShake = null;
      return;
    }
    const decay = 1 - progress * progress;
    const wave = Math.sin(progress * Math.PI * 2 * EXPLOSION_SHAKE_CYCLES);
    const zoom = shake.baseZoom * (1 + shake.amplitude * decay * wave);
    camera.setZoom(zoom);
    shake.appliedZoom = zoom;
  }

  // 自爆击退：被命中的敌方单位沿「爆心 -> 单位」连心线被推开 ENEMY_KNOCKBACK_DISTANCE 像素，
  // 在 ENEMY_KNOCKBACK_DURATION 毫秒内匀速走完（10px / 0.5s ≈ 20 像素/秒）。
  // 爆心与单位重合时方向会退化，这里随机取一个方向，避免击退失效
  function applyEnemyKnockback(enemy, fromX, fromY) {
    if (!enemy || !enemy.active || !enemy.body) return;
    let dx = enemy.x - fromX;
    let dy = enemy.y - fromY;
    let length = Math.hypot(dx, dy);
    if (length < 0.0001) {
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      dx = Math.cos(angle);
      dy = Math.sin(angle);
      length = 1;
    }
    enemy.knockback = {
      dirX: dx / length,
      dirY: dy / length,
      speed: ENEMY_KNOCKBACK_DISTANCE / (ENEMY_KNOCKBACK_DURATION / 1000),
      remaining: ENEMY_KNOCKBACK_DURATION
    };
  }

  // 击退位移逐帧结算：落点照旧走 pushEnemyAway 的可行走 + 红区安全带校验，
  // 贴在墙边或红区边缘的单位会被挡下（不会被打进屏蔽区），被挡下即提前结束击退。
  // 击退在本帧路线逻辑之前完成，之后的追踪/行军会从这个新位置继续
  function updateEnemyKnockback(enemy, delta) {
    const knockback = enemy.knockback;
    if (!knockback) return false;
    const dt = Math.max(0, delta);
    knockback.remaining -= dt;
    const step = knockback.speed * dt / 1000;
    // 先走位移再判断是否结束：否则最后一段步长会因为 remaining 归零而被吞掉（全程不足 10 像素）
    if (!pushEnemyAway(enemy, knockback.dirX * step, knockback.dirY * step)) {
      enemy.knockback = null;
      return false;
    }
    if (knockback.remaining <= 0) {
      enemy.knockback = null;
      return false;
    }
    return true;
  }

  // 自爆结算：只对敌对阵营生效，不会波及同阵营单位。
  // 影响范围是以爆心为圆心的圆圈面积，半径由调用方给出（我方统一 40 / 敌方 20）。
  // 我方自爆按距离递减伤害、命中者被击退，并触发一次屏幕震动；伤害数字用鲜红色标出
  function detonateUnit(scene, x, y, faction, radius) {
    const blastRadius = Math.max(0, radius || (faction === 'player' ? PLAYER_EXPLOSION_RADIUS : ENEMY_EXPLOSION_RADIUS));
    spawnExplosion(scene, x, y, blastRadius);
    if (faction === 'player') {
      showCombatText(scene, x, y - 28, PLAYER_DETONATE_TEXT, PLAYER_EXPLOSION_TEXT_COLOR);
      shakeCameraForExplosion(scene, blastRadius);
      enemiesGroup.getChildren().slice().forEach(enemy => {
        if (!enemy.active || enemy.charging) return;
        const distance = Phaser.Math.Distance.Between(x, y, enemy.x, enemy.y);
        if (distance > blastRadius) return;
        damageEnemy(scene, enemy, getPlayerExplosionDamage(distance), PLAYER_EXPLOSION_TEXT_COLOR);
        // 被炸死（转入阵亡待爆）的单位不再击退，倒下的敌人不该被推走
        if (enemy.active && !enemy.charging) applyEnemyKnockback(enemy, x, y);
      });
      return;
    }
    showCombatText(
      scene,
      x,
      y - 28,
      ENEMY_DETONATE_TEXTS[Math.floor(Math.random() * ENEMY_DETONATE_TEXTS.length)],
      ENEMY_DETONATE_TEXT_COLOR
    );
    getAllLivingPlayerMembers().forEach(member => {
      if (Phaser.Math.Distance.Between(x, y, member.character.x, member.character.y) <= blastRadius) {
        damagePlayerMember(scene, member, ENEMY_EXPLOSION_DAMAGE);
      }
    });
  }

  // ---- 敌方单位 ----

  // textColor 只影响浮动伤害数字的颜色：普通攻击沿用原来的黄色，
  // 自爆伤害传入鲜红色（PLAYER_EXPLOSION_TEXT_COLOR）以便和常规伤害区分开
  function damageEnemy(scene, enemy, damage, textColor = '#fce38a') {
    if (!enemy || !enemy.active || enemy.charging || enemy.deathStarted) return;
    enemy.hp = Math.max(0, enemy.hp - damage);
    showCombatText(scene, enemy.x, enemy.y - 34, `-${Math.round(damage * 10) / 10}`, textColor);
    if (enemy.hp <= 0) {
      beginEnemyDeath(enemy);
      return;
    }
    updateEnemyHealthBar(enemy);
  }

  // 敌方阵亡：原地不动，泛红 25% 后继续原地等待，满 3 秒原地自爆
  function beginEnemyDeath(enemy) {
    if (!enemy.active || enemy.charging || enemy.deathStarted) return;
    if (focusTarget === enemy) focusTarget = null;
    if (enemy.body) enemy.body.stop();
    // 引爆前由代码直接写坐标，关闭物理体避免被 arcade 每帧覆盖
    if (enemy.body) enemy.body.enable = false;
    enemy.charging = {
      startedAt: null,
      x: enemy.x,
      y: enemy.y
    };
    if (enemy.hpBar) enemy.hpBar.clear().setVisible(false);
    // 阵亡必须立刻换姿：打断正在播放的攻击动画，直接切到待机（随后进入死亡动作）
    setEnemyAnimation(enemy, 'wait', true, true);
  }

  function updateEnemyDeath(enemy, time) {
    const charge = enemy.charging;
    const character = enemy.character;
    // 引爆计时与主循环共用同一个时间源，染色全程按真实时间线性推进
    if (charge.startedAt === null) charge.startedAt = time;
    const elapsed = time - charge.startedAt;
    const progress = Phaser.Math.Clamp(elapsed / DEATH_TINT_DURATION, 0, 1);
    applyDeathTint(character, progress * DEATH_TINT_STRENGTH);
    if (!character) return;
    // 原地自爆：位置锁定在阵亡点，不做任何位移；泛红完成后继续原地待爆
    enemy.setPosition(charge.x, charge.y);
    character.setPosition(charge.x, charge.y);
    if (elapsed >= ENEMY_DETONATE_DELAY) {
      detonateUnit(enemy.scene, charge.x, charge.y, 'enemy', ENEMY_EXPLOSION_RADIUS);
      destroyEnemy(enemy, false);
    }
  }

  // ---- 我方队员 ----

  function damagePlayerMember(scene, member, damage) {
    if (!member || !member.alive || !member.character) return;
    member.hp = Math.max(0, member.hp - damage);
    // 受击即重新计时：5 秒内不再挨打才会开始回血
    member.lastDamagedAt = scene.time.now;
    showCombatText(scene, member.character.x, member.character.y - 34, `-${Math.round(damage * 10) / 10}`, '#ff6b6b');
    if (member.hp <= 0) beginPlayerMemberDeath(member);
  }

  // 血条耗尽即触发死亡攻击：不再等待泛红完成，立刻进入移动动画并开始索敌，
  // 以 488 像素/秒冲向「移动逻辑规范内」最近的敌方单位。
  // 最长 5 秒必定自爆；期间一旦成功索敌并贴上目标（距离 ≤ 75 像素）就立即自爆、跳过剩余延迟
  function beginPlayerMemberDeath(member) {
    if (!member.alive) return;
    member.alive = false;
    // 冲锋自爆中的队员交出独立碰撞体：单位隔离不再把它算作需要保持距离的单位，
    // 否则它会被敌方单位一路顶开、贴不到 75 像素的引爆距离
    member.body = null;
    member.charging = {
      startedAt: null,
      x: member.character.x,
      y: member.character.y,
      target: null,
      path: [],
      nextRetargetAt: 0,
      // 起始朝向沿用阵型里的朝向，冲锋第一帧不会突然扭头
      facingLeft: member.character ? member.character.scaleX < 0 : true
    };
    // 触发死亡攻击的瞬间就切进移动动画，泛红的 900ms 与冲锋并行，不再原地等待；
    // 记录已下发的姿态，冲锋期间不再重复下发（重复下发会让移动动画帧被重置）
    if (member.character && member.character.active !== false) {
      member.character.setAnimation(0, 'move', true);
      member.charging.animation = 'move';
    }
    // 队长阵亡后不再让该小队的共享动画状态机引用已销毁的骨架
    if (member.isLeader && member.squad) member.squad.character = null;
  }

  // 死亡攻击的索敌：只在「移动逻辑规范」内取最近的可达敌方单位。
  // 可达性直接复用点击移动用的最短安全曲线路径（不穿越红色屏蔽区、不侵入 38 像素安全带），
  // 因此够不到的目标（例如隔着一整片屏蔽区）不会被锁定，冲锋路线也不会越过屏蔽区
  function acquireDeathChargeTarget(charge) {
    const start = { x: charge.x, y: charge.y };
    let best = null;
    let bestDistance = Infinity;
    enemiesGroup.getChildren().forEach(enemy => {
      if (!enemy.active || enemy.charging) return;
      const distance = Phaser.Math.Distance.Between(start.x, start.y, enemy.x, enemy.y);
      if (!(distance < bestDistance)) return;
      if (!isEnemyPoseWalkable(enemy)) return;
      const path = getShortestPlayerPath(start, { x: enemy.x, y: enemy.y });
      if (!path || !path.length) return;
      // 规划失败时 getShortestPlayerPath 只返回「脱离安全带」的那一步，端点必须贴近目标才作数
      const last = path[path.length - 1];
      if (Phaser.Math.Distance.Between(last.x, last.y, enemy.x, enemy.y) > 0.5) return;
      bestDistance = distance;
      best = { target: enemy, path };
    });
    return best;
  }

  function updatePlayerMemberCharge(member, time, delta) {
    const charge = member.charging;
    const character = member.character;
    if (!charge || !character) return;
    // 引爆计时与主循环共用同一个时间源，染色与冲锋全程按真实时间线性推进
    if (charge.startedAt === null) charge.startedAt = time;
    const elapsed = time - charge.startedAt;
    const tintProgress = Phaser.Math.Clamp(elapsed / DEATH_TINT_DURATION, 0, 1);
    applyDeathTint(character, tintProgress * DEATH_TINT_STRENGTH);
    if (member.shadow) {
      member.shadow.setPosition(charge.x, charge.y + SHADOW_OFFSET_Y);
      member.shadow.setAlpha(SHADOW_ALPHA * (1 - 0.35 * tintProgress));
    }
    // 索敌：目标阵亡、目标不在场、或者到了重新索敌间隔就再算一次，
    // 保证「最近的敌人」随着战场变化始终成立
    const targetAlive = charge.target && charge.target.active;
    if (!targetAlive || time >= charge.nextRetargetAt) {
      const acquired = acquireDeathChargeTarget(charge);
      charge.nextRetargetAt = time + DEATH_CHARGE_RETARGET_INTERVAL;
      if (acquired) {
        charge.target = acquired.target;
        charge.path = acquired.path;
      } else if (!targetAlive) {
        charge.target = null;
        charge.path = [];
      }
    }
    // 冲锋：沿与点击移动同一条最短安全曲线以 488 像素/秒推进，全程保留移动动画
    let reached = false;
    if (charge.target) {
      const path = charge.path;
      while (path.length > 1 &&
             Phaser.Math.Distance.Between(charge.x, charge.y, path[0].x, path[0].y) < PLAYER_RED_ARRIVE_DISTANCE) {
        path.shift();
      }
      const waypoint = path.length ? path[0] : { x: charge.target.x, y: charge.target.y };
      const budget = DEATH_CHARGE_SPEED * Math.max(0, delta) / 1000;
      // 与点击移动用同一套净空标准（38 像素安全带）：冲锋过程同样不会切进屏蔽区
      const steered = getPlayerSteeringTarget({ x: charge.x, y: charge.y }, waypoint, budget);
      if (steered) {
        // 曲线行走时朝向上取「本帧实际落点」而不是路径点，避免贴红区绕行时朝向乱甩
        if (Math.abs(steered.x - charge.x) > 0.01) charge.facingLeft = steered.x < charge.x;
        charge.x = steered.x;
        charge.y = steered.y;
      }
      reached = Phaser.Math.Distance.Between(charge.x, charge.y, charge.target.x, charge.target.y)
        <= DEATH_CHARGE_TRIGGER_DISTANCE;
    }
    character.setScale(
      charge.facingLeft ? -PLAYER_CHARACTER_SCALE : PLAYER_CHARACTER_SCALE,
      PLAYER_CHARACTER_SCALE
    );
    // 冲锋全程保留移动动画：只在姿态未下发时下发一次
    if (charge.animation !== 'move') {
      charge.animation = 'move';
      character.setAnimation(0, 'move', true);
    }
    character.setPosition(charge.x, charge.y);
    // 提前自爆（贴上目标 75 像素圆）跳过剩余延迟；死亡延迟满 5 秒同样自爆。
    // 两种自爆统一 40 像素圆，伤害在结算时按爆心距离递减
    if (reached && elapsed < PLAYER_DETONATE_DELAY) {
      detonateUnit(member.squad.unit.scene, charge.x, charge.y, 'player', PLAYER_EXPLOSION_RADIUS);
      finishPlayerMemberCharge(member);
    } else if (elapsed >= PLAYER_DETONATE_DELAY) {
      detonateUnit(member.squad.unit.scene, charge.x, charge.y, 'player', PLAYER_EXPLOSION_RADIUS);
      finishPlayerMemberCharge(member);
    }
  }

  // 队员自爆后移除：自爆动画一开始我方单位就消失——不做淡出残影，直接销毁骨骼与阴影，
  // 画面里从此只剩下覆盖整个爆炸区域的自爆特效
  function finishPlayerMemberCharge(member) {
    if (member.shadow) {
      member.shadow.destroy();
      member.shadow = null;
    }
    const character = member.character;
    member.character = null;
    member.charging = null;
    if (character) {
      character.setVisible(false);
      character.destroy();
    }
    const squad = member.squad;
    if (squad) {
      const index = squad.members.indexOf(member);
      if (index >= 0) squad.members.splice(index, 1);
      if (!squad.members.length) handlePlayerSquadWipe(squad);
    }
  }

  // 小队全灭：清空该小队的出战状态并让它退役（销毁锚点、腾出出兵名额）。
  // 步兵小队阵亡后进入训练冷却：需要 PLAYER_SQUAD_BUILD_TIME 才能训练完成补充回队列，
  // 期间出兵按钮显示逆时针填充的训练进度（见 updateSpawnHud）
  function handlePlayerSquadWipe(squad) {
    if (!squad.unit || !squad.unit.isSpawned) return;
    const scene = squad.unit.scene;
    squad.unit.isSpawned = false;
    squad.unit.isSelected = false;
    squad.unit.isMoving = false;
    squad.unit.body.stop();
    squad.moveTarget = null;
    squad.detourPath = [];
    squad.replanKey = null;
    resetPlayerMoveProgress(squad);
    // 单位级训练：只把这一支阵亡的小队压入训练队列，不影响其他存活单位，
    // 也不让整个兵种按钮进入训练态
    trainingSquads.push({ readyAt: scene.time.now + PLAYER_SQUAD_BUILD_TIME });
    removePlayerSquad(squad);
  }

  // 小队整体外沿半径：以锚点为中心，取所有存活队员到锚点的最大距离，
  // 再加上队员自身的视觉半径，得到「整个单位」的外沿（出售圆环按它外扩 5 像素）
  function getPlayerSquadOuterRadius(squad) {
    let maxDistance = 0;
    getLivingPlayerMembers(squad).forEach(member => {
      const distance = Math.hypot(
        member.character.x - squad.unit.x,
        member.character.y - squad.unit.y
      );
      if (distance > maxDistance) maxDistance = distance;
    });
    return maxDistance + PLAYER_MEMBER_VISUAL_RADIUS;
  }

  // 出售一支我方小队：把招募点数返还到总点数，并让该小队立刻进入自爆流程。
  // 自爆走的是与「血条耗尽」完全相同的既有链路：每名队员立刻进入
  // 「索敌最近敌方 → 冲锋 → 自爆」流程（beginPlayerMemberDeath），
  // 因此动画、特效、伤害判定与震屏都与血条为 0 时一致。
  // 队员全部自爆落地后，小队由 finishPlayerMemberCharge 自动退役并进入单位训练队列
  function sellPlayerSquad(squad) {
    if (!squad || !squad.unit || !squad.unit.isSpawned) return false;
    playerPoints += SPAWN_BUTTON_RECRUIT_COST.jf;
    squad.sellPanelOpen = false;
    squad.unit.isSelected = false;
    squad.unit.isMoving = false;
    squad.unit.body.stop();
    squad.moveTarget = null;
    squad.detourPath = [];
    squad.replanKey = null;
    resetPlayerMoveProgress(squad);
    getLivingPlayerMembers(squad).forEach(member => {
      beginPlayerMemberDeath(member);
    });
    return true;
  }

  // 我方队员自然回血：距上次受击满 PLAYER_REGEN_DELAY 后每秒恢复最大生命值的 5%，
  // 回满即停止（血条随之隐藏）；期间再次受击会由 damagePlayerMember 重新计时。
  // 阵亡冲锋中的队员不参与回血
  function updatePlayerSquadRegen(time, delta) {
    const healPerSecond = PLAYER_MEMBER_MAX_HP * PLAYER_REGEN_PER_SECOND;
    getAllLivingPlayerMembers().forEach(member => {
      if (member.hp >= member.maxHp) return;
      if (time - member.lastDamagedAt < PLAYER_REGEN_DELAY) return;
      member.hp = Math.min(member.maxHp, member.hp + healPerSecond * delta / 1000);
    });
  }

  // 我方小队 HUD：逐人绿色细长条形血条。
  // 未被攻击（或已回满血）的队员不显示血条，一旦挨打就出现，回满后重新隐藏
  function updatePlayerSquadHud() {
    if (!playerSquadBars) return;
    const injured = getAllLivingPlayerMembers().filter(member => member.hp < member.maxHp);
    playerSquadBars.clear();
    playerSquadBars.setVisible(injured.length > 0);
    if (!injured.length) return;
    injured.forEach(member => {
      const bottomY = getUnitHealthBarBottom(member.character);
      drawHealthBar(
        playerSquadBars,
        member.character.x,
        bottomY,
        PLAYER_BAR_WIDTH,
        HEALTH_BAR_HEIGHT,
        member.hp / member.maxHp,
        PLAYER_BAR_COLOR
      );
    });
  }

  function spawnEnemyRouteUnit(scene, routeData) {
    // 兵力上限：地图内敌军数量达到上限就不再生成（阵亡后数量回落，各波次的定时器会自动补充）
    if (enemiesGroup.getChildren().length >= ENEMY_MAX_COUNT) return null;
    const routeVariants = routeData.variants || [routeData.points];
    const routeIndex = Phaser.Math.Between(0, routeVariants.length - 1);
    const route = routeVariants[routeIndex];
    const start = route[0];
    const enemy = enemiesGroup.create(start.x, start.y, 'enemyTexture');
    enemy.setVisible(false);
    enemy.route = route;
    enemy.routeData = routeData;
    // 本次采用的走廊变体编号：每次从行动点出发前会重新随机挑一条（见 rerollEnemyRoute）
    enemy.routeVariantIndex = routeIndex;
    enemy.waypointIndex = 1;
    // 出生点在地图外：先用 entering 状态沿入场线走进地图，再转入 following
    enemy.routeState = 'entering';
    enemy.holdUntil = 0;
    enemy.roamTarget = null;
    // 被自爆命中后的击退状态（null = 不在击退中）
    enemy.knockback = null;
    enemy.holdCycles = 0;
    enemy.routeFinished = false;
    // 路线终点（变体末节点）：抵达后转入「终点 375 像素范围自由待机」，不再钉死在这一点上
    const terminal = route[route.length - 1];
    enemy.terminalX = terminal.x;
    enemy.terminalY = terminal.y;
    enemy.idleUntil = 0;
    enemy.detourPath = [];
    enemy.replanTargetKey = null;
    enemy.replanAttemptedKey = null;
    enemy.replanRetryAt = 0;
    // 智能追踪与卡顿兜底所需的状态：待机判定标记、卡住计时
    enemy.decisionDone = false;
    // 追踪的目标锁定与交火姿态：进入追踪时锁定队员，交火姿态带 12 像素迟滞带防抖
    enemy.lockedTargetKey = null;
    enemy.engaging = false;
    // 待机巡逻的行动点：每次进入待机时刷新为当前位置，巡逻范围受 ENEMY_PATROL_RADIUS 限制
    enemy.actionPointX = start.x;
    enemy.actionPointY = start.y;
    enemy.stuckAt = 0;
    enemy.stuckX = start.x;
    enemy.stuckY = start.y;
    enemy.hp = ENEMY_MAX_HP;
    enemy.maxHp = ENEMY_MAX_HP;
    // 行军速度 300 像素/秒；智能追踪、巡逻、绕行全部复用这一个速度，保证行为一致
    enemy.speed = ENEMY_SPEED;
    enemy.nextAttackAt = 0;
    enemy.currentAnimation = null;
    enemy.facingLeft = true;
    enemy.dying = null;
    // 阵亡引爆状态：血条耗尽后原地泛红，满 3 秒原地自爆
    enemy.charging = null;
    // 碰撞隔离的帧内累计推挤量（先累计、后统一校验落点）
    enemy.separationPushX = 0;
    enemy.separationPushY = 0;
    enemy.character = scene.add.spine(start.x, start.y, 'Vespid', 'wait', true);
    // Vespid 资源默认朝右，出生时先镜像为朝左。
    enemy.character.setScale(-Math.abs(ENEMY_CHARACTER_SCALE), ENEMY_CHARACTER_SCALE);
    enemy.character.setDepth(2);
    enemy.hpBar = scene.add.graphics().setDepth(4);
    setEnemyFacing(enemy, route[1].x < start.x);
    setEnemyAnimation(enemy, 'move', true);
  }

  function beginEnemyHold(enemy, time, resetCycles = false) {
    enemy.body.stop();
    enemy.routeState = 'holding';
    enemy.holdUntil = time + ENEMY_HOLD_DURATION;
    enemy.roamTarget = null;
    // 当前行动点：本次待机的位置，接下来的巡逻只在这个点的 ENEMY_PATROL_RADIUS 范围内进行
    enemy.actionPointX = enemy.x;
    enemy.actionPointY = enemy.y;
    // 每次在行动点待机开始时重置一次判定标记，待机期间只判定一次
    enemy.decisionDone = false;
    if (resetCycles) enemy.holdCycles = 0;
    setEnemyAnimation(enemy, 'wait', true);
  }

  // 巡逻落点是否与其它敌方单位保持隔离距离：多支敌军在同一个行动点巡逻时，
  // 优先挑不与人重叠的落点，避免大家往同一个位置挤
  function isRoamSpotClearOfEnemies(self, spot) {
    const list = enemiesGroup.getChildren();
    for (let i = 0; i < list.length; i++) {
      const other = list[i];
      if (other === self || !other.active || other.charging) continue;
      if (Phaser.Math.Distance.Between(spot.x, spot.y, other.x, other.y) < ENEMY_SEPARATION_DISTANCE) {
        return false;
      }
    }
    return true;
  }

  // 路线点是否已被友军占住（友军踩在点上、且比本单位更靠近该点）。
  // 用于抵达判定：单位被隔离推挤顶在点时，永远进不了「6 像素」的抵达阈值，
  // 两队敌军在同一条走廊上迎面顶住就会永久互相抵消位移、原地抖动，队伍彻底堵死
  function isRoutePointClaimed(enemy, target) {
    const mine = Phaser.Math.Distance.Between(enemy.x, enemy.y, target.x, target.y);
    const list = enemiesGroup.getChildren();
    for (let i = 0; i < list.length; i++) {
      const other = list[i];
      if (other === enemy || !other.active || other.charging) continue;
      const their = Phaser.Math.Distance.Between(other.x, other.y, target.x, target.y);
      if (their < ENEMY_SEPARATION_DISTANCE * 0.5 && their < mine) return true;
    }
    return false;
  }

  // 候选落点到最近友军的距离：终点区域挑点时用它把人群摊开
  function getNearestEnemyGap(self, spot) {
    let nearest = Infinity;
    const list = enemiesGroup.getChildren();
    for (let i = 0; i < list.length; i++) {
      const other = list[i];
      if (other === self || !other.active || other.charging) continue;
      const gap = Phaser.Math.Distance.Between(spot.x, spot.y, other.x, other.y);
      if (gap < nearest) nearest = gap;
    }
    return nearest;
  }

  // 巡逻落点的通用实现：以指定锚点为圆心，在 [minRadius, maxRadius] 内随机取点。
  // 落点必须先站得住（可行走 + 与红区保持安全带），再要求整段路径不闯入红区，
  // 最后尽量挑不与其它单位重叠的位置；全都取不到时返回 null（原地待机），
  // 不会把单位推向边界或屏蔽区，也就不会出现撞墙后原地打转的反复移动。
  // spaced 为真时（终点待机）：区域已经挤满时不再随便塞一个点，而是取「离最近友军最远」
  // 的候选点，把人群往空处摊开，避免所有人叠在一处被隔离推挤推来推去
  function chooseEnemyRoamTargetAt(enemy, anchorX, anchorY, minRadius, maxRadius, spaced = false) {
    const origin = { x: enemy.x, y: enemy.y };
    let fallback = null;
    let spacedBest = null;
    let spacedBestGap = -1;
    for (let attempt = 0; attempt < 16; attempt++) {
      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const distance = Phaser.Math.FloatBetween(minRadius, maxRadius);
      const candidate = {
        x: anchorX + Math.cos(angle) * distance,
        y: anchorY + Math.sin(angle) * distance
      };
      if (!isPointSafelyWalkable(candidate.x, candidate.y, ENEMY_RED_ZONE_CLEARANCE)) {
        continue;
      }
      if (!isRedZoneClearanceSafePath(origin, candidate)) continue;
      if (isRoamSpotClearOfEnemies(enemy, candidate)) return candidate;
      if (spaced) {
        const gap = getNearestEnemyGap(enemy, candidate);
        if (gap > spacedBestGap) {
          spacedBestGap = gap;
          spacedBest = candidate;
        }
      }
      if (!fallback) fallback = candidate;
    }
    return spaced && spacedBest ? spacedBest : fallback;
  }

  // 待机巡逻目标：在当前行动点的 ENEMY_PATROL_RADIUS 像素范围内随机取点，
  // 同时要求整段巡逻路径不闯入红区安全带，取不到时原地待机
  function chooseEnemyRoamTarget(enemy) {
    const anchorX = enemy.actionPointX == null ? enemy.x : enemy.actionPointX;
    const anchorY = enemy.actionPointY == null ? enemy.y : enemy.actionPointY;
    return chooseEnemyRoamTargetAt(enemy, anchorX, anchorY, ENEMY_PATROL_MIN_RADIUS, ENEMY_PATROL_RADIUS);
  }

  // 终点自由待机的落点：以路线终点为圆心、ENEMY_ENDPOINT_ROAM_RADIUS 为半径随机取点。
  // 已经被推挤或追踪带到待机区域之外时先走回终点，队伍才会重新聚在终点区域里
  function chooseEnemyEndpointRoamTarget(enemy) {
    const fromTerminal = Phaser.Math.Distance.Between(enemy.x, enemy.y, enemy.terminalX, enemy.terminalY);
    if (fromTerminal > ENEMY_ENDPOINT_ROAM_RADIUS) {
      return { x: enemy.terminalX, y: enemy.terminalY };
    }
    return chooseEnemyRoamTargetAt(
      enemy,
      enemy.terminalX,
      enemy.terminalY,
      ENEMY_PATROL_MIN_RADIUS,
      ENEMY_ENDPOINT_ROAM_RADIUS,
      true
    );
  }

  // 终点待机的静止阶段：到位后随机静止一小段时间（只站桩、不做任何移动计算）再挑下一个落点。
  // 大批单位不会每帧都在移动或转向，终点区域的开销与画面抖动都明显下降
  function beginEnemyEndpointIdle(enemy, time) {
    enemy.body.stop();
    enemy.roamTarget = null;
    enemy.routeState = 'endpoint';
    enemy.idleUntil = time + Phaser.Math.Between(ENEMY_ENDPOINT_IDLE_MIN, ENEMY_ENDPOINT_IDLE_MAX);
    setEnemyAnimation(enemy, 'wait', true);
  }

  // 抵达路线终点：转入「终点 375 像素范围内自由待机」，起步先静止一小段，
  // 避免整批同时到达的单位在同一帧一起开动
  function beginEnemyEndpointRoam(enemy, time) {
    enemy.routeFinished = true;
    enemy.holdCycles = 0;
    enemy.detourPath = [];
    enemy.replanTargetKey = null;
    enemy.replanAttemptedKey = null;
    const last = enemy.route && enemy.route.length ? enemy.route[enemy.route.length - 1] : null;
    enemy.terminalX = last ? last.x : enemy.x;
    enemy.terminalY = last ? last.y : enemy.y;
    enemy.actionPointX = enemy.terminalX;
    enemy.actionPointY = enemy.terminalY;
    beginEnemyEndpointIdle(enemy, time);
  }

  function getSafeRouteTarget(enemy) {
    for (let i = enemy.waypointIndex; i < enemy.route.length; i++) {
      const target = enemy.route[i];
      if (isRouteNodeWalkable(target)) return { target, index: i };
    }
    return null;
  }

  // 终点单位被隔离推挤或追踪带到待机区域之外（例如被挤到地图边缘的死角）时，
  // 把它交回常规路线推进逻辑：路线指针回退到离它最近的可走节点，
  // 沿「沿路线推进 + 红区绕行 + 卡顿兜底」走回终点。
  // 直接朝终点直线插过去会被红区挡住，而从不可行走的死角出发时转向判定会一直返回空，
  // 单位就会在终点待机状态里永久空转（既不移动也不推进，白白消耗每帧的几何计算）
  function resumeEnemyRouteToTerminal(enemy) {
    const route = enemy.route || [];
    let nearestIndex = -1;
    let nearestDistance = Infinity;
    for (let i = route.length - 1; i >= 0; i--) {
      const node = route[i];
      if (!isRouteNodeWalkable(node)) continue;
      const distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, node.x, node.y);
      if (distance < nearestDistance) {
        nearestDistance = distance;
        nearestIndex = i;
      }
    }
    if (nearestIndex < 0) return false;
    enemy.waypointIndex = nearestIndex;
    enemy.routeState = 'following';
    // 还没真正走到终点，撤销「路线已完成」标记，回到正常的推进 / 行动点待机循环
    enemy.routeFinished = false;
    enemy.holdCycles = 0;
    enemy.roamTarget = null;
    enemy.detourPath = [];
    enemy.replanTargetKey = null;
    enemy.replanAttemptedKey = null;
    enemy.stuckAt = 0;
    return true;
  }

  // 终点单位是否已经被带到待机区域之外（留 4 倍隔离余量，避免边缘单位在回位与静止之间抖动）
  function isEnemyFarFromTerminal(enemy) {
    if (enemy.terminalX == null || enemy.terminalY == null) return false;
    return Phaser.Math.Distance.Between(enemy.x, enemy.y, enemy.terminalX, enemy.terminalY) >
      ENEMY_ENDPOINT_RETURN_DISTANCE;
  }

  // 从行动点出发前的随机判定：重新随机挑一条走廊变体（尽量与出发前不同），
  // 本次「前往下一个行动点」的落点连同后续节点一起换成新车道。
  // 各变体的节点数量与顺序严格一致，所以换路线不影响 waypointIndex 的含义。
  function rerollEnemyRoute(enemy) {
    const variants = enemy.routeData && enemy.routeData.variants;
    if (!variants || variants.length < 2) return;
    let index = enemy.routeVariantIndex == null ? 0 : enemy.routeVariantIndex;
    for (let attempt = 0; attempt < 8 && index === enemy.routeVariantIndex; attempt++) {
      index = Phaser.Math.Between(0, variants.length - 1);
    }
    enemy.routeVariantIndex = index;
    enemy.route = variants[index];
  }

  // 单次推挤落点校验：从「累计推挤方向」开始尝试，正推落点不可用就分别试两个单轴方向，
  // 让贴着墙或红区行走的单位也能沿切线滑开。落点必须既可行走、又满足红区安全带要求。
  // 位移积分不校验落点，单位可能已经贴出可行走边界（例如贴着地图边缘卡住），
  // 这种情况下放宽一档：只要求落点仍在地图内、不进入红区，保证隔离在任何情况下都能生效。
  // 每个单位每帧只调用一次（推挤量已在本帧全部重叠对中累计完毕）。
  function pushEnemyAway(enemy, offsetX, offsetY) {
    if (!enemy.body || !enemy.character) return false;
    const offMap = !pointInPolygon(enemy.x, enemy.y, collisionRegions.mapBoundary);
    const relaxed = offMap || !isEnemyPoseWalkable(enemy) || !isEnemyPoseClear(enemy);
    const attempts = [[offsetX, offsetY], [offsetX, 0], [0, offsetY]];
    for (let i = 0; i < attempts.length; i++) {
      const x = enemy.x + attempts[i][0];
      const y = enemy.y + attempts[i][1];
      if (x === enemy.x && y === enemy.y) continue;
      if (offMap) {
        // 入场阶段的单位在地图外：只要求落点仍在地图外，避免被推进地图边界的死角
        if (pointInPolygon(x, y, collisionRegions.mapBoundary)) continue;
      } else if (relaxed) {
        if (!pointInPolygon(x, y, collisionRegions.mapBoundary) || isZoneBlocked(x, y)) continue;
      } else if (!isPointSafelyWalkable(x, y, ENEMY_RED_ZONE_CLEARANCE)) {
        continue;
      }
      enemy.body.reset(x, y);
      enemy.character.setPosition(x, y);
      return true;
    }
    return false;
  }

  // 分离用的空间哈希：键为格子坐标，值为该格内单位在 movers 中的下标。帧内复用不新建。
  const enemySeparationGrid = new Map();

  // 敌方单位之间的碰撞隔离：两个单位贴近到 ENEMY_SEPARATION_DISTANCE 以内时，
  // 各沿连心线推开一半重叠量（乘一个阻尼比例，避免推挤来回弹跳）。
  // 敌方单位的位移是逐帧直接积分（body.reset）的，Arcade 物理的碰撞体分离会被下一帧的
  // 位移覆盖，所以隔离在单位全部完成本帧移动之后单独做一遍。
  // 性能：① 用 ENEMY_SEPARATION_CELL 边长的空间哈希取 3×3 邻域，代替两两全比
  // （100 单位从 4950 对降到每单位 3~9 对）；② 先把所有重叠对的推挤量累加到单位上，
  // 累加完再按单位统一做一次落点几何校验（原实现是每对的两个单位各校验一次）。
  // 推挤量本身仍是「沿连心线各推开一半重叠量、单对不超过 MAX_PUSH」，行为与改造前一致。
  function separateEnemies() {
    const list = enemiesGroup.getChildren();
    const movers = [];
    for (let i = 0; i < list.length; i++) {
      const enemy = list[i];
      if (!enemy.active || !enemy.body || enemy.charging) continue;
      enemy.separationPushX = 0;
      enemy.separationPushY = 0;
      movers.push(enemy);
    }
    if (!movers.length) return;

    enemySeparationGrid.clear();
    for (let i = 0; i < movers.length; i++) {
      const enemy = movers[i];
      const cellKey = Math.floor(enemy.x / ENEMY_SEPARATION_CELL) + ':' +
        Math.floor(enemy.y / ENEMY_SEPARATION_CELL);
      const bucket = enemySeparationGrid.get(cellKey);
      if (bucket) bucket.push(i);
      else enemySeparationGrid.set(cellKey, [i]);
    }

    for (let i = 0; i < movers.length; i++) {
      const first = movers[i];
      const cellX = Math.floor(first.x / ENEMY_SEPARATION_CELL);
      const cellY = Math.floor(first.y / ENEMY_SEPARATION_CELL);
      for (let gridX = cellX - 1; gridX <= cellX + 1; gridX++) {
        for (let gridY = cellY - 1; gridY <= cellY + 1; gridY++) {
          const bucket = enemySeparationGrid.get(gridX + ':' + gridY);
          if (!bucket) continue;
          for (let k = 0; k < bucket.length; k++) {
            const j = bucket[k];
            if (j <= i) continue;                 // 同一对只处理一次（邻域查询会双向命中）
            const second = movers[j];
            let dx = second.x - first.x;
            let dy = second.y - first.y;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared >= ENEMY_SEPARATION_DISTANCE * ENEMY_SEPARATION_DISTANCE) continue;
            let distance = Math.sqrt(distanceSquared);
            if (distance < 0.0001) {
              dx = 1;
              dy = 0;
              distance = 1;
            }
            const push = Math.min(
              (ENEMY_SEPARATION_DISTANCE - distance) * 0.5 * ENEMY_SEPARATION_STRENGTH,
              ENEMY_SEPARATION_MAX_PUSH
            );
            const normalX = dx / distance;
            const normalY = dy / distance;
            first.separationPushX -= normalX * push;
            first.separationPushY -= normalY * push;
            second.separationPushX += normalX * push;
            second.separationPushY += normalY * push;
          }
        }
      }
    }

    for (let i = 0; i < movers.length; i++) {
      const enemy = movers[i];
      let pushX = enemy.separationPushX;
      let pushY = enemy.separationPushY;
      enemy.separationPushX = 0;
      enemy.separationPushY = 0;
      if (pushX === 0 && pushY === 0) continue;
      // 密集堆叠时一个单位会与多个邻居重叠，累计位移需要按 MAX_PUSH 收口：
      // 否则多对推挤量之和会让单位瞬移（该常量原本的语义就是「每帧每个单位」的上限）
      const length = Math.sqrt(pushX * pushX + pushY * pushY);
      if (length > ENEMY_SEPARATION_MAX_PUSH) {
        pushX = pushX / length * ENEMY_SEPARATION_MAX_PUSH;
        pushY = pushY / length * ENEMY_SEPARATION_MAX_PUSH;
      }
      pushEnemyAway(enemy, pushX, pushY);
    }
    // 队员的独立碰撞体同样参与隔离：敌方单位与队员碰撞体重叠时，敌方这一半在这一步推开
    //（队员那一半已在 updatePlayerSquad 里生效）。冲锋自爆中的队员不参与，必须能贴到目标引爆
    separateEnemiesFromPlayerMembers(movers);
  }

  // 敌方单位这一侧的推挤量：与队员碰撞体（半径圆）重叠时，敌方让出自己那一半
  function separateEnemiesFromPlayerMembers(movers) {
    const members = [];
    playerSquads.forEach(squad => {
      squad.members.forEach(member => {
        if (member.body && member.alive) members.push({ body: member.body, squad });
      });
    });
    if (!members.length) return;
    const minDistance = PLAYER_MEMBER_ENEMY_SEPARATION;
    const minDistanceSquared = minDistance * minDistance;
    for (let i = 0; i < movers.length; i++) {
      const enemy = movers[i];
      let pushX = 0;
      let pushY = 0;
      for (let m = 0; m < members.length; m++) {
        const body = members[m].body;
        const dx = enemy.x - body.x;
        const dy = enemy.y - body.y;
        const distanceSquared = dx * dx + dy * dy;
        if (distanceSquared >= minDistanceSquared) continue;
        const distance = Math.sqrt(distanceSquared);
        let normalX;
        let normalY;
        if (distance < 0.0001) {
          normalX = -members[m].squad.forward.x;
          normalY = -members[m].squad.forward.y;
        } else {
          normalX = dx / distance;
          normalY = dy / distance;
        }
        const push = (minDistance - distance) * 0.5;
        pushX += normalX * push;
        pushY += normalY * push;
      }
      const length = Math.hypot(pushX, pushY);
      if (length <= 0.0001) continue;
      const scale = Math.min(length, PLAYER_MEMBER_SEPARATION_MAX_PUSH) / length;
      pushEnemyAway(enemy, pushX * scale, pushY * scale);
    }
  }

  function isWalkable(x, y) {
    const key = getPointQueryKey(x, y);
    const entry = pointQueryCache.get(key);
    if (entry !== undefined && (entry & POINT_QUERY_WALKABLE) !== 0) {
      return (entry & POINT_QUERY_WALKABLE_RESULT) !== 0;
    }
    const walkable = pointInPolygon(x, y, collisionRegions.mapBoundary) &&
      pointInPolygon(x, y, collisionRegions.walkableBoundary) &&
      !isZoneBlocked(x, y);
    pointQueryCache.set(key, (entry || 0) | POINT_QUERY_WALKABLE |
      (walkable ? POINT_QUERY_WALKABLE_RESULT : 0));
    return walkable;
  }

  // 「可行走 + 红区净空」的组合判定：两种结论共用同一条缓存记录，键与查表都只做一次。
  // 满编时这里是每帧数百次的调用（隔离放行、巡逻落点校验），比连着调用两个函数少一次键构造
  function isPointSafelyWalkable(x, y, clearance) {
    const bit = getClearanceQueryBit(clearance);
    if (bit !== 0) {
      const entry = pointQueryCache.get(getPointQueryKey(x, y));
      const knownMask = POINT_QUERY_WALKABLE | bit;
      if (entry !== undefined && (entry & knownMask) === knownMask) {
        const resultMask = POINT_QUERY_WALKABLE_RESULT | bit << POINT_QUERY_RESULT_SHIFT;
        return (entry & resultMask) === resultMask;
      }
    }
    return isWalkable(x, y) && isRedClearanceSafePoint(x, y, clearance);
  }

  // 路线节点的可行走结论：节点坐标在初始化后就固定不变，只有碰撞区域被编辑（版本号变化）
  // 时才需要重算。推进判定每帧都要顺着路线找第一个可走节点，这里能省掉绝大部分重复查询
  function isRouteNodeWalkable(node) {
    if (node.walkableVersion !== collisionRegionVersion) {
      node.walkableVersion = collisionRegionVersion;
      node.walkableValue = isWalkable(node.x, node.y);
    }
    return node.walkableValue;
  }

  // 单位自身站位的记忆化：坐标没变就复用上一次的结论（终点待机的人堆、被隔离推挤
  // 相互抵消位移的单位整帧不动），坐标一有变化立即重算，因此结论永远对应当前坐标
  function isEnemyPoseWalkable(enemy) {
    if (enemy.poseWalkableX !== enemy.x || enemy.poseWalkableY !== enemy.y) {
      enemy.poseWalkableX = enemy.x;
      enemy.poseWalkableY = enemy.y;
      enemy.poseWalkable = isWalkable(enemy.x, enemy.y);
    }
    return enemy.poseWalkable;
  }

  function isEnemyPoseClear(enemy) {
    if (enemy.poseClearX !== enemy.x || enemy.poseClearY !== enemy.y) {
      enemy.poseClearX = enemy.x;
      enemy.poseClearY = enemy.y;
      enemy.poseClear = isRedClearanceSafePoint(enemy.x, enemy.y, ENEMY_RED_ZONE_CLEARANCE);
    }
    return enemy.poseClear;
  }

  // ----------------------------------------------------
  // 屏幕文字统一尺寸：画面里所有会出现的文字（伤害数字、自爆提示、出兵与寻路提示）
  // 都走 showCombatText，这里把它们的显示大小统一按「屏幕像素」固定下来。
  // 相机可在 CAMERA_ZOOM_MIN~CAMERA_ZOOM_MAX（约 0.51~3 倍）之间缩放，画布还会被 FIT 模式按视口再缩放一次，
  // 直接用世界字号的话，同一句伤害数字在不同窗口大小、不同缩放级别、不同设备
  // 上会忽大忽小；做法是用 1 / (相机缩放 × 画布显示比例) 反向补偿显示缩放，
  // 使文字在任何情况下都恒定占 COMBAT_TEXT_FONT_SIZE 个屏幕像素，
  // 同时把纹理分辨率设为设备像素比，让纹理像素与屏幕物理像素一一对应，
  // 这样即便在 4K / 高 DPI 屏上被放大也不会发虚。
  // ----------------------------------------------------
  const COMBAT_TEXT_FONT_SIZE = 14;        // 屏幕上的固定字号（像素）
  const COMBAT_TEXT_RISE = 26;             // 屏幕上固定的上浮距离（像素）
  const COMBAT_TEXT_DURATION = 700;        // 停留时长 (ms)
  const COMBAT_TEXT_MAX_RESOLUTION = 4;    // 纹理分辨率上限，设备像素比很高时避免浪费显存
  const COMBAT_TEXT_FONT_FAMILY = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
  const combatTexts = [];                  // 存活中的浮动文字，每帧同步一次显示尺寸

  // 世界坐标到屏幕像素的总缩放：相机缩放 × 画布在页面上的显示比例
  function getCombatTextWorldScale(scene) {
    const camera = scene.cameras.main;
    const canvas = scene.game.canvas;
    // canvas 的 CSS 宽度对应的是游戏分辨率宽度（config.width = 1920，即视野宽度），
    // 不是世界宽度（世界等于地图原始像素 3795×3026），两者不能混用
    const canvasScale = canvas && canvas.clientWidth ? canvas.clientWidth / VIEW_WIDTH : 1;
    return Phaser.Math.Clamp((camera ? camera.zoom : 1) * canvasScale, 0.001, 1000);
  }

  // 每帧同步：滚轮缩放相机或改变窗口大小时，已在场上的文字屏幕尺寸保持恒定
  function updateCombatTextScale() {
    for (let i = combatTexts.length - 1; i >= 0; i--) {
      const label = combatTexts[i];
      if (!label.active) {
        combatTexts.splice(i, 1);
        continue;
      }
      const targetScale = 1 / getCombatTextWorldScale(label.scene);
      if (Math.abs(label.scaleX - targetScale) > 0.0001) {
        label.setScale(targetScale);
      }
    }
  }

  function showCombatText(scene, x, y, text, color) {
    const worldScale = getCombatTextWorldScale(scene);
    const label = scene.add.text(x, y, text, {
      fontFamily: COMBAT_TEXT_FONT_FAMILY,
      fontSize: COMBAT_TEXT_FONT_SIZE + 'px',
      color,
      fontStyle: 'bold',
      stroke: '#111111',
      strokeThickness: 3,
      resolution: Phaser.Math.Clamp(window.devicePixelRatio || 1, 1, COMBAT_TEXT_MAX_RESOLUTION)
    }).setOrigin(0.5).setDepth(8);
    label.setScale(1 / worldScale);
    combatTexts.push(label);
    scene.tweens.add({
      targets: label,
      y: y - COMBAT_TEXT_RISE / worldScale,
      alpha: 0,
      duration: COMBAT_TEXT_DURATION,
      onComplete: () => {
        const index = combatTexts.indexOf(label);
        if (index >= 0) combatTexts.splice(index, 1);
        label.destroy();
      }
    });
  }

  // ----------------------------------------------------
  // 出生点（GRF 信标）与环形选择菜单
  // 地图上的 GRF 信标就是我方出生点：左键点击后展开一圈淡蓝色虚线圆环，圆环上按
  // 倒三角摆放三张圆形图片（GRF1 在左、mid 在右、tasa_air 在下方），每张圆形图片
  // 外面包裹一圈淡蓝色线条；再次点击 GRF1 图标，单位在出生点出生并播放出生动画，
  // 动画播完后自动前出到第一个目标点。未出兵前右键移动、索敌与被攻击判定全部关闭。
  // ----------------------------------------------------

  // 把一张图片处理成圆形纹理：先按有效像素求包围盒（黑底素材先按亮度抠掉纯黑背景），
  // 再等比缩放放入圆形裁剪区，保证圆形图片完整不变形
  function createCircularTexture(scene, sourceKey, targetKey, size, options) {
    const config = options || {};
    const source = scene.textures.get(sourceKey).getSourceImage();
    const sourceCanvas = document.createElement('canvas');
    sourceCanvas.width = source.width;
    sourceCanvas.height = source.height;
    const sourceCtx = sourceCanvas.getContext('2d');
    sourceCtx.drawImage(source, 0, 0);
    const pixels = sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height);
    const data = pixels.data;
    const keyThreshold = config.keyBlack ? (config.keyBlackThreshold || 24) : -1;
    let minX = sourceCanvas.width;
    let minY = sourceCanvas.height;
    let maxX = -1;
    let maxY = -1;
    for (let y = 0; y < sourceCanvas.height; y++) {
      for (let x = 0; x < sourceCanvas.width; x++) {
        const index = (y * sourceCanvas.width + x) * 4;
        if (keyThreshold >= 0) {
          const luma = data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;
          if (luma <= keyThreshold) data[index + 3] = 0;
        }
        if (data[index + 3] > 8) {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) {
      minX = 0;
      minY = 0;
      maxX = sourceCanvas.width - 1;
      maxY = sourceCanvas.height - 1;
    }
    if (keyThreshold >= 0) sourceCtx.putImageData(pixels, 0, 0);
