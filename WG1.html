    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    const boxWidth = maxX - minX + 1;
    const boxHeight = maxY - minY + 1;
    const fit = size * (config.fit || 0.9);
    const scale = Math.min(fit / boxWidth, fit / boxHeight);
    const drawWidth = boxWidth * scale;
    const drawHeight = boxHeight * scale;
    ctx.drawImage(
      sourceCanvas,
      minX, minY, boxWidth, boxHeight,
      (size - drawWidth) / 2, (size - drawHeight) / 2, drawWidth, drawHeight
    );
    ctx.restore();
    if (scene.textures.exists(targetKey)) scene.textures.remove(targetKey);
    scene.textures.addCanvas(targetKey, canvas);
  }

  // 淡蓝色径向渐变光晕，用作出生点的呼吸底光与出生动画的能量
  function createSpawnGlowTexture(scene, key, size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, 'rgba(159, 227, 255, 0.95)');
    gradient.addColorStop(0.45, 'rgba(120, 205, 255, 0.42)');
    gradient.addColorStop(1, 'rgba(90, 180, 255, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    if (scene.textures.exists(key)) scene.textures.remove(key);
    scene.textures.addCanvas(key, canvas);
  }

  // 脚下阴影纹理：由中心向外淡出的柔和深色椭圆，与我方/敌方单位脚下的阴影观感一致
  function createUnitShadowTexture(scene, key, size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const radius = size / 2;
    const gradient = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
    gradient.addColorStop(0, 'rgba(6, 10, 16, 0.92)');
    gradient.addColorStop(0.5, 'rgba(6, 10, 16, 0.55)');
    gradient.addColorStop(1, 'rgba(6, 10, 16, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(radius, radius, radius, 0, Math.PI * 2);
    ctx.fill();
    if (scene.textures.exists(key)) scene.textures.remove(key);
    scene.textures.addCanvas(key, canvas);
  }

  // 自爆特效纹理：白心 -> 橙红 -> 透明的径向渐变
  function createExplosionTexture(scene, key, size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const radius = size / 2;
    const gradient = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
    gradient.addColorStop(0, 'rgba(255, 250, 220, 0.98)');
    gradient.addColorStop(0.35, 'rgba(255, 186, 90, 0.82)');
    gradient.addColorStop(0.7, 'rgba(255, 96, 48, 0.42)');
    gradient.addColorStop(1, 'rgba(255, 60, 30, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(radius, radius, radius, 0, Math.PI * 2);
    ctx.fill();
    if (scene.textures.exists(key)) scene.textures.remove(key);
    scene.textures.addCanvas(key, canvas);
  }

  // 在角色脚下放一个椭圆阴影（尺寸按角色显示宽度等比换算，与敌方单位脚下阴影同款）
  function createUnitShadow(scene, character) {
    const displayWidth = character && character.displayWidth
      ? Math.abs(character.displayWidth)
      : PLAYER_CHARACTER_SCALE * 90;
    const width = Math.max(8, displayWidth * SHADOW_WIDTH_RATIO);
    const shadow = scene.add.image(character.x, character.y, SHADOW_TEXTURE_KEY);
    shadow.setDepth(SHADOW_DEPTH);
    shadow.setDisplaySize(width, Math.max(2, width * SHADOW_FLATTEN));
    shadow.setAlpha(0);
    return shadow;
  }

  // Spine 骨架的 getBounds 返回「骨架局部坐标」（+y 向上，且已乘上骨架自身缩放），
  // 换算成屏幕像素还要再乘 |character.scaleY| / |skeleton.scaleY|。
  // 由此得到角色当前姿态的真实头顶/脚底，血条才能稳定贴头顶上方 8 像素且不会遮挡人物。
  // 骨架包围盒探针：复用同一对对象，省掉每次取包围盒都要新建的两个对象与两个 setter 闭包
  const skeletonBoundsOffset = { x: 0, y: 0, set(x, y) { this.x = x; this.y = y; } };
  const skeletonBoundsSize = { w: 0, h: 0, set(w, h) { this.w = w; this.h = h; } };

  function getCharacterVerticalMetrics(character) {
    if (!character || !character.skeleton) return null;
    const skeleton = character.skeleton;
    const offset = skeletonBoundsOffset;
    const size = skeletonBoundsSize;
    offset.set(0, 0);
    size.set(0, 0);
    try {
      skeleton.getBounds(offset, size);
    } catch (error) {
      return null;
    }
    if (!(size.h > 0)) return null;
    const skeletonScaleY = Math.abs(skeleton.scaleY) || Math.abs(character.scaleY) || 1;
    const unitToPixel = Math.abs(character.scaleY) / skeletonScaleY;
    return {
      top: character.y - (offset.y + size.h - skeleton.y) * unitToPixel,
      bottom: character.y - (offset.y - skeleton.y) * unitToPixel,
      halfWidth: Math.abs(size.w * unitToPixel) / 2
    };
  }

  // 细长条形血条：深色底 + 按血量比例填充的彩色前景（自左向右生长），
  // bottomY 为血条底边，整条血条都位于该位置之上
  function drawHealthBar(graphics, centerX, bottomY, width, height, ratio, color) {
    if (!graphics) return;
    const progress = Phaser.Math.Clamp(ratio, 0, 1);
    const topY = bottomY - height;
    const leftX = centerX - width / 2;
    const radius = Math.min(HEALTH_BAR_RADIUS, height / 2);
    graphics.fillStyle(HEALTH_BAR_BG, 0.85);
    graphics.fillRoundedRect(leftX - 1, topY - 1, width + 2, height + 2, radius + 1);
    if (progress <= 0) return;
    const fillWidth = Math.max(1, width * progress);
    graphics.fillStyle(color, 1);
    graphics.fillRoundedRect(leftX, topY, fillWidth, height, radius);
  }

  // 血条锚点：默认贴在角色当前姿态头顶上方 HEALTH_BAR_GAP 处；
  // 骨架信息取不到时退化为按显示高度估算，保证血条始终在人物上方不遮挡
  function getUnitHealthBarBottom(character) {
    if (!character) return null;
    const metrics = getCharacterVerticalMetrics(character);
    if (metrics) return metrics.top - HEALTH_BAR_GAP;
    const fallbackHeight = character.displayHeight ? Math.abs(character.displayHeight) : 50;
    return character.y - fallbackHeight - HEALTH_BAR_GAP;
  }

  // 死亡染色：Spine 插件没有提供 tint 接口，这里直接按「槽位基础色 -> 正红」插值，
  // 保留原来的明暗关系，观感是整个人物慢慢泛红而不是糊成一块红布
  function applyDeathTint(character, strength) {
    if (!character || !character.skeleton) return;
    const slots = character.skeleton.slots;
    if (!character.__deathBaseColors) {
      character.__deathBaseColors = slots.map(slot => (
        slot && slot.color ? [slot.color.r, slot.color.g, slot.color.b] : null
      ));
    }
    const amount = Phaser.Math.Clamp(strength, 0, 1);
    slots.forEach((slot, index) => {
      const base = character.__deathBaseColors[index];
      if (!base || !slot || !slot.color) return;
      slot.color.r = base[0] + (1 - base[0]) * amount;
      slot.color.g = base[1] * (1 - amount);
      slot.color.b = base[2] * (1 - amount);
    });
  }

  // 自爆表现：橙红光团从第一帧就铺满整个爆炸区域（贴图尺寸 = 爆炸圆直径），
  // 再向外轻轻扩张并淡出；同时叠一圈从爆心扩散到爆炸半径的冲击波圆环，
  // 让「爆炸动画覆盖整个爆炸区域」在视觉上一目了然
  function spawnExplosion(scene, x, y, radius) {
    if (!scene || !scene.sys || !scene.sys.isActive()) return;
    const diameter = Math.max(8, radius * 2);
    const flash = scene.add.image(x, y, EXPLOSION_TEXTURE_KEY)
      .setDepth(6)
      .setDisplaySize(diameter, diameter)
      .setAlpha(0.95);
    scene.tweens.add({
      targets: flash,
      displayWidth: diameter * 1.3,
      displayHeight: diameter * 1.3,
      alpha: 0,
      duration: 420,
      ease: 'Cubic.easeOut',
      onComplete: () => flash.destroy()
    });

    const ringRadius = Math.max(4, radius);
    const ring = scene.add.graphics({ x, y }).setDepth(6.1);
    const wave = { r: diameter * 0.35 };
    scene.tweens.add({
      targets: wave,
      r: ringRadius,
      duration: 380,
      ease: 'Cubic.easeOut',
      onUpdate: () => {
        ring.clear();
        ring.lineStyle(3, 0xff5533, Phaser.Math.Clamp(0.85 * (1 - wave.r / ringRadius), 0.12, 0.85));
        ring.strokeCircle(0, 0, wave.r);
      },
      onComplete: () => ring.destroy()
    });
  }

  // 出生点信标：圆形底盘 + GRF 徽标 + 淡蓝色外圈（纯地图标记，出兵改由左上角按钮触发）
  function createSpawnPoint(scene) {
    createCircularTexture(scene, 'grfLogo', 'spawnBadgeTexture', SPAWN_BADGE_RADIUS * 2, {
      keyBlack: true,
      keyBlackThreshold: 24,
      fit: 0.92
    });
    createSpawnGlowTexture(scene, 'spawnGlowTexture', SPAWN_GLOW_TEXTURE_SIZE);

    spawnGlow = scene.add.image(SPAWN_POINT_X, SPAWN_POINT_Y, 'spawnGlowTexture')
      .setDepth(-2.5)
      .setScale(SPAWN_GLOW_BASE_SCALE)
      .setAlpha(0.26);

    spawnBadgePad = scene.add.graphics().setDepth(-2.2);
    spawnBadgePad.fillStyle(SPAWN_PAD_COLOR, 0.66);
    spawnBadgePad.fillCircle(SPAWN_POINT_X, SPAWN_POINT_Y, SPAWN_BADGE_RADIUS);
    spawnBadgePad.lineStyle(2.5, SPAWN_RING_COLOR, 0.95);
    spawnBadgePad.strokeCircle(SPAWN_POINT_X, SPAWN_POINT_Y, SPAWN_BADGE_RADIUS);

    spawnBadge = scene.add.image(SPAWN_POINT_X, SPAWN_POINT_Y, 'spawnBadgeTexture').setDepth(-2);

    spawnFlashGraphics = scene.add.graphics().setDepth(3).setVisible(false);
  }

  // 黑灰渐变的 50×70 按钮：渐变底 + 描边 + 圆形图标 + 角标文字。
  // 返回的对象带 setEnabled / setLabel 之类的轻量接口，供每帧刷新用。
  function createSpawnButton(scene, options) {
    const width = SPAWN_BUTTON_WIDTH;
    const height = SPAWN_BUTTON_HEIGHT;
    const container = scene.add.container(0, 0);
    const background = scene.add.graphics();
    // 背景绘制：normal（常规）/ hover（悬停）。训练期间底色保持不透明，
    // 只在底色之上叠加逆时针的进度填充，不影响底色显示
    const drawBackground = mode => {
      background.clear();
      const hover = mode === 'hover';
      const topColor = hover ? 0x4a5058 : SPAWN_BUTTON_TOP_COLOR;
      const bottomColor = hover ? 0x14161a : SPAWN_BUTTON_BOTTOM_COLOR;
      background.fillGradientStyle(topColor, topColor, bottomColor, bottomColor, 1, 1, 1, 1);
      background.fillRect(-width / 2, -height / 2, width, height);
      background.lineStyle(2, SPAWN_BUTTON_BORDER_COLOR, hover ? 1 : (options.borderAlpha === undefined ? 0.9 : options.borderAlpha));
      background.strokeRect(-width / 2, -height / 2, width, height);
      background.lineStyle(1, 0xffffff, hover ? 0.18 : 0.12);
      background.strokeRect(-width / 2 + 3, -height / 2 + 3, width - 6, height - 6);
    };
    drawBackground('normal');
    container.add(background);

    // 训练进度：从按钮顶部起逆时针扫过的扇形填充，叠加在底色之上
    const progressGraphics = scene.add.graphics();
    progressGraphics.setAlpha(0);      // 平时不可见，进入训练态时缓动淡入
    container.add(progressGraphics);

    const icon = scene.add.image(0, 0, options.texture);
    const iconSize = Math.min(width, height) * 0.66;
    const scale = iconSize / Math.max(icon.width, icon.height);
    icon.setScale(scale);
    container.add(icon);

    const makeLabel = (x, y, size) => {
      const label = scene.add.text(x, y, '', {
        fontFamily: '"Segoe UI", "Microsoft YaHei", sans-serif',
        fontSize: size + 'px',
        color: SPAWN_POINT_TEXT_COLOR,
        stroke: SPAWN_POINT_TEXT_STROKE,
        strokeThickness: 3,
        resolution: 2                      // 文字按 2 倍分辨率渲染，缩放后依然清晰
      }).setOrigin(1, y < 0 ? 0 : 1);
      container.add(label);
      return label;
    };
    const labelPad = 5;
    const topLabel = options.topLabel ? makeLabel(width / 2 - labelPad, -height / 2 + labelPad, 16) : null;
    const bottomLabel = options.bottomLabel ? makeLabel(width / 2 - labelPad, height / 2 - labelPad, 13) : null;

    const baseAlpha = options.alpha === undefined ? SPAWN_BUTTON_ALPHA : options.alpha;
    container.setAlpha(baseAlpha);
    container.setVisible(options.visible !== false);
    scene.add.existing(container);

    // 按下反馈：缩放写在独立的代理对象上，避免与「滑入 / 滑出」动画（改 x / y / alpha）互相打断
    const pressProxy = { scale: 1 };
    const tweenPress = target => {
      scene.tweens.killTweensOf(pressProxy);
      scene.tweens.add({
        targets: pressProxy,
        scale: target,
        duration: SPAWN_BUTTON_PRESS_DURATION,
        ease: 'Quad.easeOut',
        onUpdate: () => container.setScale(pressProxy.scale)
      });
    };

    const hitArea = scene.add.zone(0, 0, width, height).setOrigin(0.5);
    hitArea.setInteractive({ useHandCursor: true });
    container.add(hitArea);
    hitArea.on('pointerover', () => {
      if (!hitArea.input || !hitArea.input.enabled) return;
      drawBackground('hover');
      icon.setScale(scale * 1.08);
    });
    hitArea.on('pointerout', () => {
      tweenPress(1);
      drawBackground('normal');
      icon.setScale(scale);
    });
    hitArea.on('pointerdown', pointer => {
      if (pointer.button !== 0) return;
      // 按钮未完全显示（展开 / 收起动画进行中）时一律不响应点击，
      // 避免动画没播完、按钮还没展开到位就出兵
      if (!hitArea.input || !hitArea.input.enabled) return;
      tweenPress(SPAWN_BUTTON_PRESS_SCALE);
      options.onClick();
    });
    hitArea.on('pointerup', () => tweenPress(1));
    // 初始可交互状态跟随可见性：不可见的按钮（尚未展开）不能点
    hitArea.input.enabled = options.visible !== false;

    // 训练状态：底色保持不透明，只在底色之上叠加逆时针扫过的进度填充。
    // 进入 / 退出训练态时用 0.5 秒缓动淡入淡出，过渡自然
    let trainingActive = false;
    const setTraining = active => {
      const next = active === true;
      if (next === trainingActive) return;
      trainingActive = next;
      scene.tweens.killTweensOf(progressGraphics);
      scene.tweens.add({
        targets: progressGraphics,
        alpha: next ? 1 : 0,
        duration: 500,
        ease: 'Cubic.easeOut'
      });
    };
    // 进度填充：从按钮顶部起逆时针扫过的扇形。弧上的采样点逐个裁剪进按钮矩形，
    // 保证填充严格限制在按钮内部（不会溢出到四角之外），也不遮挡按钮底色
    const setProgress = value => {
      progressGraphics.clear();
      const progress = Phaser.Math.Clamp(value || 0, 0, 1);
      if (progress <= 0) return;
      const radius = Math.hypot(width, height) / 2;   // 足够覆盖整个按钮
      const start = -Math.PI / 2;                     // 从正上方开始
      const sweep = -Math.PI * 2 * progress;          // 逆时针扫过
      const steps = 48;
      const points = [{ x: 0, y: 0 }];
      for (let i = 0; i <= steps; i++) {
        const angle = start + sweep * (i / steps);
        points.push({
          x: Phaser.Math.Clamp(Math.cos(angle) * radius, -width / 2, width / 2),
          y: Phaser.Math.Clamp(Math.sin(angle) * radius, -height / 2, height / 2)
        });
      }
      progressGraphics.fillStyle(0xffcc33, 0.32);
      progressGraphics.fillPoints(points, true);
    };

    return {
      key: options.key,
      container,
      hitArea,
      topLabel,
      bottomLabel,
      baseAlpha,
      setTraining,
      setProgress,
      setText: (top, bottom) => {
        if (topLabel && top !== undefined) topLabel.setText(top);
        if (bottomLabel && bottom !== undefined) bottomLabel.setText(bottom);
      }
    };
  }

  // 左上角出生界面：GRF 主按钮（显示可用点数与每分钟点数）。
  // 点击 GRF 展开第一层：左侧竖排 GRF1（步兵）/ tasa_air（重甲）/ mid（支援）；
  // 再点击 GRF1 展开第二层：右侧竖排 elmo1 / elmo2 / JF / GK（elmo1 与 GRF 平行）。
  // 展开 / 收起时下级按钮都以父按钮（GRF 或 GRF1）为动画主体：从父按钮位置滑出、淡入，
  // 收起时原路滑回父按钮再淡出，同层按钮按行号错开出场。
  function createSpawnHud(scene) {
    createCircularTexture(scene, 'grfLogo', 'grfHudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfIcon', 'grf1HudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfTasaAir', 'tasaHudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfMid', 'midHudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfElmo1', 'elmo1HudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfElmo2', 'elmo2HudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfGK', 'gkHudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });
    createCircularTexture(scene, 'grfJF', 'jfHudIcon', SPAWN_BUTTON_ICON_TEXTURE_SIZE, { keyBlack: true, keyBlackThreshold: 24, fit: 0.94 });

    const root = scene.add.container(0, 0).setDepth(SPAWN_HUD_DEPTH);
    const step = SPAWN_BUTTON_HEIGHT + SPAWN_BUTTON_GAP;
    const columnX = SPAWN_BUTTON_WIDTH / 2;
    const rightColumnX = SPAWN_BUTTON_WIDTH + SPAWN_BUTTON_GAP + SPAWN_BUTTON_WIDTH / 2;
    const firstY = SPAWN_BUTTON_HEIGHT / 2;

    const grfButton = createSpawnButton(scene, {
      key: 'grf',
      texture: 'grfHudIcon',
      topLabel: true,
      bottomLabel: true,
      onClick: () => {
        spawnHudExpanded = !spawnHudExpanded;
        if (!spawnHudExpanded) spawnHudCategory = null;   // 收起时同时退回第一层
        updateSpawnHudVisibility();
      }
    });
    grfButton.row = 0;
    grfButton.container.setPosition(columnX, firstY);
    root.add(grfButton.container);

    spawnHudButtons = [grfButton];

    // GRF 下方竖排（第一层）：GRF1（步兵）→ tasa_air（重甲）→ mid（支援）
    const leftColumn = [
      { key: 'grf1', texture: 'grf1HudIcon', row: 1, alpha: 1 },
      { key: 'tasa_air', texture: 'tasaHudIcon', row: 2, alpha: SPAWN_BUTTON_DIM_ALPHA },
      { key: 'mid', texture: 'midHudIcon', row: 3, alpha: SPAWN_BUTTON_DIM_ALPHA }
    ];
    // 右侧竖排（第二层，点开 GRF1 才出现）：elmo1 与 GRF 同行，往下依次是 elmo2、JF、GK，
    // 未实现的兵种全部半透明
    const rightColumn = [
      { key: 'elmo1', texture: 'elmo1HudIcon', row: 0, alpha: SPAWN_BUTTON_DIM_ALPHA },
      { key: 'elmo2', texture: 'elmo2HudIcon', row: 1, alpha: SPAWN_BUTTON_DIM_ALPHA },
      { key: 'GK', texture: 'gkHudIcon', row: 3, alpha: SPAWN_BUTTON_DIM_ALPHA }
    ];
    const buildEntry = layout => createSpawnButton(scene, {
      key: layout.key,
      texture: layout.texture,
      alpha: layout.alpha,
      topLabel: SPAWN_BUTTON_RECRUIT_COST[layout.key] !== null,
      bottomLabel: layout.key === 'grf1',
      onClick: () => handleSpawnOption(layout.key)
    });
    leftColumn.forEach(layout => {
      const button = buildEntry(layout);
      button.row = layout.row;
      button.container.setPosition(columnX, firstY + step * layout.row);
      root.add(button.container);
      spawnHudButtons.push(button);
    });
    rightColumn.forEach(layout => {
      const button = buildEntry(layout);
      button.row = layout.row;
      button.container.setPosition(rightColumnX, firstY + step * layout.row);
      root.add(button.container);
      spawnHudButtons.push(button);
    });

    // JF 按钮：第二层的出兵按钮，展开 GRF 后再点 GRF1 才出现；
    // 右上角显示数据库里的招募消耗（cost），右下角显示已出场小队数 / 上限
    const jfButton = createSpawnButton(scene, {
      key: 'jf',
      texture: 'jfHudIcon',
      visible: false,
      topLabel: true,
      bottomLabel: true,
      onClick: () => handleSpawnOption('jf')
    });
    jfButton.row = 2;
    jfButton.container.setPosition(rightColumnX, firstY + step * 2);
    root.add(jfButton.container);
    spawnHudButtons.push(jfButton);

    // 滑动动画的起止点：home 是静止位置，origin 是父按钮的位置（动画主体）；
    // 出场按行号自上而下错开，收起时反过来（自下而上）错开
    const slideParent = {
      grf1: 'grf', tasa_air: 'grf', mid: 'grf',
      elmo1: 'grf1', elmo2: 'grf1', jf: 'grf1', GK: 'grf1'
    };
    spawnHudButtons.forEach(button => {
      const parentKey = slideParent[button.key];
      const parent = parentKey ? spawnHudButtons.find(entry => entry.key === parentKey) : null;
      button.row = button.row || 0;
      button.homeX = button.container.x;
      button.homeY = button.container.y;
      button.originX = parent ? parent.container.x : button.homeX;
      button.originY = parent ? parent.container.y : button.homeY;
      button.slideDelay = button.row * SPAWN_BUTTON_SLIDE_STAGGER;
      button.slideDelayBack = (3 - button.row) * SPAWN_BUTTON_SLIDE_STAGGER;
      button.slideTween = null;
    });

    spawnHudRoot = root;
    updateSpawnHudVisibility(false);    // 首帧直接落到终态，不播动画
  }

  // 展开状态：GRF 主按钮常驻；第一层 GRF1 / tasa_air / mid 在展开 GRF 时出现，
  // 右侧的 elmo1 / elmo2 / JF / GK 还要再在第一层里选中 GRF1（步兵）才出现。
  // animate === false 时直接落到终态（首帧与状态恢复用），不播动画
  function updateSpawnHudVisibility(animate) {
    const withAnimation = animate !== false;
    const subLevel = spawnHudExpanded && spawnHudCategory === 'grf1';
    setSpawnButtonVisible('grf1', spawnHudExpanded, withAnimation);
    setSpawnButtonVisible('tasa_air', spawnHudExpanded, withAnimation);
    setSpawnButtonVisible('mid', spawnHudExpanded, withAnimation);
    setSpawnButtonVisible('elmo1', subLevel, withAnimation);
    setSpawnButtonVisible('elmo2', subLevel, withAnimation);
    setSpawnButtonVisible('GK', subLevel, withAnimation);
    setSpawnButtonVisible('jf', subLevel, withAnimation);
  }

  // 显示 / 隐藏下级按钮：显示时从父按钮（GRF 或 GRF1）的位置滑到自己的位置并淡入，
  // 隐藏时原路滑回父按钮、淡出后再收起；状态没变化时直接返回，重复点击不会重播动画
  function setSpawnButtonVisible(key, visible, animate = true) {
    const button = spawnHudButtons.find(entry => entry.key === key);
    if (!button || button.slideVisible === visible) return;
    button.slideVisible = visible;
    const container = button.container;
    if (button.slideTween) {
      button.slideTween.stop();
      button.slideTween = null;
    }
    if (!animate || !gameScene) {
      container.setPosition(button.homeX, button.homeY);
      container.setAlpha(button.baseAlpha);
      container.setScale(1);
      container.setVisible(visible);
      setSpawnButtonInteractive(button, visible);
      return;
    }
    if (visible) {
      // 展开动画期间先禁用点击：按钮要完全滑出、淡入到位后才允许出兵
      setSpawnButtonInteractive(button, false);
      container.setVisible(true);
      container.setPosition(button.originX, button.originY);
      container.setAlpha(0);
      button.slideTween = gameScene.tweens.add({
        targets: container,
        x: button.homeX,
        y: button.homeY,
        alpha: button.baseAlpha,
        duration: SPAWN_BUTTON_SLIDE_DURATION,
        delay: button.slideDelay,
        ease: 'Cubic.easeOut',
        onComplete: () => {
          button.slideTween = null;
          setSpawnButtonInteractive(button, true);
        }
      });
      return;
    }
    setSpawnButtonInteractive(button, false);
    button.slideTween = gameScene.tweens.add({
      targets: container,
      x: button.originX,
      y: button.originY,
      alpha: 0,
      duration: SPAWN_BUTTON_SLIDE_DURATION,
      delay: button.slideDelayBack,
      ease: 'Cubic.easeIn',
      onComplete: () => {
        button.slideTween = null;
        container.setVisible(false);
        container.setAlpha(button.baseAlpha);
        container.setPosition(button.homeX, button.homeY);
      }
    });
  }

  // 按钮可点击性：只有完全显示（展开动画结束、按钮已就位）的按钮才能响应点击。
  // 收起动画期间与尚未展开的按钮一律禁用，避免动画没播完就出兵
  function setSpawnButtonInteractive(button, enabled) {
    if (button && button.hitArea && button.hitArea.input) {
      button.hitArea.input.enabled = enabled;
    }
  }

  // 出生界面每帧刷新：位置与缩放按相机反向补偿，保证按钮始终是固定屏幕像素尺寸
  function updateSpawnHud(time, delta) {
    if (!spawnHudRoot) return;
    const camera = gameScene.cameras.main;
    const worldScale = getCombatTextWorldScale(gameScene);
    if (worldScale > 0) spawnHudRoot.setScale(1 / worldScale);
    // 可视区左上角用 scrollX / scrollY 反推（camera.worldView 要到渲染阶段才更新，
    // 拖视角时会滞后一帧，按钮就会跟着画面轻微晃动）
    const margin = worldScale > 0 ? SPAWN_HUD_MARGIN / worldScale : 0;
    const viewLeft = camera.scrollX + (camera.width - camera.width / camera.zoom) / 2;
    const viewTop = camera.scrollY + (camera.height - camera.height / camera.zoom) / 2;
    spawnHudRoot.setPosition(viewLeft + margin, viewTop + margin);
    const income = playerIncomePerMinute();
    playerPoints = Math.min(
      PLAYER_START_POINTS + income * 60,
      playerPoints + (income * delta) / 60000
    );
    const grfButton = spawnHudButtons.find(entry => entry.key === 'grf');
    if (grfButton) grfButton.setText(String(Math.floor(playerPoints)), '+' + income + '/分');
    const grf1Button = spawnHudButtons.find(entry => entry.key === 'grf1');
    if (grf1Button) {
      grf1Button.setText(
        '-' + SPAWN_BUTTON_RECRUIT_COST.jf,
        (spawnedSquadCount() + trainingSquads.length) + '/' + PLAYER_SQUAD_LIMIT
      );
    }
    // 训练队列推进：到期的单位自动训练完成，把名额还回队列
    while (trainingSquads.length && trainingSquads[0].readyAt <= time) trainingSquads.shift();
    const jfButton = spawnHudButtons.find(entry => entry.key === 'jf');
    if (jfButton) {
      // 按钮本身不进入训练态：只在有单位正在训练时，用最快完成的那一支的进度
      // 做逆时针填充提示；能否出兵由名额（存活 + 训练中）与点数决定
      const nextReady = trainingSquads.length ? trainingSquads[0].readyAt : 0;
      const training = nextReady > time;
      jfButton.setTraining(training);
      jfButton.setProgress(training ? 1 - (nextReady - time) / PLAYER_SQUAD_BUILD_TIME : 0);
      jfButton.setText(
        '-' + SPAWN_BUTTON_RECRUIT_COST.jf,
        (spawnedSquadCount() + trainingSquads.length) + '/' + PLAYER_SQUAD_LIMIT
      );
    }
    const tasaButton = spawnHudButtons.find(entry => entry.key === 'tasa_air');
    if (tasaButton && SPAWN_BUTTON_RECRUIT_COST.tasa_air !== null) {
      tasaButton.setText('-' + SPAWN_BUTTON_RECRUIT_COST.tasa_air, undefined);
    }
    const midButton = spawnHudButtons.find(entry => entry.key === 'mid');
    if (midButton && SPAWN_BUTTON_RECRUIT_COST.mid !== null) {
      midButton.setText('-' + SPAWN_BUTTON_RECRUIT_COST.mid, undefined);
    }
  }

  // 场上已有（含出生动画中的）小队数量，用于 6 支上限与进度显示。
  // 已全灭退役的小队会从注册表移除，不占名额
  function spawnedSquadCount() {
    return playerSquads.filter(squad => squad.unit).length;
  }

  // 每分钟点数的实际获取速度：基础 240 减去「场上每个单位按 deploy_cost 削减的量」，
  // 因此出兵越多、场上单位越多，攒点越慢（步兵 10 / 重甲 30 / 支援 20，均取自数据库）
  function playerIncomePerMinute() {
    const deployedCost = spawnedSquadCount() * PLAYER_SQUAD_DEPLOY_COST;
    return Math.max(0, PLAYER_POINTS_PER_MINUTE - deployedCost);
  }

  // 出生界面按钮：GRF1 展开步兵分类，JF 真正出兵，其余兵种尚未实现
  function handleSpawnOption(key) {
    // 第一层：分类按钮只负责展开 / 收起第二层，本身不扣点
    if (key === 'grf1') {
      spawnHudCategory = spawnHudCategory === key ? null : key;
      updateSpawnHudVisibility();
      return;
    }
    if (key === 'jf') {
      // 名额 = 存活单位 + 训练中的单位：阵亡的单位在训练完成前仍占着名额
      if (spawnedSquadCount() + trainingSquads.length >= PLAYER_SQUAD_LIMIT) {
        showCombatText(
          gameScene,
          SPAWN_POINT_X,
          SPAWN_POINT_Y - SPAWN_BADGE_RADIUS - 18,
          trainingSquads.length ? '单位训练中' : '小队数量已达上限',
          '#9fe3ff'
        );
        return;
      }
      if (playerPoints < SPAWN_BUTTON_RECRUIT_COST.jf) {
        showCombatText(gameScene, SPAWN_POINT_X, SPAWN_POINT_Y - SPAWN_BADGE_RADIUS - 18, '点数不足', '#ff8866');
        return;
      }
      playerPoints -= SPAWN_BUTTON_RECRUIT_COST.jf;
      beginPlayerSpawn();
      return;
    }
    showCombatText(
      gameScene,
      SPAWN_POINT_X,
      SPAWN_POINT_Y - SPAWN_BADGE_RADIUS - 18,
      key + ' 尚未开放',
      '#9fe3ff'
    );
  }

  // 出生流程第一步：在出生点组建一支新小队并开始播放出生动画（动画期间还不能行动）
  function beginPlayerSpawn() {
    const scene = gameScene;
    if (!scene) return;
    // 全灭的小队会在退役时从注册表移除，这里只清掉可能残留的空壳
    playerSquads.slice().forEach(squad => {
      if (!squad.members.length && !squad.spawnAnimation) removePlayerSquad(squad);
    });
    const squad = createPlayerSquad(scene, SPAWN_POINT_X, SPAWN_POINT_Y);
    const unit = squad.unit;
    unit.body.reset(SPAWN_POINT_X, SPAWN_POINT_Y);
    unit.setPosition(SPAWN_POINT_X, SPAWN_POINT_Y);
    unit.isMoving = false;
    unit.isSelected = false;
    squad.moveTarget = null;
    squad.detourPath = [];
    squad.replanKey = null;
    resetPlayerMoveProgress(squad);
    squad.freeBlend = 0;
    squad.morphProgress = 0;
    squad.squeezed = false;
    squad.freeActive = false;
    squad.regroup = false;
    squad.slotSwapped = true;
    squad.forward.x = 0;
    squad.forward.y = -1;
    updatePlayerSquad(squad);
    // 出生动画：体型由小到大、透明度由 0 到 1，队员依次淡入
    squad.members.forEach(member => {
      member.character.setScale(PLAYER_CHARACTER_SCALE * SPAWN_ANIMATION_MIN_SCALE);
      member.character.setAlpha(0);
      if (member.shadow) member.shadow.setAlpha(0);
    });
    squad.spawnAnimation = { startedAt: scene.time.now };
    spawnFlashAnimation = squad.spawnAnimation;
    spawnFlashGraphics.clear();
    spawnFlashGraphics.setVisible(true);
    spawnBadge.setScale(1);
  }

  // 是否还有小队正在播放出生动画（决定 update 里走出生分支还是待机呼吸分支）
  function hasActivePlayerSpawnAnimation() {
    return playerSquads.some(squad => squad.spawnAnimation) || spawnFlashAnimation !== null;
  }

  // 出生动画逐帧更新：体型与透明度插值 + 落地光环向外扩散（多支小队可同时出生，光环取最近一次）
  function updatePlayerSpawnAnimation(time) {
    playerSquads.slice().forEach(squad => {
      const animation = squad.spawnAnimation;
      if (!animation) return;
      const progress = Phaser.Math.Clamp((time - animation.startedAt) / SPAWN_ANIMATION_DURATION, 0, 1);
      const appear = Phaser.Math.Easing.Cubic.Out(progress);
      const scale = PLAYER_CHARACTER_SCALE * (SPAWN_ANIMATION_MIN_SCALE + (1 - SPAWN_ANIMATION_MIN_SCALE) * appear);
      squad.members.forEach(member => {
        // 保留 setPlayerFacing 的朝向（scaleX 为负表示朝左）
        member.character.setScale(member.character.scaleX < 0 ? -scale : scale, scale);
        member.character.setAlpha(appear);
        // 脚下阴影跟随出生动画一起淡入
        if (member.shadow) member.shadow.setAlpha(SHADOW_ALPHA * appear);
      });
      if (progress >= 1) finishPlayerSpawn(squad);
    });

    // 共享的扩散光环只由最近一次出生驱动，避免多支小队同时出兵时反复抢同一张 graphics
    if (!spawnFlashAnimation) {
      spawnFlashGraphics.clear();
      spawnFlashGraphics.setVisible(false);
      return;
    }
    const progress = Phaser.Math.Clamp(
      (time - spawnFlashAnimation.startedAt) / SPAWN_ANIMATION_DURATION,
      0,
      1
    );
    const flash = Phaser.Math.Clamp(progress / 0.8, 0, 1);
    const easedFlash = Phaser.Math.Easing.Cubic.Out(flash);
    const radius = SPAWN_BADGE_RADIUS * 0.35 + (SPAWN_RING_RADIUS - SPAWN_BADGE_RADIUS * 0.35) * easedFlash;
    spawnFlashGraphics.clear();
    spawnFlashGraphics.lineStyle(1 + 3 * (1 - flash), SPAWN_RING_COLOR, 0.95 * (1 - flash));
    spawnFlashGraphics.strokeCircle(SPAWN_POINT_X, SPAWN_POINT_Y, radius);
    spawnFlashGraphics.lineStyle(1 + 2 * (1 - flash), 0xffffff, 0.55 * (1 - flash));
    spawnFlashGraphics.strokeCircle(SPAWN_POINT_X, SPAWN_POINT_Y, radius * 0.6);
    spawnGlow.setScale(SPAWN_GLOW_BASE_SCALE * (0.6 + 1.15 * Phaser.Math.Easing.Cubic.Out(progress)));
    spawnGlow.setAlpha(0.3 + 0.55 * (1 - flash));
    if (progress >= 1) {
      spawnFlashAnimation = null;
      spawnFlashGraphics.clear();
      spawnFlashGraphics.setVisible(false);
      spawnGlow.setScale(SPAWN_GLOW_BASE_SCALE).setAlpha(0.22);
    }
  }

  // 没有出生动画时信标光晕的待机呼吸；小队满额时收敛，提示暂时不能出兵
  function updateSpawnBeaconIdle(time) {
    if (spawnedSquadCount() + trainingSquads.length >= PLAYER_SQUAD_LIMIT) {
      spawnGlow.setAlpha(0.1);
      spawnGlow.setScale(SPAWN_GLOW_BASE_SCALE * 0.9);
      return;
    }
    const pulse = 0.5 + 0.5 * Math.sin(time * 0.0022);
    spawnGlow.setAlpha(0.18 + 0.14 * pulse);
    spawnGlow.setScale(SPAWN_GLOW_BASE_SCALE * (0.94 + 0.08 * pulse));
  }

  // 出生动画结束：恢复体型，这一支小队正式进场，并自动执行第一个移动指令
  function finishPlayerSpawn(squad) {
    const scene = gameScene;
    squad.spawnAnimation = null;
    squad.members.forEach(member => {
      const facing = member.character.scaleX < 0 ? -1 : 1;
      member.character.setScale(facing * PLAYER_CHARACTER_SCALE, PLAYER_CHARACTER_SCALE);
      member.character.setAlpha(1);
      if (member.shadow) member.shadow.setAlpha(SHADOW_ALPHA);
    });
    squad.unit.isSpawned = true;
    // 出生后不自动接管控制：交给玩家自己点选，这里只让它自动走位到集合点
    squad.unit.isSelected = false;
    setPlayerSquadVisible(squad, true);
    // 出生后自动前往出生点左侧 100 像素以内的区域（按小队序号错开落点，
    // 连续出多支小队时不会挤在同一处）
    const offset = getPlayerSquadOrderOffset(squad.id % PLAYER_SQUAD_LIMIT, PLAYER_SQUAD_LIMIT);
    issuePlayerMoveOrder(
      squad,
      scene,
      SPAWN_POINT_X - SPAWN_RALLY_OFFSET_X + offset.x * SPAWN_RALLY_SPREAD,
      SPAWN_POINT_Y + offset.y * SPAWN_RALLY_SPREAD
    );
  }

  // 沿闭合多边形边缘按固定步长均匀采样，返回按「到查询点距离升序」排好的采样点，
  // 便于「从最近的边缘点开始往外找，找到第一个合法落点就停」
  function samplePolygonBoundaryOrdered(polygon, x, y, step) {
    const samples = [];
    for (let index = 0; index < polygon.length; index++) {
      const start = polygon[index];
      const end = polygon[(index + 1) % polygon.length];
      const length = Math.hypot(end.x - start.x, end.y - start.y);
      const count = Math.max(1, Math.round(length / step));
      for (let k = 0; k < count; k++) {
        const ratio = k / count;
        const point = {
          x: start.x + (end.x - start.x) * ratio,
          y: start.y + (end.y - start.y) * ratio,
          edgeIndex: index
        };
        point.distance = Math.hypot(point.x - x, point.y - y);
        samples.push(point);
      }
    }
    samples.sort((a, b) => a.distance - b.distance);
    return samples;
  }

  // 红区边缘上「外推安全带后仍站得住」的最近落点。正常的点击用最近边缘点就够，
  // 只有红区一段贴到地图或可行动区边界（外推点落到地图外、外推方向完全没有可站空间）
  // 时才需要沿同一圈边缘继续找：否则点击屏蔽区会被误判成无法绕行
  function findRedShieldSeat(zone, x, y, offset) {
    const samples = samplePolygonBoundaryOrdered(zone, x, y, RED_SHIELD_SCAN_STEP);
    for (let index = 0; index < samples.length; index++) {
      const point = correctPointOutOfRedClearance(samples[index], offset);
      if (isWalkable(point.x, point.y) && isRedClearanceSafePoint(point.x, point.y)) return point;
    }
    return null;
  }

  // 可行动区轮廓内侧的最近可行走落点：轮廓上的点落在边界上（pointInPolygon 的结论二义），
  // 沿外法线反向推一点即为区内，逐个距离试到第一个可行走落点。
  // 这一支只在「最近轮廓点朝内侧推进也站不住」时才走到，属于个别退化点击，
  // 采样间距取粗一些，避免为一次点击做整圈高密度探测
  function findWalkableShieldSeat(x, y) {
    const boundary = collisionRegions.walkableBoundary;
    const samples = samplePolygonBoundaryOrdered(boundary, x, y, WALKABLE_SHIELD_SCAN_STEP);
    for (let index = 0; index < samples.length; index++) {
      const sample = samples[index];
      const normal = getOutwardNormal(boundary, sample.edgeIndex);
      for (let depth = 2; depth <= 12; depth += 2) {
        const point = { x: sample.x - normal.x * depth, y: sample.y - normal.y * depth };
        if (isWalkable(point.x, point.y)) return point;
      }
    }
    return null;
  }

  // 点击屏蔽区时的终点判定：把行动终点定在「离点击点最近的那条屏蔽区边缘」上。
  // 红色屏蔽区取自身边缘外推 38 像素（结果是贴边行走但不卡进屏蔽区），
  // 绿色隔离区取可行动区轮廓内侧（轮廓内侧就是可站立的地面）。
  // 点到哪块屏蔽区就贴哪块：点进红区时只在该红区边缘上找落点，不再和可行动区轮廓混选
  function getShieldEdgeDestination(x, y, anchor) {
    const offset = PLAYER_RED_ZONE_CLEARANCE + RED_CONTOUR_MARGIN;
    let best = null;
    collisionRegions.redForbiddenZones.forEach(zone => {
      if (!pointInPolygon(x, y, zone)) return;
      const feature = getPolygonNearestEdgePoint(zone, x, y);
      let seat = null;
      if (feature) {
        const point = correctPointOutOfRedClearance(feature.point, offset);
        if (isWalkable(point.x, point.y) && isRedClearanceSafePoint(point.x, point.y)) {
          seat = { point, distance: Math.hypot(point.x - x, point.y - y) };
        }
      }
      if (!seat) {
        const fallback = findRedShieldSeat(zone, x, y, offset);
        if (fallback) seat = { point: fallback, distance: Math.hypot(fallback.x - x, fallback.y - y) };
      }
      if (seat && (!best || seat.distance < best.distance)) best = seat;
    });
    if (best) return best.point;
    // 点击绿色隔离区（可行动区轮廓之外）：终点定在轮廓内侧离点击点最近的可行走落点
    const walkedEdge = getPolygonNearestEdgePoint(collisionRegions.walkableBoundary, x, y);
    if (walkedEdge) {
      const point = correctPointIntoWalkable(walkedEdge.point, anchor);
      if (isWalkable(point.x, point.y)) return point;
    }
    return findWalkableShieldSeat(x, y);
  }

  // 重置移动进度看门狗：下达新指令、到达终点或结束移动时都要复位
  function resetPlayerMoveProgress(squad, now) {
    // 状态必须是对象：一旦被外部覆盖成数字，下面这些赋值会被静默丢弃，
    // stalledSince 变成 undefined 会让停滞判定恒为「未超时」，看门狗退化成每帧全量重规划
    if (!squad.moveProgress || typeof squad.moveProgress !== 'object') squad.moveProgress = {};
    squad.moveProgress.nodes = Infinity;
    squad.moveProgress.distance = Infinity;
    squad.moveProgress.closestDistance = Infinity;
    squad.moveProgress.stalledSince = Number.isFinite(now) ? now : 0;
    squad.moveProgress.retries = 0;
  }

  // 结束当前移动指令：曲线路径一并清空，队伍就地停下（不瞬移）。
  // 目标点标记不在这里清除：由每帧按「正在移动的小队数」统一同步显示
  function finishPlayerMoveOrder(squad) {
    squad.moveTarget = null;
    squad.detourPath = [];
    squad.replanKey = null;
    squad.unit.isMoving = false;
    squad.unit.body.stop();
    resetPlayerMoveProgress(squad);
  }

  // 路径进度标记：剩余节点数 + 到当前节点的距离
  function getPlayerMoveProgressMark(squad) {
    const waypoint = squad.detourPath[0] || squad.moveTarget;
    return {
      nodes: squad.detourPath.length,
      distance: waypoint ? Math.hypot(waypoint.x - squad.unit.x, waypoint.y - squad.unit.y) : 0
    };
  }

  // 移动进度看门狗：返回 true 表示本次移动已按「无法再靠近终点」结束。
  // 终点落在安全带与地图边界夹出的死角里时，直线逼近会被净空判定挡下，
  // 队长会一直沿着红区边缘来回滑动而永远到不了终点；这里先重规划（最多
  // PLAYER_MOVE_STALL_RETRIES 次，每次重规划重新获得一个停滞判定窗口），
  // 连续多次仍然毫无进展就认为队伍已经站到离终点最近的可站位置，就地收队。
  // 「毫无进展」必须同时看两个通道：途经点进度，以及到终点的最近距离记录。
  // 只看途经点时，绕远路（沿屏蔽区走曲线）会被误判成卡住；只看终点距离时，
  // 沿轮廓原地来回滑动又会一直被刷新的途经点距离掩盖，所以两个通道都停摆才重规划
  function updatePlayerMoveProgress(squad, time) {
    const mark = getPlayerMoveProgressMark(squad);
    const toTarget = squad.moveTarget
      ? Math.hypot(squad.moveTarget.x - squad.unit.x, squad.moveTarget.y - squad.unit.y)
      : 0;
    const advanced = mark.nodes < squad.moveProgress.nodes ||
      mark.distance < squad.moveProgress.distance - PLAYER_MOVE_PROGRESS_EPSILON ||
      toTarget < squad.moveProgress.closestDistance - PLAYER_MOVE_PROGRESS_EPSILON;
    if (advanced) {
      squad.moveProgress.nodes = mark.nodes;
      squad.moveProgress.distance = mark.distance;
      if (toTarget < squad.moveProgress.closestDistance) squad.moveProgress.closestDistance = toTarget;
      squad.moveProgress.stalledSince = time;
      squad.moveProgress.retries = 0;
      return false;
    }
    // stalledSince 必须是有效时间戳：非有限值会让下式恒为 false，停滞判定彻底失效
    if (!Number.isFinite(squad.moveProgress.stalledSince)) squad.moveProgress.stalledSince = time;
    if (time - squad.moveProgress.stalledSince < PLAYER_MOVE_STALL_TIMEOUT) return false;
    if (squad.moveProgress.retries < PLAYER_MOVE_STALL_RETRIES) {
      squad.moveProgress.retries += 1;
      squad.moveProgress.stalledSince = time;
      const replanned = getShortestPlayerPath({ x: squad.unit.x, y: squad.unit.y }, squad.moveTarget);
      if (replanned && replanned.length) {
        squad.detourPath = replanned;
        squad.replanKey = null;
        squad.replanAt = time + PLAYER_RED_REPLAN_COOLDOWN;
        squad.moveProgress.nodes = replanned.length;
        squad.moveProgress.distance = Math.hypot(
          replanned[0].x - squad.unit.x,
          replanned[0].y - squad.unit.y
        );
        squad.moveProgress.closestDistance = Infinity;
      }
      return false;
    }
    finishPlayerMoveOrder(squad);
    return true;
  }

  // 多小队同帧规划队列：框选 n 支小队会在同一帧里连续下发 n 条移动指令，
  // 每条都要跑一轮轮廓搜索，帧耗时随小队数线性增长，小队一多就明显掉帧。
  // 这里把「路径规划」这一步排进队列，在主循环里按每帧时间预算执行：
  // 队列对每支小队只保留最新一条指令（后下达的覆盖先前的），长度不会超过在场小队数。
  // 排队期间小队已经按直接转向前进（转向内部自带安全带脱离与沿红区滑动兜底），不会停在原地。
  const playerPathQueue = [];
  let playerPathBudgetFrame = -1;      // 预算结算所在的帧（scene.time.now）
  let playerPathBudgetUsed = 0;        // 本帧已用于规划的毫秒数
  let playerPathPlannedInFrame = 0;    // 本帧已完成的规划条数

  function queuePlayerPathOrder(squad, destination) {
    for (let index = playerPathQueue.length - 1; index >= 0; index--) {
      if (playerPathQueue[index].squad === squad) playerPathQueue.splice(index, 1);
    }
    playerPathQueue.push({ squad, destination });
  }

  // 完成一条排队的规划：路径为空说明直线与轮廓绕行都走不通，按「无法绕行」收队
  function applyPlayerPathOrder(scene, squad, destination, time) {
    const planned = getShortestPlayerPath({ x: squad.unit.x, y: squad.unit.y }, destination);
    if (!planned || !planned.length) {
      showCombatText(scene, destination.x, destination.y, '红色屏蔽区无法安全绕行', '#ff6666');
      finishPlayerMoveOrder(squad);
      return;
    }
    squad.detourPath = planned;
    squad.replanKey = null;
    squad.replanAt = 0;
    resetPlayerMoveProgress(squad, time);
    squad.unit.isMoving = true;
    scene.physics.moveToObject(squad.unit, squad.detourPath[0], UNIT_SPEED);
  }

  // 按帧时间预算推进规划队列，返回本帧完成的规划条数。
  // 预算按帧共享：一次框选会在同一帧里反复调用本函数，各自持有一份独立预算会让限流形同虚设。
  // 每帧至少推进一条，保证排队的小队不会一直站着不动
  function processPlayerPathQueue(scene, time, budget = PLAYER_PATH_FRAME_BUDGET) {
    if (!playerPathQueue.length) return 0;
    if (time !== playerPathBudgetFrame) {
      playerPathBudgetFrame = time;
      playerPathBudgetUsed = 0;
      playerPathPlannedInFrame = 0;
    }
    let planned = 0;
    while (playerPathQueue.length &&
      (playerPathPlannedInFrame === 0 || playerPathBudgetUsed < budget)) {
      const order = playerPathQueue.shift();
      const startedAt = performance.now();
      const squad = order.squad;
      // 过期任务（指令已被新指令覆盖、小队已阵亡或已抵达）直接丢弃，不占预算
      if (squad.unit && squad.unit.isSpawned && squad.moveTarget === order.destination) {
        playerPathPlannedInFrame += 1;
        planned += 1;
        applyPlayerPathOrder(scene, squad, order.destination, time);
      }
      playerPathBudgetUsed += performance.now() - startedAt;
    }
    return planned;
  }

  // 下发一次移动指令：屏蔽区终点判定 -> 可通行校验 -> 红区安全带吸附 -> 沿红区轮廓的最短曲线路径规划
  // 右键移动与出生后自动前出共用这一套逻辑，动画由动画状态机统一下发不会被打断
  function issuePlayerMoveOrder(squad, scene, x, y) {
    let destination = new Phaser.Math.Vector2(x, y);
    if (!isWalkable(destination.x, destination.y)) {
      // 点到红色屏蔽区或绿色隔离区：不再提示无法进入、也不再拒绝指令，
      // 而是做一次判定，把终点定在离点击点最近的那条屏蔽区边缘上
      const edge = getShieldEdgeDestination(x, y, squad.unit);
      if (!edge) {
        showCombatText(scene, destination.x, destination.y, '无法进入该区域', '#ff6666');
        return false;
      }
      destination.set(edge.x, edge.y);
    }
    // 终点落在 38 像素安全带内时，把终点吸附到红区外沿的安全位置，
    // 而不是把可到达的点击误判为无法绕行
    if (!isRedClearanceSafePoint(destination.x, destination.y, PLAYER_RED_ZONE_CLEARANCE)) {
      const snapped = correctPointOutOfRedClearance(
        destination,
        PLAYER_RED_ZONE_CLEARANCE + RED_CONTOUR_MARGIN
      );
      if (!isWalkable(snapped.x, snapped.y)) {
        showCombatText(scene, destination.x, destination.y, '无法进入该区域', '#ff6666');
        return false;
      }
      destination = new Phaser.Math.Vector2(snapped.x, snapped.y);
    }
    squad.moveTarget = destination;
    squad.detourPath = [];
    squad.replanKey = null;
    squad.replanAt = 0;
    // 看门狗从指令下达时刻起算：规划排队期间小队已在按直接转向前进
    resetPlayerMoveProgress(squad, scene.time.now);
    // 每次更改终点：队形回到默认站位（Qiongjiu 最上、Daiyan 最右、Jiangyu 最左）
    resetPlayerSquadFormation(squad);
    squad.unit.isMoving = true;
    setPlayerFacing(squad, destination.x < squad.unit.x);
    // 点击即走：先解除攻击动画的一次性锁，再交叉淡化切到 move，
    // 避免攻击动画播完才起步造成的延迟
    interruptPlayerAttackAnimation(squad);
    setPlayerAnimation(squad, 'move');
    // 曲线路径规划交给本帧的规划队列：单条指令仍在这一帧内完成，
    // 多支小队于同一帧下达时按帧预算顺延，避免一次框选把整帧卡住
    queuePlayerPathOrder(squad, destination);
    processPlayerPathQueue(scene, scene.time.now);
    return true;
  }

  // ----------------------------------------------------
  // 我方步兵小队：三名角色（Qiongjiu / Daiyan / Jiangyu）以正等边三角阵型合并为一个基本单位，
  // 队伍共用一个移动碰撞体（指令、寻路、索敌一律按整队结算），
  // 同时每名队员各自持有一个独立碰撞体（半径 34 像素的圆形判定体），
  // 分别做自己的红区净空、可行走与单位隔离判定；
  // 自由移动时阵型边长 113 像素，站位固定在屏幕上：Qiongjiu 在最上方、Daiyan 在最右边、
  // Jiangyu 在最左边，每次更改终点都会重新回到这一站位；
  // 贴到红色屏蔽区边缘时整队脱离队列自由移动（每名队员各自朝自己那份松散站位前进，
  // 各自贴着安全带绕行），整个队伍脱离红区后再平滑收拢回三角阵型；
  // 两种形态之间为平滑缓动过渡，队员之间绝对不允许小于 38 像素，
  // 最终渲染位置按 PLAYER_MEMBER_ANIM_MAX_STEP 限速缓动，修正量再大也不会跳变；
  // 队长 Daiyan 的属性、索敌与移动逻辑全部保留
  // ----------------------------------------------------
  // 运行时兼容处理：内置 SpinePlugin 的版本号是 "3.8.75"，但它的版本校验会把版本号
  // 恰好等于 "3.8.75" 的导出文件误判为“不受支持”。art/tr_ar 下三名角色正是 3.8.75
  // 导出的，因此在创建任何 Spine 对象之前先把缓存里的版本号归一化，否则资源会被拒绝解析。
  function normalizeSpineVersionTags(scene) {
    ['Daiyan', 'Jiangyu', 'Qiongjiu', 'Vespid'].forEach((key) => {
      const spineJson = scene.cache.json.get(key);
      if (spineJson && spineJson.skeleton && spineJson.skeleton.spine === '3.8.75') {
        spineJson.skeleton.spine = '3.8';
      }
    });
  }

  // 组建一支新的步兵小队：隐藏的物理锚点（整队移动/索敌结算）+ 三名独立队员，
  // 完成后注册进 playerSquads 注册表。每支小队的队员 uid 带小队序号，多队间花名册键可重复。
  function createPlayerSquad(scene, x, y) {
    const squad = createSquadState(x, y);
    const unit = scene.physics.add.sprite(x, y, 'playerTexture');
    unit.setVisible(false);
    unit.setCollideWorldBounds(true);
    unit.setDepth(1);
    unit.isSpawned = false;
    unit.isSelected = false;
    unit.isMoving = false;
    unit.nextAttackAt = 0;
    squad.unit = unit;
    squad.members = PLAYER_SQUAD_ROSTER.map(member => {
      const character = scene.add.spine(x, y, member.key, 'wait', true);
      character.setScale(PLAYER_CHARACTER_SCALE);
      character.setDepth(2);
      return {
        key: member.key,
        uid: member.key + '#' + squad.id,
        squad,
        slot: member.slot,
        isLeader: member.isLeader === true,
        character,
        // 每名队员都是独立单位：各自持有血条、攻击力与防御力
        hp: PLAYER_MEMBER_MAX_HP,
        maxHp: PLAYER_MEMBER_MAX_HP,
        // 上次受击时间：用于判定「5 秒未被攻击」后开始回血（-Infinity 表示从未受伤）
        lastDamagedAt: -Infinity,
        alive: true,
        charging: null,
        // 贴红区自由移动时的独立位置：脱离队列期间由各自的目标点驱动
        freeX: x,
        freeY: y,
        // 每名队员各自的独立碰撞体：用于红区净空、可行走与单位隔离判定，位置跟随实际渲染位置
        body: { x, y, radius: PLAYER_MEMBER_COLLISION_RADIUS },
        // 实际渲染位置：逐帧朝阵型算出的目标位置限速缓动，修正量较大时也不会跳变
        renderX: x,
        renderY: y,
        // 掉队自动归队：returning 为真时按 returnPath 逐帧寻路走回自己的站位，
        // 由 animOverride 标记自己单独播着的动画，returnFacingLeft 记录自己的朝向。
        // returnReplanIn 是重新规划冷却（毫秒，逐帧用 delta 递减）：贴边转向失败时
        // 不冷却就会逐帧全量寻路，这里限流后改由上层沿红区轮廓滑动把人带出去；
        // renderIdleMs 累计「本帧没有位移」的时长，用于卡住时把走路循环换成待机，避免原地踏步
        returning: false,
        returnPath: [],
        returnGoal: null,
        returnReplanIn: 0,
        renderIdleMs: 0,
        animOverride: null,
        returnFacingLeft: false,
        shadow: createUnitShadow(scene, character)
      };
    });
    const leader = squad.members.find(member => member.isLeader);
    if (leader) squad.character = leader.character;
    resetPlayerSquadSlotAssignment(squad);
    configurePlayerAnimationMixing(squad);
    updatePlayerSquad(squad);
    playerSquads.push(squad);
    return squad;
  }

  // 清除小队残留对象（阵亡冲锋尚未落地的队员），用于全灭后重新组建满编小队
  function disposePlayerSquad(squad) {
    squad.members.forEach(member => {
      if (member.shadow) {
        member.shadow.destroy();
        member.shadow = null;
      }
      if (member.character) {
        member.character.destroy();
        member.character = null;
      }
    });
    squad.members = [];
  }

  // 退役一支小队：清掉残留对象、销毁隐藏锚点并从注册表移除，为后续出兵腾出名额
  function removePlayerSquad(squad) {
    const index = playerSquads.indexOf(squad);
    if (index >= 0) playerSquads.splice(index, 1);
    disposePlayerSquad(squad);
    if (squad.spawnAnimation && squad.spawnAnimation === spawnFlashAnimation) {
      spawnFlashAnimation = null;
      spawnFlashGraphics.clear();
      spawnFlashGraphics.setVisible(false);
    }
    squad.spawnAnimation = null;
    if (squad.unit) {
      squad.unit.destroy();
      squad.unit = null;
    }
    squad.character = null;
  }

  // 复活时把三名队员的属性与状态全部复位（血条、染色、阵型过渡状态）
  function setPlayerSquadVisible(squad, visible) {
    squad.members.forEach(member => {
      member.character.setVisible(visible);
      if (member.shadow) member.shadow.setVisible(visible);
    });
  }

  function forEachPlayerCharacter(squad, callback) {
    if (squad.members.length) {
      squad.members.forEach(member => {
        // 阵亡冲锋中的队员已脱离小队，动画由各自的冲锋逻辑单独下发
        if (member.alive === false) return;
        if (!member.character || member.character.active === false) return;
        callback(member.character);
      });
    } else if (squad.character && squad.character.active !== false) {
      callback(squad.character);
    }
  }

  // 存活队员数量：我方齐射伤害与「全灭后重新出兵」都以它为准
  function getLivingPlayerMembers(squad) {
    return squad.members.filter(member => member.alive && member.character && member.character.active !== false);
  }

  // 0..1 的平滑过渡曲线（首尾速度均为 0）：阵型形态与队形旋转都用它缓动，
  // 起步与收尾都不会出现速度突变，观感上比线性插值自然
  function smoothStep01(value) {
    const t = Phaser.Math.Clamp(value, 0, 1);
    return t * t * (3 - 2 * t);
  }

  // 小队是否已贴到红色屏蔽区边缘：以 38 像素安全带为基准再放宽给定范围。
  // 进入与退出传入不同的范围即可形成迟滞，贴边行走时判定不会来回抖动
  function isPointAtRedEdge(x, y, extraRange) {
    const range = extraRange === undefined ? PLAYER_SQUAD_EDGE_RANGE : extraRange;
    let nearest = Infinity;
    collisionRegions.redForbiddenZones.forEach(zone => {
      const distance = getZonePointDistance(zone, x, y);
      if (distance < nearest) nearest = distance;
    });
    return nearest <= PLAYER_RED_ZONE_CLEARANCE + range;
  }

  function isPlayerSquadAtRedEdge(squad, extraRange) {
    return isPointAtRedEdge(squad.unit.x, squad.unit.y, extraRange);
  }

  // 行进方向：朝当前行进目标平滑转向；平滑过程中朝向反转会退化到零向量，此时直接取目标朝向
  function updatePlayerSquadForward(squad, target) {
    if (!target) return;
    const dx = target.x - squad.unit.x;
    const dy = target.y - squad.unit.y;
    const length = Math.hypot(dx, dy);
    if (length < 0.001) return;
    const desiredX = dx / length;
    const desiredY = dy / length;
    squad.forward.x += (desiredX - squad.forward.x) * PLAYER_SQUAD_FORMATION_LERP;
    squad.forward.y += (desiredY - squad.forward.y) * PLAYER_SQUAD_FORMATION_LERP;
    const blended = Math.hypot(squad.forward.x, squad.forward.y);
    if (blended < 0.0001) {
      squad.forward.x = desiredX;
      squad.forward.y = desiredY;
      return;
    }
    squad.forward.x /= blended;
    squad.forward.y /= blended;
  }

  // 队员当前占用的三角站位（未分配时退回花名册里的默认站位）
  function getPlayerSquadSlotOf(member) {
    return member.squad.slotAssignment[member.uid] || member.slot;
  }

  // 出兵 / 复位时：站位分配回到花名册的默认顺序
  function resetPlayerSquadSlotAssignment(squad) {
    squad.slotAssignment = {};
    squad.members.forEach(member => {
      squad.slotAssignment[member.uid] = member.slot;
    });
  }

  // 只固定「队形形状」，不固定谁站哪个位置：按距离把三个站位就近分给存活队员。
  // 队员与站位各只有三个，直接枚举 3! = 6 种分配取总位移最小的一种即可（带剪枝）
  function reassignPlayerSquadSlots(squad, living) {
    const slots = Object.keys(PLAYER_SQUAD_SLOT_OFFSETS);
    if (!living.length || living.length > slots.length) return;
    let bestOrder = null;
    let bestCost = Infinity;
    const used = new Array(slots.length).fill(false);
    const order = new Array(living.length);
    const walk = (index, cost) => {
      if (cost >= bestCost) return;
      if (index === living.length) {
        bestCost = cost;
        bestOrder = order.slice();
        return;
      }
      const character = living[index].character;
      for (let s = 0; s < slots.length; s++) {
        if (used[s]) continue;
        const slot = PLAYER_SQUAD_SLOT_OFFSETS[slots[s]];
        used[s] = true;
        order[index] = slots[s];
        walk(index + 1, cost + Math.hypot(character.x - (squad.unit.x + slot.x), character.y - (squad.unit.y + slot.y)));
        used[s] = false;
      }
    };
    walk(0, 0);
    if (!bestOrder) return;
    living.forEach((member, index) => {
      squad.slotAssignment[member.uid] = bestOrder[index];
    });
  }

  // 三角阵型站位：固定按屏幕坐标摆放，与行进方向无关（最上一个、左下、右下各一个）
  function getPlayerSquadFormationPositions(squad, living) {
    return living.map(member => {
      const slot = PLAYER_SQUAD_SLOT_OFFSETS[getPlayerSquadSlotOf(member)] || { x: 0, y: 0 };
      return { x: squad.unit.x + slot.x, y: squad.unit.y + slot.y };
    });
  }

  // 自由散开时的位置修正：逐点推回红区安全带之外，再用 38 像素最小间距分开队员。
  // 与三角阵型的整体平移不同，这里允许队员各自贴着安全带绕行，最后仍以红区净空收尾
  function settlePlayerSquadFreePoints(squad, positions) {
    for (let pass = 0; pass < PLAYER_SQUAD_SEPARATION_PASSES; pass++) {
      clampPlayerSquadPoints(squad, positions);
      if (!separatePlayerSquadPairs(squad, positions)) return;
    }
    // 红区安全优先于队员间距，收尾再推一次保证没有人卡进屏蔽区
    clampPlayerSquadPoints(squad, positions);
  }

  // 自由移动：贴红区时队员不再排成一路纵队，而是各自朝自己那份松散站位前进
  // （相对「当前行进目标点」的横向展开 + 前后错位），彼此只用最小间距隔离，
  // 因此三个人可以各走各的、各自贴着安全带绕行
  function updatePlayerSquadFreeMove(squad, living, step) {
    const aim = squad.detourPath[0] || squad.moveTarget;
    if (!aim) return;
    const forward = squad.forward;
    const sideX = -forward.y;
    const sideY = forward.x;
    const advance = UNIT_SPEED * step / 1000;
    living.forEach(member => {
      const loose = PLAYER_SQUAD_FREE_OFFSETS[getPlayerSquadSlotOf(member)] || { side: 0, back: 0 };
      const goalX = aim.x + sideX * loose.side + forward.x * loose.back;
      const goalY = aim.y + sideY * loose.side + forward.y * loose.back;
      const dx = goalX - member.freeX;
      const dy = goalY - member.freeY;
      const distance = Math.hypot(dx, dy);
      if (distance > 0.001) {
        const move = Math.min(advance, distance);
        member.freeX += dx / distance * move;
        member.freeY += dy / distance * move;
      }
      // 与队形中心（共用碰撞体）的距离上限：队员自由行走也不会脱离队伍太远，
      // 脱离红区后收拢回三角阵型的位移也就控制在合理范围内
      const outX = member.freeX - squad.unit.x;
      const outY = member.freeY - squad.unit.y;
      const outLength = Math.hypot(outX, outY);
      if (outLength > PLAYER_SQUAD_FREE_MAX_DISTANCE) {
        // 超出上限后按行军速度的若干倍逐步回收，而不是一帧夹回上限：
        // 队员被拉回队伍的过程是匀速收拢，不会突然一顿
        const returnStep = advance * PLAYER_SQUAD_FREE_RETURN_RATIO;
        const allowed = Math.max(PLAYER_SQUAD_FREE_MAX_DISTANCE, outLength - returnStep);
        const scale = allowed / outLength;
        member.freeX = squad.unit.x + outX * scale;
        member.freeY = squad.unit.y + outY * scale;
      }
    });
    // 先做队员隔离与红区净空，再把结果写回各自的自由位置，下一帧从这里继续前进
    const points = living.map(member => ({ x: member.freeX, y: member.freeY }));
    settlePlayerSquadFreePoints(squad, points);
    living.forEach((member, index) => {
      member.freeX = points[index].x;
      member.freeY = points[index].y;
    });
  }

  // 离开红色屏蔽区后的归队：不再用形态混合把队员插值回站位（那是每秒数百像素的「吸」回），
  // 而是保留每名队员当前所在位置，让它按单位速度自己走回自己的站位；与站位拉得越开速度越高
  // （上限是归队速度），队伍一边继续行军时也追得上，不会永远拖在队尾。
  // 走向站位用的是与队伍同源的逐帧转向（红区净空 + 贴着轮廓滑动），因此既不取直线穿过屏蔽区，
  // 也不会为了归队卡进屏蔽区。返回 true 表示全员都已站回自己的站位
  function updatePlayerSquadRegroup(squad, living, step) {
    const formation = getPlayerSquadFormationPositions(squad, living);
    let allHome = true;
    living.forEach((member, index) => {
      const goal = formation[index];
      const dx = goal.x - member.freeX;
      const dy = goal.y - member.freeY;
      const distance = Math.hypot(dx, dy);
      if (member.regroupHome || distance <= PLAYER_SQUAD_REGROUP_ARRIVE) {
        // 已经到位：自由位置直接对齐站位（后续由隔离与净空收尾），动画交回全队层
        member.regroupHome = true;
        member.regrouping = false;
        member.regroupStall = 0;
        member.freeX = goal.x;
        member.freeY = goal.y;
        return;
      }
      // 起步就是行军速度，与站位拉得越开越快（在 PLAYER_SQUAD_REGROUP_CATCHUP_DISTANCE 处到顶）：
      // 队员被甩开十几像素时不会用比队伍还慢的速度去追，小落差则保持正常行军速度
      const speed = UNIT_SPEED + (PLAYER_MEMBER_RETURN_SPEED - UNIT_SPEED) *
        Phaser.Math.Clamp(distance / PLAYER_SQUAD_REGROUP_CATCHUP_DISTANCE, 0, 1);
      const budget = speed * step / 1000;
      const origin = { x: member.freeX, y: member.freeY };
      const steered = getPlayerSteeringTarget(origin, goal, budget);
      if (steered) {
        member.freeX = steered.x;
        member.freeY = steered.y;
      }
      const progress = distance - Math.hypot(goal.x - member.freeX, goal.y - member.freeY);
      // 连续多帧都没能朝站位靠近（站位落在不可行走处、被安全带与地形夹住等）：
      // 认定已经走到最接近站位的位置，交给阵型层收尾，避免在这里原地空转
      member.regroupStall = progress < budget * PLAYER_SQUAD_REGROUP_STALL_RATIO
        ? (member.regroupStall || 0) + 1
        : 0;
      if (member.regroupStall >= PLAYER_SQUAD_REGROUP_STALL_FRAMES) member.regroupHome = true;
      if (member.regroupHome) {
        // 看门狗判定为「已经站到最接近站位的位置」：动画立即交回全队层
        member.regrouping = false;
      } else {
        // 归队途中朝向自己的前进方向（全队朝向在帧末统一写，会被覆盖，
        // 所以只记录，最终由 applyPlayerMemberReturnVisuals 单独下发）
        if (Math.abs(member.freeX - origin.x) > 0.02) member.returnFacingLeft = member.freeX < origin.x;
        member.regrouping = true;
        // 脚步速率跟随实际移动速度：加速追赶时动画同步加快，不会出现打滑或原地踏步
        member.regroupSpeedRatio = speed / UNIT_SPEED;
      }
      allHome = false;
    });
    return allHome;
  }

  // 每次更改终点时调用：阵型目标回到默认站位（Qiongjiu 最上、Daiyan 最右、Jiangyu 最左）。
  // 这里不硬切形态，而是把行进方向对齐到新目标后交给逐帧缓动，
  // 否则三角阵型与自由散开之间会瞬间跳变，看起来像卡顿。
  // 队形重排交给本帧主循环统一执行（指令在场景 update 之前处理，主循环随后就会更新全部小队）：
  // 指令处理器里再算一遍等于每支小队每帧多解一次阵型，框选 n 支小队就是 n 次额外求解，
  // 这正是「一次框选把下单那一帧顶到十几毫秒」的主要开销
  function resetPlayerSquadFormation(squad) {
    const target = squad.detourPath[0] || squad.moveTarget;
    if (target) {
      const dx = target.x - squad.unit.x;
      const dy = target.y - squad.unit.y;
      const length = Math.hypot(dx, dy);
      if (length > 0.001) {
        squad.forward.x = dx / length;
        squad.forward.y = dy / length;
      }
    }
  }

  // 人员隔离：任意两名队员的距离不得小于 38 像素，一旦不足就沿连线方向对称推开，
  // 恢复目标为 56 像素（隔离要求 38~56 像素），返回是否发生了调整
  function separatePlayerSquadPairs(squad, positions) {
    const target = PLAYER_SQUAD_SEPARATION_TARGET + PLAYER_SQUAD_SEPARATION_BUFFER;
    let adjusted = false;
    for (let i = 0; i < positions.length; i++) {
      for (let j = i + 1; j < positions.length; j++) {
        const dx = positions[j].x - positions[i].x;
        const dy = positions[j].y - positions[i].y;
        let distance = Math.hypot(dx, dy);
        if (distance >= PLAYER_SQUAD_SEPARATION - RED_CLEARANCE_TOLERANCE) continue;
        let normalX;
        let normalY;
        if (distance < 0.0001) {
          // 完全重合时无法由连线确定分离方向，退回沿阵型横向分离
          normalX = -squad.forward.y;
          normalY = squad.forward.x;
          distance = 0;
        } else {
          normalX = dx / distance;
          normalY = dy / distance;
        }
        const push = (target - distance) / 2;
        positions[i].x -= normalX * push;
        positions[i].y -= normalY * push;
        positions[j].x += normalX * push;
        positions[j].y += normalY * push;
        adjusted = true;
      }
    }
    return adjusted;
  }

  // 把落到不可行走区域的点推回可行走区域：先试「朝队形中心收缩」的方向（队形中心一定在
  // 可行走区域内，这个方向最不容易再次撞到边界），再按递增半径做环形搜索，取最近的可走落点；
  // 四周都被挡住时原样返回，不硬塞到非法位置
  function correctPointIntoWalkable(point, anchor, maxRadius = 72) {
    if (isWalkable(point.x, point.y)) return { x: point.x, y: point.y };
    const directions = [];
    const toAnchorX = anchor.x - point.x;
    const toAnchorY = anchor.y - point.y;
    const toAnchorLength = Math.hypot(toAnchorX, toAnchorY);
    if (toAnchorLength > 0.001) {
      directions.push({ x: toAnchorX / toAnchorLength, y: toAnchorY / toAnchorLength });
    }
    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI / 4;
      directions.push({ x: Math.cos(angle), y: Math.sin(angle) });
    }
    for (let distance = 2; distance <= maxRadius; distance = distance < 8 ? distance + 2 : distance * 1.5) {
      for (let d = 0; d < directions.length; d++) {
        const x = point.x + directions[d].x * distance;
        const y = point.y + directions[d].y * distance;
        if (isWalkable(x, y)) return { x, y };
      }
    }
    return { x: point.x, y: point.y };
  }

  // 位置修正：把队员推回红色屏蔽区的 38 像素安全带之外，并保证各自仍落在可行走区域内。
  // 这是「每名队员的独立碰撞体」的判定核心：三人各自过自己的安全带与地形，互不代劳
  function clampPlayerSquadPoints(squad, positions) {
    const anchor = { x: squad.unit.x, y: squad.unit.y };
    positions.forEach(point => {
      const outOfRed = correctPointOutOfRedClearance(point, PLAYER_RED_ZONE_CLEARANCE);
      const corrected = correctPointIntoWalkable(outOfRed, anchor);
      point.x = corrected.x;
      point.y = corrected.y;
    });
  }

  // 单个队员越出红区安全带的深度：0 表示已在安全带之外
  function getPlayerSquadRedViolation(point) {
    const corrected = correctPointOutOfRedClearance(point, PLAYER_RED_ZONE_CLEARANCE);
    return Math.hypot(corrected.x - point.x, corrected.y - point.y);
  }

  function getWorstPlayerSquadRedViolation(positions) {
    let worst = 0;
    positions.forEach(point => {
      const violation = getPlayerSquadRedViolation(point);
      if (violation > worst) worst = violation;
    });
    return worst;
  }

  // 队员与红区边缘保持 38 像素距离时优先整体平移：刚体平移不改变队员间距，
  // 因此自由行走时的横向展开量、纵队时队员之间的最小隔离距离都能严格保持；
  // 只有在整体平移不收敛时才退回到逐点推回（此时红区安全优先于间距）
  function fitPlayerSquadToRedClearance(squad, positions) {
    let best = positions.map(point => ({ x: point.x, y: point.y }));
    let bestViolation = getWorstPlayerSquadRedViolation(positions);
    for (let pass = 0; pass < PLAYER_SQUAD_SEPARATION_PASSES && bestViolation > RED_CLEARANCE_TOLERANCE; pass++) {
      // 以需要修正幅度最大的队员为准，整队一起平移
      let shiftX = 0;
      let shiftY = 0;
      let shiftLength = 0;
      positions.forEach(point => {
        const corrected = correctPointOutOfRedClearance(point, PLAYER_RED_ZONE_CLEARANCE);
        const dx = corrected.x - point.x;
        const dy = corrected.y - point.y;
        const length = Math.hypot(dx, dy);
        if (length <= shiftLength) return;
        shiftLength = length;
        shiftX = dx;
        shiftY = dy;
      });
      if (shiftLength <= RED_CLEARANCE_TOLERANCE) break;
      positions.forEach(point => {
        point.x += shiftX;
        point.y += shiftY;
      });
      const violation = getWorstPlayerSquadRedViolation(positions);
      if (violation < bestViolation) {
        bestViolation = violation;
        best = positions.map(point => ({ x: point.x, y: point.y }));
      }
    }
    positions.forEach((point, index) => {
      point.x = best[index].x;
      point.y = best[index].y;
    });
    if (bestViolation > RED_CLEARANCE_TOLERANCE) clampPlayerSquadPoints(squad, positions);
  }

  // 队员隔离与红区净空会互相冲突，交替迭代求解，且每轮都以红区净空收尾：
  // 最终的阵型一定在安全带上，队员间距也满足 38 像素隔离要求
  function resolvePlayerSquadOverlap(squad, positions) {
    for (let pass = 0; pass < PLAYER_SQUAD_SEPARATION_PASSES; pass++) {
      if (!separatePlayerSquadPairs(squad, positions)) break;
      clampPlayerSquadPoints(squad, positions);
    }
  }

  // 每名队员的独立碰撞体与敌方碰撞体的单位隔离：重叠时队员这一半直接推开本帧的阵型位置，
  // 另一半由同一帧稍后的 separateEnemies 推给敌方单位（双方各让一半，贴墙时不会把队员挤进红区）。
  // 冲锋自爆中的队员不参与：它必须能贴到敌方单位身边才引爆
  function separatePlayerMembersFromEnemies(squad, living, positions) {
    const enemies = enemiesGroup.getChildren();
    if (!enemies.length) return;
    const minDistance = PLAYER_MEMBER_ENEMY_SEPARATION;
    const minDistanceSquared = minDistance * minDistance;
    living.forEach((member, index) => {
      if (!member.body) return;
      const point = positions[index];
      let pushX = 0;
      let pushY = 0;
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (!enemy.active || enemy.charging) continue;
        const dx = point.x - enemy.x;
        const dy = point.y - enemy.y;
        const distanceSquared = dx * dx + dy * dy;
        if (distanceSquared >= minDistanceSquared) continue;
        const distance = Math.sqrt(distanceSquared);
        let normalX;
        let normalY;
        if (distance < 0.0001) {
          // 完全重合：沿行进方向错开，避免除零后推向随机方向
          normalX = squad.forward.x;
          normalY = squad.forward.y;
        } else {
          normalX = dx / distance;
          normalY = dy / distance;
        }
        const push = (minDistance - distance) * 0.5;
        pushX += normalX * push;
        pushY += normalY * push;
      }
      const length = Math.hypot(pushX, pushY);
      if (length <= 0.0001) return;
      const scale = Math.min(length, PLAYER_MEMBER_SEPARATION_MAX_PUSH) / length;
      point.x += pushX * scale;
      point.y += pushY * scale;
    });
  }

  // 跨小队挤压的持久阵型偏移：多支小队同时向同一目标点汇聚（或行进途中擦肩而过）时，
  // 不同小队的队员之间也必须保持最小间距，否则各队阵型会互相压进、队员叠在一起。
  // 队内隔离（separatePlayerSquadPairs）只约束本队三人，这里补上队与队之间的约束。
  // 每帧用「本队阵型位置 vs 其他小队上一帧渲染位置」求一次整队需要的平移量（各让一半），
  // 再把它低通滤波写入 squad.crowdX/crowdY 并应用到阵型：偏移是持久状态，不会像
  // 只推瞬时位置那样被下一帧的阵型重算拉回、来回震荡；附近没有别的队伍时向 0 平滑收敛。
  // 平移量按重叠数量取平均（多个方向都被挤时取合力方向），并限幅，不会把整队推飞；
  // 平移后的阵型仍会经过 clampPlayerSquadPoints 的红区净空与可行走校验
  function updatePlayerSquadCrowdShift(squad, formation) {
    const minDistance = PLAYER_CROSS_SQUAD_SEPARATION;
    const minDistanceSquared = minDistance * minDistance;
    let pushX = 0;
    let pushY = 0;
    let count = 0;
    playerSquads.forEach(other => {
      if (other === squad || !other.unit || !other.unit.isSpawned) return;
      other.members.forEach(otherMember => {
        if (!otherMember.alive || !otherMember.character || otherMember.character.active === false) return;
        const ox = otherMember.character.x;
        const oy = otherMember.character.y;
        for (let index = 0; index < formation.length; index++) {
          const point = formation[index];
          const dx = point.x - ox;
          const dy = point.y - oy;
          const distanceSquared = dx * dx + dy * dy;
          if (distanceSquared >= minDistanceSquared) continue;
          const distance = Math.sqrt(distanceSquared);
          let normalX;
          let normalY;
          if (distance < 0.0001) {
            normalX = -squad.forward.y;
            normalY = squad.forward.x;
          } else {
            normalX = dx / distance;
            normalY = dy / distance;
          }
          const push = (minDistance - distance) * 0.5;
          pushX += normalX * push;
          pushY += normalY * push;
          count += 1;
        }
      });
    });
    let targetX = 0;
    let targetY = 0;
    if (count > 0) {
      targetX = pushX / count;
      targetY = pushY / count;
      const length = Math.hypot(targetX, targetY);
      if (length > PLAYER_CROSS_SQUAD_MAX_SHIFT) {
        targetX = targetX / length * PLAYER_CROSS_SQUAD_MAX_SHIFT;
        targetY = targetY / length * PLAYER_CROSS_SQUAD_MAX_SHIFT;
      }
    }
    squad.crowdX += (targetX - squad.crowdX) * PLAYER_CROSS_SQUAD_LERP;
    squad.crowdY += (targetY - squad.crowdY) * PLAYER_CROSS_SQUAD_LERP;
  }

  // 队员能否直接沿直线走回自己的站位：直线不侵入红区安全带、且整条直线都在可行走区域内才算安全。
  // 安全带判定用 slack = 0，和运行时「绝不贴进安全带以内」的要求保持一致。
  // clearance 允许调用方收紧要求（归位判定用更宽的通道形成迟滞死区）
  function isPlayerMemberDirectRouteSafe(originX, originY, target, clearance = PLAYER_RED_ZONE_CLEARANCE) {
    if (!isRedClearanceSafePoint(target.x, target.y)) return false;
    return isRedClearanceSafeSegment(
      { x: originX, y: originY },
      target,
      clearance,
      true,
      0
    );
  }

  // 复位队员的归队状态：清空路径与目标，同时解除重新规划冷却，
  // 下次进入归队状态时能立刻规划一次（各处「退出归队 / 重新进入归队」都走这里，避免漏字段）
  function resetPlayerMemberReturn(member) {
    member.returnPath = [];
    member.returnGoal = null;
    member.returnReplanIn = 0;
  }

  // 掉队队员的自动寻路归队：规划用的是队伍同一套寻路逻辑（红区净空 + 可行走 + 沿红区等距轮廓
  // 绕行的曲线路径），前进用的是同一套逐帧转向函数，因此归队途中同样不取直线、不卡进屏蔽区，
  // 贴到红区时与队伍一样沿轮廓滑动。返回 null 表示本帧无法前进（目标暂时不可达），由上层退回避让
  function stepPlayerMemberReturn(member, target, budget, step) {
    const originX = member.renderX === undefined ? target.x : member.renderX;
    const originY = member.renderY === undefined ? target.y : member.renderY;
    const origin = { x: originX, y: originY };
    // 重新规划冷却：逐帧递减，只有冷却结束才允许再次全量寻路。
    // 队员被安全带夹住时，「转向失败 -> 清空路径 -> 下一帧再规划」会变成逐帧寻路，
    // 冷却期间本函数直接返回 null，由上层改为沿红区轮廓滑动 / 沿安全直线靠近
    member.returnReplanIn = Math.max(0, (member.returnReplanIn || 0) - (step || 0));
    // 「站位移到了需要换路径」的判定：还没规划过、或阵型站位移动超过阈值（站位随队伍前进一直在动）。
    // 逐帧寻路既浪费性能，也会让队员在拐点附近来回摇摆；真需要换路径时也优先走下面的「只挪末端点」
    const goalMoved = !member.returnGoal ||
      Phaser.Math.Distance.Between(member.returnGoal.x, member.returnGoal.y, target.x, target.y) >
      PLAYER_MEMBER_RETURN_REPLAN_DISTANCE;
    // 站位只挪动了一点：只要最后一段换成新站位后仍然净空，就沿用已经规划好的绕行曲线，
    // 只把末点挪过去。队员的站位随队伍前进一直在动，若每次都重跑整段规划，
    // 贴边归队时就成了每秒数十次全量寻路（首次 A* 展开要判定全部轮廓节点），
    // 这是移动卡顿最大的一处来源
    const tailFrom = member.returnPath.length > 1
      ? member.returnPath[member.returnPath.length - 2]
      : origin;
    if (goalMoved && member.returnPath.length &&
      isRedClearanceSafePoint(target.x, target.y) &&
      isRedClearanceSafeSegment(tailFrom, target, PLAYER_RED_ZONE_CLEARANCE, true)) {
      member.returnPath[member.returnPath.length - 1] = { x: target.x, y: target.y };
      member.returnGoal = { x: target.x, y: target.y };
    } else if ((goalMoved || !member.returnPath.length) && member.returnReplanIn <= 0 &&
      takeMemberReturnPlanSlot()) {
      const path = getShortestPlayerPath(origin, target);
      if (!path || !path.length) {
        // 规划失败（起点本身落在安全带里、站位暂时不可达等）：同样限流，
        // 否则每一帧都会重试一次全量寻路
        member.returnReplanIn = PLAYER_MEMBER_RETURN_REPLAN_COOLDOWN;
        return null;
      }
      member.returnPath = path;
      member.returnGoal = { x: target.x, y: target.y };
    }
    if (!member.returnPath.length) return null;
    // 已经经过的路径点直接丢弃，避免在旧拐点上原地停一帧
    while (member.returnPath.length > 1 &&
      Phaser.Math.Distance.Between(origin.x, origin.y, member.returnPath[0].x, member.returnPath[0].y) <=
      PLAYER_MEMBER_RETURN_WAYPOINT_RADIUS) {
      member.returnPath.shift();
    }
    const waypoint = member.returnPath[0];
    const steered = getPlayerSteeringTarget(origin, waypoint, budget);
    if (!steered) {
      // 朝向被安全带挡住：丢掉当前路径并进入冷却，交给上层沿红区轮廓滑动带出去
      resetPlayerMemberReturn(member);
      member.returnReplanIn = PLAYER_MEMBER_RETURN_REPLAN_COOLDOWN;
      return null;
    }
    if (member.returnPath.length > 1 &&
      Phaser.Math.Distance.Between(origin.x, origin.y, waypoint.x, waypoint.y) <=
      PLAYER_MEMBER_RETURN_WAYPOINT_RADIUS) {
      member.returnPath.shift();
    }
    // 落点净空：轮廓折线的弦长误差会让转向落点比安全带略微贴里一点，
    // 所以先按「推到安全带之外」修正（修正后是足额净空），修正结果再过一次
    // 与转向函数一致的线段判定，避免推离方向把落点甩到屏蔽区另一侧。
    // 这里不能只用严格判定否决落点：一旦否决，上层会退回直行，队员就会穿进屏蔽区
    const landing = isRedClearanceSafePoint(steered.x, steered.y)
      ? steered
      : correctPointOutOfRedClearance(steered, PLAYER_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS);
    if (isRedClearanceSafePoint(landing.x, landing.y) &&
      isRedClearanceSafeSegment(origin, landing, PLAYER_RED_ZONE_CLEARANCE, false, RED_CLEARANCE_PATH_SLACK)) {
      return landing;
    }
    // 连半步都推不出安全落点：本帧不动，并让旧路径失效（同样限流），
    // 避免留下一条永远转不动的路径把队员钉在原地
    const half = correctPointOutOfRedClearance(
      { x: (origin.x + steered.x) / 2, y: (origin.y + steered.y) / 2 },
      PLAYER_RED_ZONE_CLEARANCE + PLAYER_RED_STEER_BIAS
    );
    resetPlayerMemberReturn(member);
    member.returnReplanIn = PLAYER_MEMBER_RETURN_REPLAN_COOLDOWN;
    return isRedClearanceSafePoint(half.x, half.y) ? half : null;
  }

  // 每帧按阵型摆放三名队员：位置只由碰撞体位置与阵型形态推导，移动本身仍由碰撞体驱动；
  // 每名队员各自持有独立碰撞体，最终位置再过一遍「与敌方的单位隔离」与「红区 + 可行走」判定，
  // 并以限速缓动写入渲染位置，因此进出红色屏蔽区时既安全又平滑
  function updatePlayerSquad(squad, delta) {
    // 阵亡冲锋中的队员已经脱离阵型，只有存活队员参与队形摆放
    const living = getLivingPlayerMembers(squad);
    if (!living.length) return;
    const step = delta === undefined ? 16.667 : delta;
    // 贴到红区边缘时整队脱离队列自由移动；
    // 进入与退出使用两个不同范围形成迟滞，避免安全带附近形态反复收放。
    // 「整个队伍脱离红区」以每名队员的实际位置为准：只要还有人贴着安全带，
    // 就继续自由移动，不会提前把队伍收回三角阵型
    const edgeRange = squad.squeezed ? PLAYER_SQUAD_EDGE_EXIT_RANGE : PLAYER_SQUAD_EDGE_RANGE;
    const atRedEdge = !!squad.moveTarget && (
      isPlayerSquadAtRedEdge(squad, edgeRange) ||
      living.some(member => isPointAtRedEdge(member.character.x, member.character.y, edgeRange))
    );
    squad.squeezed = atRedEdge;
    updatePlayerSquadForward(squad, squad.detourPath[0] || squad.moveTarget);
    // 形态进度按时间线性推进，再做 smoothstep 缓动：过渡时长固定，起步收尾都平顺。
    // 只有「贴到红区」会把形态推满；脱离红区后不再把形态放回去，而是交给下面
    // updatePlayerSquadRegroup 让队员各自按单位速度走回站位，全部到位后再切回纯三角阵型
    const morphStep = step / PLAYER_SQUAD_MORPH_DURATION;
    if (atRedEdge) {
      squad.regrouping = false;
      squad.morphProgress = Math.min(1, squad.morphProgress + morphStep);
    } else if (squad.freeActive) {
      squad.regrouping = true;
      squad.morphProgress = Math.min(1, squad.morphProgress + morphStep);
    } else {
      squad.regrouping = false;
      squad.morphProgress = 0;
    }
    squad.freeBlend = smoothStep01(squad.morphProgress);
    const formation = getPlayerSquadFormationPositions(squad, living);
    // 跨小队挤压：整队阵型带一个持久偏移，向挤过来的其他小队让开（多队汇聚时队员
    // 不会互相压进）；偏移量向 0 平滑收敛，附近队伍离开后阵型自动回到锚点正上方
    updatePlayerSquadCrowdShift(squad, formation);
    if (squad.crowdX !== 0 || squad.crowdY !== 0) {
      formation.forEach(point => {
        point.x += squad.crowdX;
        point.y += squad.crowdY;
      });
    }
    if (atRedEdge) {
      if (!squad.freeActive) {
        // 刚贴到红区：以当前三角阵型站位作为自由移动的起点，散开过程不会出现瞬移
        living.forEach((member, index) => {
          member.freeX = formation[index].x;
          member.freeY = formation[index].y;
          member.regroupHome = false;
          member.regroupStall = 0;
          member.regrouping = false;
        });
        squad.freeActive = true;
        squad.slotSwapped = false;
      }
      updatePlayerSquadFreeMove(squad, living, step);
    } else if (squad.freeActive) {
      if (!squad.slotSwapped && squad.freeBlend >= PLAYER_SQUAD_SLOT_SWAP_BLEND) {
        // 整个队伍已脱离红区、且基本完全散开（此时可视位置由自由位置决定、与站位无关）：
        // 按“谁离哪个站位近”重新分配三角站位。换站位不产生任何瞬移，
        // 之后的归队只是各自就近走回站位，不会再出现横穿队伍去抢固定站位导致的生硬动画。
        // 只在本次绕行里换一次（squad.slotSwapped），避免边缘反复进出时站位来回抖动
        reassignPlayerSquadSlots(squad, living);
        squad.slotSwapped = true;
      }
      if (updatePlayerSquadRegroup(squad, living, step)) {
        // 全员已各自走回站位：此刻自由位置与站位完全重合，
        // 切回纯三角阵型不会产生任何位移，也没有动画跳变
        squad.freeActive = false;
        squad.regrouping = false;
        squad.morphProgress = 0;
        squad.freeBlend = 0;
      }
    }
    const positions = living.map((member, index) => {
      const base = formation[index];
      if (squad.freeBlend <= 0) return { x: base.x, y: base.y };
      return {
        x: base.x + (member.freeX - base.x) * squad.freeBlend,
        y: base.y + (member.freeY - base.y) * squad.freeBlend
      };
    });
    if (squad.freeBlend <= 0) {
      // 纯三角阵型：整体平移避让红区，阵型间距严格保持；再处理队员间距兜底
      fitPlayerSquadToRedClearance(squad, positions);
      resolvePlayerSquadOverlap(squad, positions);
    } else {
      // 自由散开（或正在收回阵型）：逐点修正，队员可以各自贴着安全带绕行
      settlePlayerSquadFreePoints(squad, positions);
    }
    // 各队员的独立碰撞体先与敌方单位做一次隔离，最后以红区净空与可行走收尾（地形安全优先）
    separatePlayerMembersFromEnemies(squad, living, positions);
    clampPlayerSquadPoints(squad, positions);
    // 渲染位置朝目标位置限速缓动：修正量再大也会摊到若干帧里，不会出现跳变。
    // 掉队的队员（拉开太远，或直线回位会穿进红区安全带）改为自动寻路归队：
    // 沿红区轮廓曲线走回自己的站位并播放移动动画，而不是从远处直线飘/穿过屏蔽区过来
    const maxStep = PLAYER_MEMBER_ANIM_MAX_STEP * Math.max(0.5, step / 16.667);
    const returnBudget = PLAYER_MEMBER_RETURN_SPEED * step / 1000;
    const returnExitDistance = PLAYER_MEMBER_RETURN_DISTANCE * PLAYER_MEMBER_RETURN_EXIT_RATIO;
    living.forEach((member, index) => {
      const target = positions[index];
      const startX = member.renderX === undefined ? target.x : member.renderX;
      const startY = member.renderY === undefined ? target.y : member.renderY;
      let renderX = startX;
      let renderY = startY;
      const dx = target.x - renderX;
      const dy = target.y - renderY;
      const distance = Math.hypot(dx, dy);
      if (distance <= maxStep) {
        // 已经到位：直接吸附并结束归队状态
        renderX = target.x;
        renderY = target.y;
        member.returning = false;
        resetPlayerMemberReturn(member);
      } else {
        // 直线回位是否安全只在短距离时才判定（归队完成条件用得到，长距离已经直接判定为掉队）：
        // 「收进半个触发距离 + 直线已经安全」才算归位，避免在阈值附近反复进出归队状态
        if (member.returning) {
          if (distance <= returnExitDistance &&
            isPlayerMemberDirectRouteSafe(renderX, renderY, target, PLAYER_MEMBER_RETURN_EXIT_CLEARANCE)) {
            member.returning = false;
            resetPlayerMemberReturn(member);
          }
        } else if (distance > PLAYER_MEMBER_RETURN_DISTANCE ||
          !isPlayerMemberDirectRouteSafe(renderX, renderY, target)) {
          member.returning = true;
          resetPlayerMemberReturn(member);
        }
        if (member.returning) {
          const steered = stepPlayerMemberReturn(member, target, returnBudget, step);
          if (steered) {
            // 归队途中朝向自己的前进方向（全队朝向在帧末由 setPlayerFacing 统一写，会被覆盖，
            // 所以这里只记录，最终由 applyPlayerMemberReturnVisuals 在帧末单独下发）
            if (Math.abs(steered.x - renderX) > 0.02) member.returnFacingLeft = steered.x < renderX;
            renderX = steered.x;
            renderY = steered.y;
          } else {
            // 规划失败：能沿红区轮廓滑动就沿轮廓走（这正是「沿屏蔽区移动」的形态），
            // 否则只沿已验证安全的直线回位方向靠近，两条路都不通就本帧原地不动。
            // 绝不允许为了靠近站位而直接穿进屏蔽区
            const slide = slideAlongRedContour({ x: renderX, y: renderY }, target, maxStep);
            if (slide) {
              if (Math.abs(slide.x - renderX) > 0.02) member.returnFacingLeft = slide.x < renderX;
              renderX = slide.x;
              renderY = slide.y;
            } else if (isPlayerMemberDirectRouteSafe(renderX, renderY, target)) {
              renderX += dx / distance * maxStep;
              renderY += dy / distance * maxStep;
            }
          }
        } else {
          renderX += dx / distance * maxStep;
          renderY += dy / distance * maxStep;
        }
      }
      member.renderX = renderX;
      member.renderY = renderY;
      // 「本帧是否真的移动了」按渲染位置位移统计：贴边被安全带夹住时上层只会原地返回，
      // 累计到阈值后由动画层把走路循环换成待机（否则会一直原地踏步）
      if (Math.hypot(renderX - startX, renderY - startY) > PLAYER_MEMBER_ANIM_MOVE_EPSILON) {
        member.renderIdleMs = 0;
      } else {
        member.renderIdleMs = Math.min(member.renderIdleMs + step, PLAYER_MEMBER_ANIM_IDLE_DELAY * 4);
      }
      member.character.setPosition(renderX, renderY);
      if (member.shadow) {
        member.shadow.setPosition(renderX, renderY + SHADOW_OFFSET_Y);
      }
      // 碰撞体跟随实际渲染位置：判定位置与看到的画面永远是同一个位置
      if (member.body) {
        member.body.x = renderX;
        member.body.y = renderY;
      }
    });
  }

  // ----------------------------------------------------
  // 我方单位行动动画流程（状态 -> 动画）
  // 目标动画只由移动状态推导，且同名动画只下发一次：Spine 的 setAnimation 会
  // 重建 TrackEntry 并把 trackTime 归零，逐帧重复下发同一条动画会让角色
  // 永远停在第一帧。一次性动画（攻击）播放期间加锁，锁结束后自动接回
  // move / wait，因此绕行红区的整个过程动画不会被移动逻辑打断。
  // 小队三名角色共用同一份动画状态，动作始终同步。
  // ----------------------------------------------------
  function getPlayerAnimationDurationMs(squad, name) {
    // 锁定时间取三名角色中最长的一条，保证全员播完再切回循环动画
    let duration = 0;
    forEachPlayerCharacter(squad, character => {
      const animation = character && character.findAnimation
        ? character.findAnimation(name)
        : null;
