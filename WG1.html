      const current = animation && animation.duration > 0 ? animation.duration * 1000 : 0;
      if (current > duration) duration = current;
    });
    return duration > 0 ? duration : PLAYER_ATTACK_ANIMATION_FALLBACK;
  }

  // 循环动画（move / wait）：状态未变化时不下发，避免打断正在播放的动画
  function setPlayerAnimation(squad, name) {
    if (!squad.members.length) return;
    if (squad.animLockName && performance.now() < squad.animLockUntil) return;
    squad.animLockName = null;
    if (squad.animName === name) return;
    squad.animName = name;
    squad.members.forEach(member => {
      // 正在归队/归位的队员自己走自己的：动画交给 applyPlayerMemberReturnVisuals 单独维护，
      // 这里既不下发也不清除它的标记，避免把它的走路循环重置到第一帧
      if (member.returning || member.regrouping) return;
      if (member.alive === false) return;
      if (!member.character || member.character.active === false) return;
      member.animOverride = null;
      member.character.setAnimation(0, name, true);
    });
  }

  // 一次性动画（攻击）：允许重新触发，并在播放期间加锁，防止被 move / wait 截断
  function playPlayerAttackAnimation(squad) {
    if (!squad.members.length) return;
    squad.animName = 'attack';
    squad.animLockName = 'attack';
    squad.animLockUntil = performance.now() + getPlayerAnimationDurationMs(squad, 'attack') +
      PLAYER_ANIMATION_LOCK_GRACE;
    // 攻击接管全队动画（归队队员也要开火）：标记归队队员的独立动画已失效，
    // 锁结束后由 applyPlayerMemberReturnVisuals 重新下发移动动画
    squad.members.forEach(member => {
      if (member.returning) member.animOverride = 'attack';
    });
    forEachPlayerCharacter(squad, character => character.setAnimation(0, 'attack', false));
  }

  // 小队动画交叉淡化配置：攻击与移动/待机互相淡入淡出，
  // 状态切换时姿势平滑过渡，不会出现硬切造成的跳帧感。
  // 美术资源缺少某条动画时 setMix 会抛错，忽略该条即可，其余交叉淡化仍然生效
  function configurePlayerAnimationMixing(squad) {
    const mixes = [
      ['attack', 'move', PLAYER_ANIMATION_MIX_ATTACK],
      ['attack', 'wait', PLAYER_ANIMATION_MIX_ATTACK],
      ['move', 'attack', PLAYER_ANIMATION_MIX_ATTACK],
      ['wait', 'attack', PLAYER_ANIMATION_MIX_ATTACK],
      ['move', 'wait', PLAYER_ANIMATION_MIX_LOOP],
      ['wait', 'move', PLAYER_ANIMATION_MIX_LOOP]
    ];
    forEachPlayerCharacter(squad, character => {
      if (!character || typeof character.setMix !== 'function') return;
      mixes.forEach(pair => {
        try {
          character.setMix(pair[0], pair[1], pair[2]);
        } catch (error) {
          // 该角色没有这对动画，跳过
        }
      });
    });
  }

  // 攻击中下达移动指令：立即解除一次性动画锁。
  // 锁不清除的话 move 动画要等攻击播完才切得过去，点击后会有明显延迟
  function interruptPlayerAttackAnimation(squad) {
    squad.animLockName = null;
    squad.animLockUntil = 0;
  }

  // 掉队归队队员的独立动画与朝向：小队其余成员的动作由全队移动状态决定，
  // 而归队队员是自己走自己的，所以单独播 move 并朝自己的前进方向转身。
  // 必须在 setPlayerFacing 之后调用（全队朝向会覆盖单个队员的朝向），
  // 且攻击等一次性动画播放期间整体跳过，让攻击动画能完整播完
  // 给单个队员下发循环动画：正在播同一条时既不下发也不改标记。
  // Spine 重建 TrackEntry 会把 trackTime 归零，重复下发同名动画会让走路循环定格在第一帧，
  // 因此「归队状态反复进出」和「进入归队时本来就在走路」都必须走这条同名跳过逻辑。
  // timeScale 用于把脚步速率对齐实际移动速度（加速追赶时不下滑）
  function setPlayerMemberAnimation(member, name, timeScale = 1) {
    const scale = timeScale > 0.05 ? timeScale : 1;
    if (member.animOverride === name) {
      applyPlayerMemberAnimationSpeed(member, scale);
      return;
    }
    member.animOverride = name;
    const current = member.character.state.getCurrent(0);
    if (current && current.animation.name === name) {
      applyPlayerMemberAnimationSpeed(member, scale);
      return;
    }
    member.character.setAnimation(0, name, true);
    applyPlayerMemberAnimationSpeed(member, scale);
  }

  // 同步单条动画的播放速率：差异很小时不写回，避免逐帧赋值与由此产生的抖动
  function applyPlayerMemberAnimationSpeed(member, scale) {
    const previous = member.animSpeed === undefined ? 1 : member.animSpeed;
    if (Math.abs(previous - scale) < 0.02) return;
    member.animSpeed = scale;
    const track = member.character && member.character.active !== false && member.character.state
      ? member.character.state.getCurrent(0)
      : null;
    if (track) track.timeScale = scale;
  }

  function applyPlayerMemberReturnVisuals(squad) {
    if (!squad.members.length) return;
    if (squad.animLockName && performance.now() < squad.animLockUntil) return;
    const name = squad.unit.isMoving ? 'move' : 'wait';
    squad.members.forEach(member => {
      if (member.alive === false || !member.character || member.character.active === false) return;
      if (member.returning || member.regrouping) {
        // 归队/归位中的队员自己走自己的：播 move 并朝自己的前进方向转身，
        // 播放速率对齐自己的实际移动速度（队伍行军时也不会打滑或原地踏步）。
        // 被安全带夹住而这一帧真的没有位移时改播待机，动画与实际移动始终一致
        const moving = member.renderIdleMs < PLAYER_MEMBER_ANIM_IDLE_DELAY;
        let scale = 1;
        if (moving && !member.returning) scale = member.regroupSpeedRatio || 1;
        setPlayerMemberAnimation(member, moving ? 'move' : 'wait', scale);
        member.character.setScale(
          member.returnFacingLeft ? -PLAYER_CHARACTER_SCALE : PLAYER_CHARACTER_SCALE,
          PLAYER_CHARACTER_SCALE
        );
        return;
      }
      // 归队结束：交回全队动画（同名跳过，反复进出归队状态不会来回重置走路循环）
      setPlayerMemberAnimation(member, name);
    });
  }

  // 每帧根据移动状态同步动画，保证动画与移动状态一致
  function refreshPlayerAnimation(squad) {
    setPlayerAnimation(squad, squad.unit.isMoving ? 'move' : 'wait');
    applyPlayerMemberReturnVisuals(squad);
  }

  function setPlayerFacing(squad, isLeft) {
    if (!squad.members.length) {
      forEachPlayerCharacter(squad, character => character.setScale(
        isLeft ? -PLAYER_CHARACTER_SCALE : PLAYER_CHARACTER_SCALE,
        PLAYER_CHARACTER_SCALE
      ));
      return;
    }
    // 归队/归位中的队员朝向自己的前进方向，由 applyPlayerMemberReturnVisuals 单独下发。
    // 这里跳过它们，否则帧末的攻击等一次性朝向会把它们的朝向改回全队朝向
    squad.members.forEach(member => {
      if (member.alive === false || !member.character || member.character.active === false) return;
      if (member.returning || member.regrouping) return;
      member.character.setScale(
        isLeft ? -PLAYER_CHARACTER_SCALE : PLAYER_CHARACTER_SCALE,
        PLAYER_CHARACTER_SCALE
      );
    });
  }

  // ----------------------------------------------------
  // 4. 逐帧主循环
  // ----------------------------------------------------
  function update(time, delta) {
    const scene = this;
    // 红区几何查询的帧内缓存每帧开头清空一次（同帧内单位位置变化不影响按坐标缓存的结果）
    clearRedQueryCaches();
    // 相机夹取：把可视范围限制在地图内（大于地图时兜底居中），避免露出地图以外的空白区域
    clampCameraToWorld();
    // 自爆的相机推拉震动先推进：随后同步浮动文字尺寸时读到的就是本帧最终的相机缩放，
    // 文字仍按屏幕像素保持恒定大小，不会跟着抖动忽大忽小
    updateExplosionShake(delta);
    // 浮动文字的显示尺寸每帧同步一次：相机缩放或窗口大小变化时屏幕尺寸保持恒定
    updateCombatTextScale();
    // 我方自然回血先结算，本帧血条就能反映最新的生命值
    updatePlayerSquadRegen(time, delta);
    // Spine 小队按阵型跟随各自的物理锚点（含红区净空与人员隔离约束）；
    // 传入 delta 让阵型形态与队形旋转按时间缓动，帧率变化时过渡速度保持一致
    playerSquads.forEach(squad => updatePlayerSquad(squad, delta));
    // 血条耗尽的队员：柔和泛红 -> 脱离阵型冲向最近的敌人（保留移动动画）-> 满 5 秒自爆
    // （阵型摆放已把他们排除在外）
    playerSquads.slice().forEach(squad => {
      squad.members.slice().forEach(member => {
        if (member.charging) updatePlayerMemberCharge(member, time, delta);
      });
    });
    // 小队再无存活队员：立刻结束这支小队的出战状态（阵亡队员的自爆动画仍会继续演完，
    // 因此要等最后一名队员的冲锋自爆落地、members 清空后才退役整支小队）
    playerSquads.slice().forEach(squad => {
      if (squad.unit && squad.unit.isSpawned && squad.members.length === 0) {
        handlePlayerSquadWipe(squad);
      }
    });
    // 出生动画期间：体型由小到大淡入，落地光环向外扩散，动画播完才允许行动
    if (hasActivePlayerSpawnAnimation()) {
      updatePlayerSpawnAnimation(time);
    } else {
      updateSpawnBeaconIdle(time);
    }
    // 出生界面：按钮永远固定在屏幕左上角，点数与进度每帧刷新
    updateSpawnHud(time, delta);
    playerSquads.forEach(squad => {
      if (squad.unit.isMoving && squad.unit.body &&
          Math.abs(squad.unit.body.velocity.x) > 0.01) {
        setPlayerFacing(squad, squad.unit.body.velocity.x < 0);
      }
    });
    selectionCircle.clear();
    attackRangeGraphics.clear();
    let selectionVisible = false;
    let attackRangeVisible = false;
    playerSquads.forEach(squad => {
      if (!squad.unit.isSpawned || !squad.unit.isSelected) return;
      // 每名存活队员脚下各自一个蓝色圆环，阵型拉开或挤压时都能看清选中范围
      const ringMembers = getLivingPlayerMembers(squad);
      if (ringMembers.length) {
        selectionVisible = true;
        selectionCircle.lineStyle(2, 0x3da9ff, 0.95);
        selectionCircle.fillStyle(0x3da9ff, 0.18);
        ringMembers.forEach(member => {
          const ringX = member.character.x;
          const ringY = member.character.y + PLAYER_RING_OFFSET_Y;
          selectionCircle.fillEllipse(ringX, ringY, PLAYER_RING_WIDTH, PLAYER_RING_HEIGHT);
          selectionCircle.strokeEllipse(ringX, ringY, PLAYER_RING_WIDTH, PLAYER_RING_HEIGHT);
        });
      }
      attackRangeVisible = true;
      // 黑色边框的短宽白线组成的射程圆（线型由 drawAttackRangeMarkers 内部设置）
      drawAttackRangeMarkers(attackRangeGraphics, squad.unit.x, squad.unit.y, PLAYER_ATTACK_RANGE, time);
    });
    selectionCircle.setVisible(selectionVisible);
    attackRangeGraphics.setVisible(attackRangeVisible);
    // 小队血条与番号：始终跟在存活队员头顶上方（8 像素间隙，不遮挡人物）
    updatePlayerSquadHud();

    // 出售表现：双击呼出后，在小队外面画一圈黄色细线圆环（圆环外 20 像素是淡黄色渲染带），
    // 圆环正下方放一个六边形「$」出售按钮。同一时刻只会有一支小队展开出售面板
    sellRingGraphics.clear();
    let sellIndex = 0;
    playerSquads.forEach(squad => {
      if (!squad.unit || !squad.unit.isSpawned || !squad.sellPanelOpen) return;
      const outerRadius = getPlayerSquadOuterRadius(squad);
      // 圆环在单位外沿之外再外扩 SELL_RING_CLEARANCE，避免压到角色身上、遮住单位显示；
      // 整体再上移 SELL_RING_OFFSET_Y，与角色视觉重心对齐
      const ringInnerEdge = outerRadius + SELL_RING_CLEARANCE;
      const ringRadius = ringInnerEdge + SELL_RING_WIDTH / 2;
      const ringOuterEdge = ringInnerEdge + SELL_RING_WIDTH;
      const ringCenterX = squad.unit.x;
      const ringCenterY = squad.unit.y - SELL_RING_OFFSET_Y;
      // 淡黄色渲染带：画在圆环外侧，不遮挡单位
      sellRingGraphics.lineStyle(SELL_GLOW_BAND, SELL_GLOW_COLOR, SELL_GLOW_ALPHA);
      sellRingGraphics.strokeCircle(ringCenterX, ringCenterY, ringOuterEdge + SELL_GLOW_BAND / 2);
      // 黄色圆环细线
      sellRingGraphics.lineStyle(SELL_RING_WIDTH, SELL_RING_COLOR, 1);
      sellRingGraphics.strokeCircle(ringCenterX, ringCenterY, ringRadius);
      if (sellIndex < sellButtons.length) {
        const entry = sellButtons[sellIndex++];
        entry.squad = squad;
        // 按钮直径 = 单位高度（2 × 外沿半径）× 比例，随小队实际大小协调缩放
        const diameter = outerRadius * 2 * SELL_BUTTON_HEIGHT_RATIO;
        entry.container.setScale(diameter / (SELL_BUTTON_RADIUS * 2));
        entry.container.setVisible(true);
        entry.container.setPosition(
          ringCenterX,
          ringCenterY + ringOuterEdge + SELL_BUTTON_GAP + diameter / 2
        );
      }
    });
    for (; sellIndex < sellButtons.length; sellIndex++) {
      sellButtons[sellIndex].container.setVisible(false);
      sellButtons[sellIndex].squad = null;
    }

    // 移动目标点标记：每支正在移动的小队一个「上实心蓝倒三角 + 下脚底圆环」组合目标点，
    // 显示数量与当前被选中小队数一致（框选/单选几支就显示几个，多出的标记隐藏）。
    // 倒三角在圆环正上方按 sin 上下浮动，抵达后随 moveTarget 清空一起隐藏
    {
      const bob = Math.sin(time * TARGET_MARKER_BOB_SPEED) * TARGET_MARKER_BOB_AMPLITUDE;
      let markerIndex = 0;
      playerSquads.forEach(squad => {
        if (!squad.unit || !squad.unit.isSpawned || !squad.moveTarget) return;
        if (markerIndex >= targetMarkers.length) return;
        const marker = targetMarkers[markerIndex++];
        marker.container.setVisible(true);
        marker.container.setPosition(squad.moveTarget.x, squad.moveTarget.y);
        marker.triangle.y = TARGET_MARKER_TRIANGLE_Y + bob;
      });
      for (; markerIndex < targetMarkers.length; markerIndex++) {
        targetMarkers[markerIndex].container.setVisible(false);
      }
    }

    // 集火标记：被集火敌方角色四角的红色圆角边线，沿各自对角方向向外/向内反复移动 2px。
    // 包围盒固定 50×50，中心对齐角色视觉中心（锚点上方 17 像素）
    focusMarkGraphics.clear();
    if (focusTarget && focusTarget.active && !focusTarget.charging &&
        focusTarget.character && focusTarget.character.active !== false) {
      const character = focusTarget.character;
      const cx = character.x;
      const cy = character.y + FOCUS_BRACKET_CENTER_OFFSET_Y;
      const half = FOCUS_BRACKET_SIZE * 0.5;
      const arm = FOCUS_BRACKET_ARM;
      const corner = FOCUS_BRACKET_RADIUS;
      const off = Math.sin(time * FOCUS_BRACKET_SPEED) * FOCUS_BRACKET_OFFSET;
      focusMarkGraphics.lineStyle(2, 0xff3333, 0.95);
      // 左上：角点 (cx - half - off, cy - half - off)，向外方向 (-1,-1)，括号开口朝右下
      drawFocusCornerBracket(focusMarkGraphics, cx - half - off, cy - half - off, -1, -1, arm, corner);
      // 右上：角点 (cx + half + off, cy - half - off)，向外方向 (1,-1)，括号开口朝左下
      drawFocusCornerBracket(focusMarkGraphics, cx + half + off, cy - half - off, 1, -1, arm, corner);
      // 左下：角点 (cx - half - off, cy + half + off)，向外方向 (-1,1)，括号开口朝右上
      drawFocusCornerBracket(focusMarkGraphics, cx - half - off, cy + half + off, -1, 1, arm, corner);
      // 右下：角点 (cx + half + off, cy + half + off)，向外方向 (1,1)，括号开口朝左上
      drawFocusCornerBracket(focusMarkGraphics, cx + half + off, cy + half + off, 1, 1, arm, corner);
      focusMarkGraphics.strokePath();
    }

    // 排队的曲线绕行规划：按帧时间预算推进，多支小队同帧下达指令时不再一次性卡住整帧。
    // 放在移动主循环之前，本帧刚规划好的路径可以立刻被下面的循环使用
    processPlayerPathQueue(scene, time);

    // --------------------------------------------------
    // 逻辑 1：RTS 玩家单位移动与到达距离容差控制（逐小队独立结算）
    // --------------------------------------------------
    playerSquads.forEach(squad => {
      const unit = squad.unit;
      if (!unit.isSpawned || !squad.moveTarget) return;
      const origin = { x: unit.x, y: unit.y };
      const stepBudget = Math.max(0.6, UNIT_SPEED * delta / 1000);
      const arriveDistance = Math.max(PLAYER_RED_ARRIVE_DISTANCE, stepBudget * 1.02);
      let waypoint = squad.detourPath[0] || squad.moveTarget;
      if (Phaser.Math.Distance.Between(origin.x, origin.y, waypoint.x, waypoint.y) <= arriveDistance) {
        squad.detourPath.shift();
        waypoint = squad.detourPath[0] || null;
      }
      if (!waypoint) {
        unit.body.reset(squad.moveTarget.x, squad.moveTarget.y);
        squad.moveTarget = null;
        squad.detourPath = [];
        unit.isMoving = false;
        squad.replanKey = null;
        resetPlayerMoveProgress(squad, time);
      } else if (updatePlayerMoveProgress(squad, time)) {
        // 终点在死角里、已经贴到最近的可站位置：本帧不再驱动移动
      } else {
        let steer = getPlayerSteeringTarget(origin, waypoint, stepBudget);
        if (!steer) {
          // 当前朝向被红区安全带挡住：只在真正卡住时重新规划，且按冷却限流，
          // 避免「同一个位置反复失败 → 逐帧全量寻路」把主线程拖死
          const replanKey = `${Math.round(origin.x)}:${Math.round(origin.y)}:` +
            `${Math.round(waypoint.x)}:${Math.round(waypoint.y)}`;
          if (replanKey !== squad.replanKey && time >= squad.replanAt) {
            squad.replanKey = replanKey;
            squad.replanAt = time + PLAYER_RED_REPLAN_COOLDOWN;
            const replanned = getShortestPlayerPath(origin, squad.moveTarget);
            if (replanned && replanned.length) {
              squad.detourPath = replanned;
              waypoint = squad.detourPath[0];
              steer = getPlayerSteeringTarget(origin, waypoint, stepBudget);
            }
          }
        }
        if (!steer && waypoint !== squad.moveTarget) {
          // 冷却期间也必须继续走：绕开当前拐点，直接以最终终点为参照再求一次转向
          // （内含「推离安全带」与「沿红区轮廓滑动」两级兜底），避免停在原地无限寻路
          steer = getPlayerSteeringTarget(origin, squad.moveTarget, stepBudget);
        }
        if (!steer) {
          unit.body.stop();
          unit.isMoving = false;
        } else {
          squad.replanKey = null;
          unit.isMoving = true;
          scene.physics.moveToObject(unit, steer, UNIT_SPEED);
          setPlayerFacing(squad, steer.x < unit.x);
        }
      }
    });

    // 本帧移动状态确定后统一下发动画；攻击动画播放期间由锁保护，不会被这里打断
    playerSquads.forEach(squad => refreshPlayerAnimation(squad));

    // 逻辑 2：玩家单位自动索敌与攻击（未出兵的小队不参与战斗）
    playerSquads.forEach(squad => {
      const unit = squad.unit;
      if (!unit.isSpawned || unit.isMoving || time < unit.nextAttackAt) return;
      let closestEnemy = null;
      let minDistance = PLAYER_ATTACK_RANGE;

      enemiesGroup.getChildren().forEach(enemy => {
        if (!enemy.active || enemy.charging) return;
        const dist = Phaser.Math.Distance.Between(unit.x, unit.y, enemy.x, enemy.y);
        if (!(dist < PLAYER_ATTACK_RANGE)) return;
        // 红色屏蔽区判定：我方与目标之间的直线只要穿过屏蔽区就无法攻击该目标，
        // 该目标直接跳过（会自动改打其他直线畅通的目标）
        if (isRedZonePathCrossed(unit.x, unit.y, enemy.x, enemy.y)) return;
        // 集火目标优先：射程覆盖它的我方单位一律优先攻击它（不区分是否被选中）
        if (enemy === focusTarget) {
          closestEnemy = enemy;
          minDistance = dist;
        } else if (!closestEnemy && dist < minDistance) {
          minDistance = dist;
          closestEnemy = enemy;
        }
      });

      if (closestEnemy) {
        setPlayerFacing(squad, closestEnemy.x < unit.x);
        // 三名队员齐射：单发实伤 = 我方攻击力 3 与敌方护甲 8 结算后的破甲加成伤害
        const volleyDamage = getLivingPlayerMembers(squad).length * PLAYER_DAMAGE_PER_HIT;
        damageEnemy(this, closestEnemy, volleyDamage);
        unit.nextAttackAt = time + PLAYER_ATTACK_INTERVAL;
        playPlayerAttackAnimation(squad);
      }
    });

    // --------------------------------------------------
    // 逻辑 3：敌军沿着 Waypoints 路线自动寻路
    // --------------------------------------------------
    enemiesGroup.getChildren().forEach(enemy => {
      if (!enemy.active) return;

      // 血条耗尽的敌人：原地泛红 -> 满 3 秒原地自爆，期间不再走路线逻辑
      if (enemy.charging) {
        updateEnemyDeath(enemy, time);
        return;
      }

      // 被自爆击退：先按匀速位移推进本帧的击退步长（落点照旧过可行走 + 红区安全带校验），
      // 再进入本帧的追踪 / 行军逻辑，被炸飞的单位本身不会因此中断自己的行动
      updateEnemyKnockback(enemy, delta);

      enemy.character.setPosition(enemy.x, enemy.y);
      updateEnemyHealthBar(enemy);

      // 追踪 / 交火的距离参照：到「最近的存活队员」的距离（与追踪目标点同源），
      // 因此判定射程与开火命中始终指向同一名队员
      const trackGap = getEnemyTrackGap(enemy);
      // 入场阶段：出生点在地图外，此时不做可行走/红区判定，也不参与追击与交火，
      // 只沿入场线走向该路线第一个地图内的节点，走进地图后切回常规路线推进
      if (enemy.routeState === 'entering') {
        const entry = getSafeRouteTarget(enemy);
        if (!entry) {
          // 这条变体没有一个可走的节点：不进入待机循环，直接转入终点自由待机
          beginEnemyEndpointRoam(enemy, time);
          return;
        }
        enemy.waypointIndex = entry.index;
        if (isEnemyPoseWalkable(enemy) ||
            Phaser.Math.Distance.Between(enemy.x, enemy.y, entry.target.x, entry.target.y) < 6) {
          enemy.routeState = 'following';
          enemy.replanTargetKey = null;
          enemy.replanAttemptedKey = null;
        } else if (hasSpawnedPlayerSquad() && trackGap <= ENEMY_TRACK_RANGE &&
                   enemy.x >= 0 && enemy.x <= WORLD_WIDTH &&
                   enemy.y >= 0 && enemy.y <= WORLD_HEIGHT) {
          // 兜底：已经走进地图范围（只是当前踩在不可行走的格子上）时，我方人形进入跟踪范围
          // 也要立刻转入追踪交火，避免出现「明明进了射程却只顾赶路、不进攻击逻辑」的空档
          beginEnemyTrack(enemy, time);
          updateEnemyTracking(enemy, time, trackGap, delta);
        } else {
          advanceEnemyTowards(enemy, entry.target, delta);
          syncEnemyFacing(enemy, entry.target);
          setEnemyAnimation(enemy, 'move', true);
        }
        enemy.character.setPosition(enemy.x, enemy.y);
        return;
      }
      // 行动点待机期间先做一次判定：玩家已进入追踪范围就转入追踪，路线被红区挡住就提前改道
      if (enemy.routeState === 'holding') {
        decideEnemyActionPoint(enemy, time, trackGap);
      }
      // 追踪状态独立处理：按 300 像素/秒逼近锁定的我方队员，追到交火距离边缘（100 像素）
      // 就停下交火——人在交火带内姿态恒为攻击动作，重新进入也不经过等待动作；
      // 拉出交火带（100 + 12 = 112 像素）就立刻打断攻击动画转入移动动画；
      // 只有拉开到追踪范围 + 迟滞带（160 + 16 = 176 像素）之外才放弃追踪，
      // 随即从当前位置走向下一个行动点
      if (enemy.routeState === 'tracking') {
        updateEnemyTracking(enemy, time, trackGap, delta);
        enemy.character.setPosition(enemy.x, enemy.y);
        return;
      }
      // 我方单位还没出生时敌军不会对出生点发起攻击；
      // 玩家一进入追踪范围就立即转入智能追踪（逼近还是开火由追踪逻辑按距离决定），
      // 没有任何冷却等待，所以不会出现「明明在射程内却站着不动」的迟滞
      if (hasSpawnedPlayerSquad() && trackGap <= ENEMY_TRACK_RANGE) {
        beginEnemyTrack(enemy, time);
        updateEnemyTracking(enemy, time, trackGap, delta);
        enemy.character.setPosition(enemy.x, enemy.y);
        return;
      }

      let currentTarget;
      if (enemy.routeState === 'holding') {
        enemy.body.stop();
        setEnemyAnimation(enemy, 'wait', true);
        // 待机期间发现下一路线节点被红区挡住，就提前转入绕行（不等待机结束）
        const nextRoutePoint = getEnemyNextRoutePoint(enemy);
        const holdingPathBlocked = nextRoutePoint && (
          !isEnemyPoseWalkable(enemy) ||
          !isRedZoneClearanceSafePath({ x: enemy.x, y: enemy.y }, nextRoutePoint)
        );
        if (holdingPathBlocked && replanEnemyToNextPoint(enemy, nextRoutePoint, time)) {
          enemy.routeState = 'detouring';
          currentTarget = enemy.detourPath[0];
        } else if (time < enemy.holdUntil) {
          return;
        } else {
          // 待机结束：先做两轮「周身随机移动」，再回到主路线继续推进
          enemy.replanTargetKey = null;
          enemy.roamTarget = chooseEnemyRoamTarget(enemy);
          if (!enemy.roamTarget) {
            beginEnemyHold(enemy, time);
            return;
          }
          enemy.routeState = 'roaming';
        }
      }

      if (enemy.detourPath.length) {
        currentTarget = enemy.detourPath[0];
        if (Phaser.Math.Distance.Between(enemy.x, enemy.y, currentTarget.x, currentTarget.y) < 6) {
          enemy.detourPath.shift();
          if (!enemy.detourPath.length) {
            enemy.routeState = 'following';
            enemy.replanTargetKey = null;
            enemy.replanAttemptedKey = null;
            currentTarget = getEnemyNextRoutePoint(enemy);
            if (!currentTarget) {
              beginEnemyEndpointRoam(enemy, time);
              return;
            }
          } else {
            currentTarget = enemy.detourPath[0];
          }
        }
      } else if (enemy.routeState === 'roaming') {
        currentTarget = enemy.roamTarget;
        // 巡逻硬约束：任何原因（沿红区滑动、绕行、被友军推挤）导致越出行动点
        // ENEMY_PATROL_RADIUS 范围（隔离推挤再留 45 像素余量）时，立刻把目标改回行动点，
        // 队伍只会折返而不会越跑越远
        if (currentTarget && enemy.actionPointX != null) {
          const fromActionPoint = Phaser.Math.Distance.Between(
            enemy.x, enemy.y, enemy.actionPointX, enemy.actionPointY
          );
          if (fromActionPoint > ENEMY_PATROL_RADIUS + ENEMY_PATROL_SLACK) {
            enemy.roamTarget = { x: enemy.actionPointX, y: enemy.actionPointY };
            currentTarget = enemy.roamTarget;
          }
        }
        if (Phaser.Math.Distance.Between(enemy.x, enemy.y, currentTarget.x, currentTarget.y) < 6) {
          enemy.holdCycles++;
          if (enemy.holdCycles >= 2) {
            enemy.holdCycles = 0;
            if (enemy.routeFinished) {
              beginEnemyEndpointRoam(enemy, time);
              return;
            }
            // 从行动点出发：重新随机挑一条走廊变体，多支敌军不会挤在同一条线上
            rerollEnemyRoute(enemy);
            enemy.routeState = 'following';
            enemy.roamTarget = null;
          } else {
            beginEnemyHold(enemy, time);
          }
          return;
        }
      } else if (enemy.routeState === 'endpoint') {
        // 终点待机的静止阶段：只站桩，不做任何移动计算；静止到期后在终点待机区域里挑下一个落点
        enemy.body.stop();
        setEnemyAnimation(enemy, 'wait', true);
        // 被推到待机区域之外（挤到地图边缘死角、被追踪带走等）时不在这里空等，直接沿路线走回终点
        if (isEnemyFarFromTerminal(enemy) && resumeEnemyRouteToTerminal(enemy)) return;
        if (time < enemy.idleUntil) return;
        const endpointSpot = chooseEnemyEndpointRoamTarget(enemy);
        if (!endpointSpot) {
          // 终点区域暂时挑不出合法落点（红区、边界或友军占满）：再静止一轮
          enemy.idleUntil = time + ENEMY_ENDPOINT_IDLE_MAX;
          return;
        }
        enemy.roamTarget = endpointSpot;
        enemy.routeState = 'endpointRoam';
        currentTarget = endpointSpot;
      } else if (enemy.routeState === 'endpointRoam') {
        // 终点自由待机：在终点 ENEMY_ENDPOINT_ROAM_RADIUS 像素范围内散步，
        // 走到落点就回到静止阶段。越出待机区域（隔离推挤再留一点余量）立刻折返终点，
        // 队伍始终待在终点区域里，不会顺着隔离推挤一路漂出去
        currentTarget = enemy.roamTarget;
        if (!currentTarget) {
          beginEnemyEndpointIdle(enemy, time);
          return;
        }
        // 已经被带到待机区域之外时先回位：沿路线走回终点比朝终点直线插过去更稳（直线可能横穿红区）
        if (isEnemyFarFromTerminal(enemy) && resumeEnemyRouteToTerminal(enemy)) return;
        if (Phaser.Math.Distance.Between(enemy.x, enemy.y, enemy.terminalX, enemy.terminalY) >
            ENEMY_ENDPOINT_ROAM_RADIUS + ENEMY_PATROL_SLACK) {
          enemy.roamTarget = { x: enemy.terminalX, y: enemy.terminalY };
          currentTarget = enemy.roamTarget;
        }
        if (Phaser.Math.Distance.Between(enemy.x, enemy.y, currentTarget.x, currentTarget.y) < 6) {
          beginEnemyEndpointIdle(enemy, time);
          return;
        }
      } else {
        const routeTarget = getSafeRouteTarget(enemy);
        if (!routeTarget) {
          beginEnemyEndpointRoam(enemy, time);
          return;
        }
        enemy.waypointIndex = routeTarget.index;
        currentTarget = routeTarget.target;
        const dist = Phaser.Math.Distance.Between(enemy.x, enemy.y, currentTarget.x, currentTarget.y);
        // 正常以 6 像素判抵达；点被友军占住时（相距不到半个隔离距离）也算抵达，
        // 否则被推挤顶在点外的单位会一直围着这个点抖动，后方队伍跟着一起堵死
        if (dist < 6 || (dist < ENEMY_SEPARATION_DISTANCE * 1.5 && isRoutePointClaimed(enemy, currentTarget))) {
          const reachedIndex = enemy.waypointIndex;
          enemy.waypointIndex++;
          if (enemy.waypointIndex >= enemy.route.length) {
            // 最后一个节点是该路线的终点：到达后不再销毁敌人，
            // 转入「终点 375 像素范围内自由待机」，而不是钉死在这一个点上互相推挤
            beginEnemyEndpointRoam(enemy, time);
            return;
          }
          // 首节点是地图外的入场节点，不计入「每经过两个点位待机一次」的推进节奏
          if (reachedIndex > ENEMY_ROUTE_ENTRY_COUNT &&
              (reachedIndex - ENEMY_ROUTE_ENTRY_COUNT) % 2 === 0) {
            // 每经过两个点位进行两轮“待机五秒 -> 周身随机移动”。
            beginEnemyHold(enemy, time, true);
            return;
          }
          currentTarget = enemy.route[enemy.waypointIndex];
        }
      }

      const wantsMove = Boolean(currentTarget);
      // 直线净空就直接朝目标点走；接近屏蔽区时改走沿红区外沿的滑动点，避免撞上红区急停
      const steeredTarget = wantsMove ? steerEnemyTowards(enemy, currentTarget, delta) : null;
      if (steeredTarget) {
        advanceEnemyTowards(enemy, steeredTarget, delta);
        // 以实际行进方向同步镜像；这一步没有产生位移时才使用路线目标作为后备。
        syncEnemyFacing(enemy, currentTarget);
        setEnemyAnimation(enemy, 'move', true);
      } else {
        enemy.body.stop();
        setEnemyAnimation(enemy, 'wait', true);
        // 站位本身落在不可行走区域时先走出去：否则本帧之后的一切地形判定都会因非法起点判死
        if (stepEnemyOutOfUnwalkable(enemy, delta)) {
          enemy.character.setPosition(enemy.x, enemy.y);
          return;
        }
        if (enemy.routeState === 'roaming') {
          beginEnemyHold(enemy, time);
        } else if (enemy.routeState === 'endpointRoam') {
          // 终点的落点走不过去（被红区或友军挡住）：放弃这个点，静止一轮后再挑
          beginEnemyEndpointIdle(enemy, time);
        } else if (currentTarget) {
          // 行进或待机时碰撞屏蔽区时改走最短安全绕行曲线（内部带重试冷却）
          if (replanEnemyToNextPoint(enemy, currentTarget, time) && enemy.routeState === 'following') {
            enemy.routeState = 'detouring';
          }
        }
      }
      // 卡顿兜底：想走却长时间几乎没有位移说明被屏蔽区或边界卡住，
      // 清掉绕行缓存强制重规划一次；仍然无解就跳过当前路线点，避免敌军永久停在原地。
      // 终点自由待机不做重规划——换一个落点比画绕行曲线更省事，也不会把绕行路径甩到待机区域之外
      if (isEnemyStuck(enemy, time, wantsMove)) {
        if (enemy.routeState === 'endpointRoam') {
          beginEnemyEndpointIdle(enemy, time);
          enemy.character.setPosition(enemy.x, enemy.y);
          return;
        }
        enemy.detourPath = [];
        enemy.replanAttemptedKey = null;
        if (!replanEnemyToNextPoint(enemy, currentTarget, time, true) && enemy.routeState === 'following') {
          const skipped = getSafeRouteTarget(enemy);
          if (skipped) enemy.waypointIndex = skipped.index + 1;
        }
      }
      enemy.character.setPosition(enemy.x, enemy.y);
    });

    // 逻辑 3.5：敌方单位的碰撞隔离——在全部单位完成本帧位移之后统一推挤一次，
    // 避免多个单位沿同一条走廊行军时叠在一起（推挤落点同样经过可行走与红区安全带校验）
    separateEnemies();
  }

  // ----------------------------------------------------
  // 浏览器测试钩子（仅调试用）：暴露场景、小队状态与最小寻路测试接口，
  // 供集成浏览器通过 window.__WG__ 出兵、下达移动指令并读取抵达结果。
  // ----------------------------------------------------
  window.__WG__ = {
    get scene() { return gameScene; },
    get squads() { return playerSquads; },
    // 通过左上角出兵按钮的同一代码路径出 1 支小队
    spawn: () => handleSpawnOption('jf'),
    // 选中全部已出场小队
    selectAll: () => {
      getSpawnedPlayerSquads().forEach(squad => { squad.unit.isSelected = true; });
    },
    // 对全部已选中小队下达移动到 (x, y) 的指令（与右键落点分配完全同路径）
    moveSelectedTo: (x, y) => {
      const selected = getSpawnedPlayerSquads().filter(squad => squad.unit.isSelected);
      const goals = resolvePlayerSquadOrderGoals(x, y, selected.length);
      selected.forEach((squad, index) => {
        squad.__wgGoal = goals[index];
        issuePlayerMoveOrder(squad, gameScene, goals[index].x, goals[index].y);
      });
      return goals;
    },
    // 读取当前寻路状态：位置 / 目标 / 剩余节点 / 到目标距离 / 是否在移动
    report: () => playerSquads.filter(squad => squad.unit && squad.unit.isSpawned).map(squad => {
      const goal = squad.moveTarget || squad.__wgGoal || null;
      return {
        id: squad.id,
        sel: !!squad.unit.isSelected,
        x: Math.round(squad.unit.x),
        y: Math.round(squad.unit.y),
        target: squad.moveTarget ? [Math.round(squad.moveTarget.x), Math.round(squad.moveTarget.y)] : null,
        goal: goal ? [Math.round(goal.x), Math.round(goal.y)] : null,
        goalDist: goal
          ? Math.round(Math.hypot(goal.x - squad.unit.x, goal.y - squad.unit.y))
          : 0,
        nodes: squad.detourPath.length,
        moving: !!squad.unit.isMoving,
        members: squad.members.filter(m => m.alive && m.character).map(m => [
          Math.round(m.character.x), Math.round(m.character.y)
        ])
      };
    }),
    // 在世界坐标处模拟一次单击（走与真实点击完全相同的命中判定）
    clickAt: (x, y) => {
      const hit = handleWorldClick(x, y);
      return hit
        ? { enemy: !!hit.enemy, squad: hit.squad ? hit.squad.id : null, focused: !!hit.focused }
        : null;
    },
    // 读取当前点数、训练中单位数与最快完成的那一支的剩余训练时间（毫秒）
    economy: () => ({
      points: Math.floor(playerPoints),
      trainingCount: trainingSquads.length,
      nextReadyRemain: trainingSquads.length
        ? Math.max(0, Math.round(trainingSquads[0].readyAt - (gameScene ? gameScene.time.now : 0)))
        : 0
    }),
    // 读取可见的出售按钮及其页面坐标（用于验证点击出售）
    sellButtons: () => {
      const cam = gameScene.cameras.main;
      const canvas = gameScene.game.canvas;
      const cssScale = canvas.clientWidth / 1920;
      const rect = canvas.getBoundingClientRect();
      return sellButtons.filter(entry => entry.container.visible).map(entry => ({
        squadId: entry.squad ? entry.squad.id : null,
        cssX: Math.round((rect.x + ((entry.container.x - cam.scrollX - cam.width / 2) * cam.zoom + cam.width / 2) * cssScale) * 10) / 10,
        cssY: Math.round((rect.y + ((entry.container.y - cam.scrollY - cam.height / 2) * cam.zoom + cam.height / 2) * cssScale) * 10) / 10
      }));
    },
    // 读取左上角出兵按钮的状态与屏幕坐标（含可点击性），便于验证展开动画期间的点击隔离
    hudButtons: () => {
      const cam = gameScene.cameras.main;
      const canvas = gameScene.game.canvas;
      const cssScale = canvas.clientWidth / 1920;
      const rect = canvas.getBoundingClientRect();
      return spawnHudButtons.map(button => {
        const matrix = button.container.getWorldTransformMatrix();
        const worldX = matrix.tx;
        const worldY = matrix.ty;
        // 世界坐标 -> 游戏内部屏幕坐标（1920×1080 空间）-> 页面 CSS 坐标
        const screenX = (worldX - cam.scrollX - cam.width / 2) * cam.zoom + cam.width / 2;
        const screenY = (worldY - cam.scrollY - cam.height / 2) * cam.zoom + cam.height / 2;
        return {
          key: button.key,
          visible: button.container.visible,
          enabled: !!(button.hitArea && button.hitArea.input && button.hitArea.input.enabled),
          cssX: Math.round((rect.x + screenX * cssScale) * 10) / 10,
          cssY: Math.round((rect.y + screenY * cssScale) * 10) / 10
        };
      });
    },
    // 读取目标点标记状态：显示数 / 位置 / 倒三角浮动偏移
    markers: () => targetMarkers.map(m => ({
      v: m.container.visible,
      x: Math.round(m.container.x),
      y: Math.round(m.container.y),
      triY: Math.round(m.triangle.y * 10) / 10
    })),
    // 读取集火目标与敌方单位状态
    focus: () => ({
      target: focusTarget
        ? { x: Math.round(focusTarget.x), y: Math.round(focusTarget.y), active: focusTarget.active }
        : null,
      enemies: enemiesGroup.getChildren().filter(e => e.active).map(e => ({
        x: Math.round(e.x), y: Math.round(e.y), hp: Math.round(e.hp)
      }))
    })
  };
</script>
